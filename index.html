<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>איירון פיטנס — המערכת</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --navy:#002D48; --green:#6A9F85; --dark:#061827; --bg:#f4f6f8; --line:#e2e8f0; --red:#c0392b; --amber:#d97706; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ margin:0; font-family:'Heebo',-apple-system,"Segoe UI",Rubik,Arial,sans-serif; background:var(--bg); color:var(--dark); }
  button{ font-family:inherit; cursor:pointer; }
  .hidden{ display:none !important; }

  /* התחברות */
  #login{ min-height:100vh; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg,var(--navy),var(--dark)); padding:20px; }
  #login .card{ background:#fff; border-radius:18px; padding:34px 26px; width:100%; max-width:380px; box-shadow:0 20px 60px rgba(0,0,0,.3); }
  #login h1{ text-align:center; color:var(--navy); margin:0 0 4px; font-size:24px; }
  #login .sub{ text-align:center; color:#64748b; margin:0 0 24px; font-size:14px; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:13px; color:#475569; margin-bottom:6px; }
  .field input{ width:100%; padding:12px 14px; border:1px solid var(--line); border-radius:10px; font-size:16px; }
  .field input:focus{ outline:none; border-color:var(--green); }
  .btn{ width:100%; padding:13px; border:none; border-radius:10px; background:var(--navy); color:#fff; font-size:16px; font-weight:600; }
  .btn:active{ opacity:.85; }
  .btn.green{ background:var(--green); }
  .err{ color:var(--red); font-size:13px; text-align:center; margin-top:10px; min-height:18px; }

  /* אפליקציה */
  header{ background:var(--navy); color:#fff; padding:12px 16px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:10; }
  header .who{ font-size:14px; } header .who b{ display:block; font-size:16px; }
  header .role{ font-size:11px; background:var(--green); padding:2px 8px; border-radius:20px; margin-inline-start:8px; }
  header button{ background:rgba(255,255,255,.15); color:#fff; border:none; border-radius:8px; padding:8px 12px; font-size:13px; }
  .tabs{ display:flex; background:#fff; border-bottom:1px solid var(--line); position:sticky; top:56px; z-index:9; overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .tabs button{ flex:none; padding:14px 16px; border:none; background:none; font-size:15px; color:#64748b; border-bottom:3px solid transparent; white-space:nowrap; }
  .tabs button.active{ color:var(--navy); font-weight:700; border-bottom-color:var(--green); }
  .tabs button.jump{ color:var(--green); font-weight:700; }
  main{ padding:16px; max-width:900px; margin:0 auto; }

  .stats{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:20px; }
  .stat{ background:#fff; border-radius:14px; padding:18px; text-align:center; box-shadow:0 1px 3px rgba(0,0,0,.06); }
  .stat .n{ font-size:32px; font-weight:800; color:var(--navy); }
  .stat .l{ font-size:13px; color:#64748b; margin-top:4px; }
  h2.sec{ font-size:16px; color:var(--navy); margin:22px 4px 12px; }

  .toolbar{ display:flex; gap:10px; margin-bottom:14px; }
  .toolbar input{ flex:1; padding:11px 14px; border:1px solid var(--line); border-radius:10px; font-size:15px; }
  .toolbar .add{ background:var(--green); color:#fff; border:none; border-radius:10px; padding:0 18px; font-size:22px; font-weight:700; }

  .lead{ background:#fff; border-radius:12px; padding:14px; margin-bottom:10px; box-shadow:0 1px 3px rgba(0,0,0,.06); display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .lead:active{ background:#f8fafc; }
  .lead .nm{ font-weight:600; font-size:16px; }
  .lead .meta{ font-size:13px; color:#64748b; margin-top:3px; }
  .pill{ font-size:12px; padding:4px 10px; border-radius:20px; white-space:nowrap; }
  .st-new{ background:#e0e7ff; color:#3730a3; } .st-rel{ background:#dcfce7; color:#166534; }
  .st-no{ background:#fee2e2; color:#991b1b; } .st-def{ background:#f1f5f9; color:#475569; }
  .empty{ text-align:center; color:#94a3b8; padding:40px 20px; }
  .chips{ display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; margin-bottom:12px; -webkit-overflow-scrolling:touch; }
  .chip{ flex:none; border:1px solid var(--line); background:#fff; border-radius:20px; padding:8px 14px; font-size:13px; color:#475569; }
  .chip.active{ background:var(--navy); color:#fff; border-color:var(--navy); font-weight:600; }
  .chip small{ opacity:.75; }
  .more{ text-align:center; color:#64748b; font-size:13px; padding:10px; }

  /* מודל */
  .modal{ position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex; align-items:flex-end; justify-content:center; z-index:50; }
  .modal .sheet{ background:#fff; width:100%; max-width:520px; border-radius:20px 20px 0 0; padding:22px; max-height:92vh; overflow:auto; }
  @media(min-width:560px){ .modal{ align-items:center; } .modal .sheet{ border-radius:20px; } }
  .sheet h3{ margin:0 0 16px; color:var(--navy); }
  .row{ display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--line); font-size:15px; }
  .row .k{ color:#64748b; } .row .v{ font-weight:600; text-align:end; }
  .actions{ display:flex; flex-direction:column; gap:10px; margin-top:18px; }
  .ghost{ background:#f1f5f9; color:var(--navy); border:none; border-radius:10px; padding:12px; font-size:15px; }
  select,.actions input{ width:100%; padding:12px 14px; border:1px solid var(--line); border-radius:10px; font-size:16px; }
  .note{ font-size:13px; color:#64748b; background:#f8fafc; border-radius:10px; padding:10px 12px; margin-top:10px; }
  .ok-box{ background:#dcfce7; color:#166534; border-radius:10px; padding:12px; font-size:14px; margin-top:12px; line-height:1.6; }
  .linkout{ background:#eef4fa; border:1px solid #c9dcee; color:#0b3552; border-radius:12px; padding:11px 14px; font-size:13px; margin-bottom:12px; }
  .linkout a{ color:#0b3552; font-weight:700; }

  /* ===== רספונסיביות — טאבלט ומחשב ===== */
  @media(min-width:700px){
    .stats{ grid-template-columns:repeat(4,1fr); }
    .tabs{ justify-content:center; }
    .tabs button{ font-size:14px; }
  }
  @media(min-width:700px){
    /* שפה עיצובית אחידה עם לוח התיאום: שורות טבלאיות, קווים דקים, סטטוסים צבעוניים */
    main{ max-width:1100px; padding:20px 24px; }
    .lead{ border-radius:0; box-shadow:none; border:1px solid var(--line); margin-bottom:-1px; padding:10px 14px; }
    .lead:hover{ background:#f8fafc; cursor:pointer; }
    .lead:first-child{ border-radius:12px 12px 0 0; }
    .lead:last-child{ border-radius:0 0 12px 12px; margin-bottom:12px; }
    .lead:only-child{ border-radius:12px; }
    .lead .nm{ font-size:15px; }
    .lead .meta{ font-size:12.5px; }
    .modal .sheet{ max-width:600px; }
    .toolbar input{ max-width:520px; }
  }
  @media(max-width:380px){
    .stat .n{ font-size:26px; }
    .tabs button{ padding:12px 11px; font-size:14px; }
    main{ padding:12px; }
  }

  /* ===== מעטפת מאוחדת — סרגל עליון + תפריט צד ימני (עיצוב לוח התיאום) ===== */
  .topnav{ position:sticky; top:0; z-index:30; display:flex; align-items:center; gap:12px; background:linear-gradient(135deg,#061827,#0b3552); color:#fff; padding:9px 14px; min-height:52px; box-sizing:border-box; }
  .topnav .burger{ background:rgba(255,255,255,.12); border:none; color:#fff; font-size:19px; border-radius:8px; padding:5px 12px; }
  .brand-wm{ height:26px; width:auto; }
  .user-chip{ display:flex; align-items:center; gap:8px; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.18); border-radius:999px; padding:4px 12px 4px 6px; font-size:13px; }
  .user-chip .av{ width:26px; height:26px; border-radius:50%; background:var(--green); color:#fff; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; }
  .user-chip .rle{ opacity:.75; font-size:12px; }
  .topnav .spacer{ flex:1; }
  .topnav .who2{ font-size:13px; opacity:.92; }
  .topnav button.out{ background:rgba(255,255,255,.15); color:#fff; border:none; border-radius:8px; padding:7px 12px; font-size:13px; }
  .shell{ display:flex; align-items:stretch; }
  aside#side{ width:225px; flex:none; background:linear-gradient(180deg,#061827,#0b3552); padding:12px 0; position:sticky; top:52px; align-self:flex-start; height:calc(100vh - 52px); overflow-y:auto; box-sizing:border-box; }
  aside#side.closed{ display:none; }
  .nav-item{ display:flex; align-items:center; gap:10px; width:100%; text-align:start; background:none; border:none; color:#cfd8e3; font-size:15px; font-family:inherit; padding:12px 18px; border-inline-start:3px solid transparent; }
  .nav-item.active{ color:#fff; background:rgba(255,255,255,.07); border-inline-start-color:var(--green); font-weight:700; }
  .nav-item:hover{ color:#fff; }
  .side-foot{ color:#84898f; font-size:11px; text-align:center; padding:14px 10px; }
  .content{ flex:1; min-width:0; }
  main:has(#tab-logi:not(.hidden)){ max-width:none; padding:10px 12px 0; }
  .sku-img{ width:46px; height:46px; object-fit:cover; border-radius:10px; border:1px solid var(--line); flex:none; cursor:pointer; }
  .sku-none{ display:flex; align-items:center; justify-content:center; background:#f1f5f9; font-size:20px; cursor:default; }
  #board-wrap{ height:calc(100vh - 122px); }
  #board-wrap iframe{ border-radius:0; box-shadow:none; }
  #board-wrap{ height:calc(100vh - 175px); }
  #board-wrap iframe{ width:100%; height:100%; border:none; border-radius:12px; background:#fff; box-shadow:0 2px 10px rgba(6,24,39,.08); }
  @media(max-width:800px){
    aside#side{ position:fixed; inset-inline-end:0; top:52px; z-index:29; box-shadow:0 0 40px rgba(0,0,0,.45); }
    #board-wrap{ height:calc(100vh - 165px); }
  }
</style>
</head>
<body>

<!-- ===== מסך חתימה ללקוח (ציבורי, דרך קישור עם טוקן) ===== -->
<div id="signview" class="hidden" style="min-height:100vh;background:var(--bg);">
  <div style="background:var(--navy);color:#fff;padding:18px 16px;text-align:center;">
    <div style="font-size:20px;font-weight:800;">איירון פיטנס</div>
    <div style="font-size:13px;opacity:.85;">אישור הצעת מחיר בחתימה דיגיטלית</div>
  </div>
  <div style="max-width:520px;margin:0 auto;padding:18px 16px;" id="signbody">
    <div class="empty">טוען…</div>
  </div>
</div>

<!-- ===== התחברות ===== -->
<div id="login">
  <div class="card">
    <div style="text-align:center;margin:-4px 0 8px;"><img class="brand-logo" alt="איירון פיטנס" style="width:96px;"></div>
    <h1>איירון פיטנס</h1>
    <p class="sub">מערכת ניהול מכירות (CRM)</p>
    <div class="field"><label>דוא"ל</label><input id="email" type="email" autocomplete="username" placeholder="name@ironfitness.co.il"></div>
    <div class="field"><label>סיסמה</label><input id="password" type="password" autocomplete="current-password" placeholder="••••••••"></div>
    <button class="btn" id="loginBtn">כניסה</button>
    <div class="err" id="loginErr"></div>
  </div>
</div>

<!-- ===== אפליקציה ===== -->
<div id="app" class="hidden">
  <div class="topnav">
    <button class="burger" id="sideToggle" title="הצגה/הסתרה של התפריט">☰</button>
    <img class="brand-wm" src="assets/logo-white.png" alt="IRON FITNESS" onerror="this.style.display='none'">
    <div class="spacer"></div>
    <button class="out" id="syncBtn" onclick="syncPriority()">🔄 סנכרון פריוריטי</button>
    <span class="user-chip"><span class="av" id="uAv">—</span><b id="uName">—</b><span class="rle" id="uRole">—</span></span>
    <button class="out" id="logoutBtn">יציאה</button>
  </div>
  <div class="shell">
  <aside id="side">
    <button class="nav-item active" data-tab="today">🏠 דשבורד — היום שלי</button>
    <button class="nav-item" data-tab="leads">📞 לידים</button>
    <button class="nav-item" data-tab="customers">👥 לקוחות</button>
    <button class="nav-item" data-tab="contacts">🗂️ אנשי קשר</button>
    <button class="nav-item" data-tab="tasks">✅ משימות</button>
    <button class="nav-item" data-tab="deals">💼 תהליכי מכירה</button>
    <button class="nav-item" data-tab="orders">📦 הזמנות</button>
    <button class="nav-item" data-tab="meets">📅 פגישות</button>
    <button class="nav-item" data-tab="logi">🚚 לוגיסטיקה</button>
    <button class="nav-item" data-tab="skus">🏷️ מקטים</button>
    <button class="nav-item" data-tab="pays">💳 תשלומים</button>
    <div class="side-foot">איירון פיטנס בע"מ · המערכת</div>
  </aside>
  <div class="content">

  <main>
    <!-- היום שלי -->
    <section id="tab-today">
      <div class="stats">
        <div class="stat"><div class="n" id="s-open">0</div><div class="l">לידים פתוחים</div></div>
        <div class="stat"><div class="n" id="s-rel">0</div><div class="l">רלוונטיים</div></div>
        <div class="stat"><div class="n" id="s-tasks">0</div><div class="l">משימות להיום</div></div>
        <div class="stat"><div class="n" id="s-total">0</div><div class="l">סה"כ לידים</div></div>
      </div>
      <h2 class="sec">הפגישות של היום</h2>
      <div id="today-meets"></div>
      <h2 class="sec">משימות להיום ובאיחור</h2>
      <div id="today-tasks"></div>
      <h2 class="sec">לידים חדשים שממתינים לך</h2>
      <div id="today-leads"></div>
    </section>

    <!-- עסקאות -->
    <section id="tab-deals" class="hidden">
      <div class="chips" id="deal-chips"></div>
      <div class="toolbar"><input id="dealSearch" placeholder="חיפוש עסקה לפי שם או מס' הצעה…"></div>
      <div id="deals-list"></div>
    </section>

    <!-- פגישות -->
    <section id="tab-meets" class="hidden">
      <div class="chips" id="meet-chips"></div>
      <div id="meets-list"></div>
    </section>

    <!-- לידים -->
    <section id="tab-leads" class="hidden">
      <div class="toolbar">
        <input id="search" placeholder="חיפוש לפי שם או טלפון…">
        <button class="add" id="addBtn" title="ליד חדש">+</button>
      </div>
      <div id="leads-list"></div>
    </section>

    <!-- לקוחות -->
    <section id="tab-customers" class="hidden">
      <div class="toolbar"><input id="custSearch" placeholder="חיפוש לקוח…"></div>
      <div id="customers-list"></div>
    </section>

    <!-- אנשי קשר -->
    <section id="tab-contacts" class="hidden">
      <div class="toolbar"><input id="contSearch" placeholder="חיפוש איש קשר לפי שם, טלפון או מייל…"></div>
      <div id="contacts-list"></div>
    </section>

    <!-- תשלומים -->
    <section id="tab-pays" class="hidden">
      <div class="chips" id="pay-chips"></div>
      <div class="toolbar"><input id="paySearch" placeholder="חיפוש לפי שם לקוח…"></div>
      <div id="pays-list"></div>
    </section>

    <!-- משימות -->
    <section id="tab-tasks" class="hidden">
      <div class="toolbar">
        <input id="taskSearch" placeholder="חיפוש משימה…">
        <button class="add" id="addTaskBtn" title="משימה חדשה">+</button>
      </div>
      <div id="tasks-list"></div>
    </section>

    <!-- הזמנות — שיקוף ההזמנות (כרטיסים ועדכון מהיר) -->
    <section id="tab-orders" class="hidden">
      <div class="chips" id="ord-chips"></div>
      <div class="toolbar"><input id="ordSearch" placeholder="חיפוש לפי לקוח, מס' הזמנה או עיר…"></div>
      <div id="orders-list"></div>
    </section>

    <!-- לוגיסטיקה — לוח תיאום התקנות ומשלוחים, מוטמע כחלק מהמערכת -->
    <section id="tab-logi" class="hidden">
      <div class="chips" id="logi-chips">
        <button class="chip active" data-v="dashboard" onclick="boardView('dashboard')">דשבורד</button>
        <button class="chip" data-v="orders" onclick="boardView('orders')">הזמנות ותיאומים</button>
        <button class="chip" data-v="service" onclick="boardView('service')">קריאות שירות</button>
        <button class="chip" data-v="calendar" onclick="boardView('calendar')">לוח שנה</button>
        <button class="chip" data-v="skus" onclick="boardView('skus')">מק"טים</button>
        <button class="chip" data-v="docs" onclick="boardView('docs')">מסמכים</button>
        <button class="chip" data-v="settings" onclick="boardView('settings')">הגדרות</button>
      </div>
      <div id="board-wrap"><iframe id="boardFrame" title="לוח תיאום התקנות ומשלוחים"></iframe></div>
    </section>

    <!-- מקטים — קטלוג המוצרים -->
    <section id="tab-skus" class="hidden">
      <div class="toolbar"><input id="skuSearch" placeholder="חיפוש מק&quot;ט או תיאור מוצר…"></div>
      <div id="skus-list"></div>
    </section>
  </main>
  </div><!-- content -->
  </div><!-- shell -->
</div>

<!-- מודל משימה חדשה -->
<div class="modal hidden" id="taskModal">
  <div class="sheet">
    <h3>משימה חדשה</h3>
    <div class="field"><label>מה צריך לעשות? *</label><input id="t-name"></div>
    <div class="field"><label>תאריך יעד *</label><input id="t-due" type="date"></div>
    <div class="field"><label>שעה</label><input id="t-time" type="time" value="09:00"></div>
    <div class="actions">
      <button class="btn green" id="t-save">שמירה</button>
      <button class="ghost" id="t-cancel">ביטול</button>
    </div>
    <div class="err" id="t-err"></div>
  </div>
</div>

<!-- מודל כרטיס לקוח -->
<div class="modal hidden" id="custModal">
  <div class="sheet" id="custSheet"></div>
</div>

<!-- מודל ליד חדש -->
<div class="modal hidden" id="addModal">
  <div class="sheet">
    <h3>ליד חדש</h3>
    <div class="field"><label>שם מלא *</label><input id="a-name"></div>
    <div class="field"><label>טלפון *</label><input id="a-phone" type="tel"></div>
    <div class="field"><label>מקור הגעה</label>
      <select id="a-source">
        <option>קשרים אישיים</option><option>המלצת לקוח</option><option>דף נחיתה</option>
        <option>אתר אינטרנט</option><option>פייסבוק/אינסטגרם</option><option>גוגל</option><option>ידנית</option>
      </select></div>
    <div class="field"><label>סוג לקוח</label>
      <select id="a-type"><option>בסיס</option><option>עסקי</option><option>מסחרי</option><option>סיטונאי</option><option>פ.ע</option></select></div>
    <div class="actions">
      <button class="btn green" id="a-save">שמירה</button>
      <button class="ghost" id="a-cancel">ביטול</button>
    </div>
    <div class="err" id="a-err"></div>
  </div>
</div>

<!-- מודל כרטיס ליד -->
<div class="modal hidden" id="leadModal">
  <div class="sheet" id="leadSheet"></div>
</div>

<!-- מודל כרטיס עסקה -->
<div class="modal hidden" id="dealModal">
  <div class="sheet" id="dealSheet"></div>
</div>

<!-- מודל כרטיס פגישה -->
<div class="modal hidden" id="meetModal">
  <div class="sheet" id="meetSheet"></div>
</div>

<!-- מודל כרטיס הזמנה (מערכת התיאומים) -->
<div class="modal hidden" id="ordModal">
  <div class="sheet" id="ordSheet"></div>
</div>

const $ = s => document.querySelector(s);
let ME = null, LEADS = [];

const statusClass = s => s==='רלוונטי'?'st-rel' : (s==='ליד חדש'?'st-new' : (['סירוב','לא רלוונטי'].includes(s)?'st-no':'st-def'));

async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  if(session){ await afterLogin(); } else { $('#login').classList.remove('hidden'); }
}

$('#loginBtn').onclick = async ()=>{
  $('#loginErr').textContent='';
  const email=$('#email').value.trim(), password=$('#password').value;
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if(error){ $('#loginErr').textContent = 'התחברות נכשלה — בדוק דוא"ל וסיסמה'; return; }
  await afterLogin();
};
$('#email').addEventListener('keydown',e=>{ if(e.key==='Enter') $('#password').focus(); });
$('#password').addEventListener('keydown',e=>{ if(e.key==='Enter') $('#loginBtn').click(); });

async function afterLogin(){
  const { data:{ user } } = await sb.auth.getUser();
  const { data: prof } = await sb.schema('core').from('profiles').select('full_name,role,email').eq('id',user.id).maybeSingle();
  if(!prof || prof.role==='pending'){ $('#loginErr').textContent='המשתמש ממתין לאישור מנהל'; await sb.auth.signOut(); return; }
  ME = { id:user.id, ...prof };
  $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');
  $('#uName').textContent = prof.full_name || prof.email;
  $('#uRole').textContent = '(' + (({admin:'אדמיניסטרטור',manager:'מנהל מכירות',rep:'נציג',viewer:'צפייה'})[prof.role]||prof.role) + ')';
  $('#uAv').textContent = (prof.full_name||prof.email||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('');
  await loadLeads();
}

$('#logoutBtn').onclick = async ()=>{ await sb.auth.signOut(); location.reload(); };

document.querySelectorAll('.nav-item').forEach(b=> b.onclick=()=>{
  document.querySelectorAll('.nav-item').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  ['today','leads','deals','meets','customers','contacts','pays','tasks','orders','logi','skus'].forEach(t=>
    $('#tab-'+t).classList.toggle('hidden', b.dataset.tab!==t));
  if(b.dataset.tab==='logi') initBoard();
  if(window.innerWidth<800) $('#side').classList.add('closed');
});
$('#sideToggle').onclick = ()=> $('#side').classList.toggle('closed');
if(window.innerWidth<800) $('#side').classList.add('closed');
function initBoard(){
  const f = $('#boardFrame');
  if(!f.getAttribute('src')){
    f.addEventListener('load', ()=>{ try{
      const d = f.contentDocument;
      const st = d.createElement('style');
      st.textContent = 'header.topbar{display:none !important}';
      d.head.appendChild(st);
    }catch(_e){} });
    f.src = 'orders/';
  }
}
window.boardView = v=>{
  initBoard();
  const f = $('#boardFrame');
  const go = ()=>{ try{ const b = f.contentDocument.querySelector(`.tab[data-view="${v}"]`); if(b) b.click(); }catch(_e){} };
  try{ if(f.contentDocument && f.contentDocument.readyState==='complete'){ go(); } else { f.addEventListener('load', go, {once:true}); } }
  catch(_e){ f.addEventListener('load', go, {once:true}); }
  document.querySelectorAll('#logi-chips .chip').forEach(c=>c.classList.toggle('active', c.dataset.v===v));
};

/* ===== סנכרון פריוריטי מהמסך הראשי ===== */
window.syncPriority = async ()=>{
  const btn = $('#syncBtn'); if(btn.disabled) return;
  btn.disabled = true; const t0 = btn.textContent; btn.textContent = '⏳ מסנכרן מפריוריטי…';
  try{
    const { data:{ session } } = await sb.auth.getSession();
    const r = await fetch(SB_URL + '/functions/v1/priority-sync', {
      method:'POST',
      headers:{ 'authorization':'Bearer '+session.access_token, 'apikey':SB_KEY, 'content-type':'application/json' },
      body:'{}'
    });
    const j = await r.json();
    if(r.ok){
      alert(`סנכרון פריוריטי הושלם ✓\nהזמנות: ${j.orders_updated||0} עודכנו · ${j.orders_inserted||0} חדשות\nקריאות שירות: ${j.calls_updated||0} עודכנו · ${j.calls_inserted||0} חדשות`);
      await loadLeads();
    } else {
      alert('הסנכרון נכשל: ' + (j.error || r.status));
    }
  }catch(e){ alert('הסנכרון נכשל: ' + e.message); }
  btn.disabled = false; btn.textContent = t0;
};

/* ===== מקטים — קטלוג המוצרים (ord.inv_items) ===== */
function skuRow(s){
  return `<div class="lead">
    ${s.image_url?`<img class="sku-img" src="${esc(s.image_url)}" loading="lazy" onclick="window.open('${esc(s.image_full||s.image_url)}','_blank')">`:'<div class="sku-img sku-none">🏋️</div>'}
    <div style="flex:1"><div class="nm">${esc(s.partdes||s.partname)}</div>
    <div class="meta">מק"ט ${esc(s.partname)}${s.family?' · '+esc(s.family):''}</div></div>
    ${s.price?`<span class="pill st-def">${shekel(s.price)}</span>`:''}</div>`;
}
function renderSkus(){
  const q=($('#skuSearch').value||'').trim();
  const qU=q.toUpperCase();
  let list=SKUS;
  if(q) list=SKUS.filter(s=>String(s.partname||'').toUpperCase().includes(qU)||(s.partdes||'').includes(q));
  $('#skus-list').innerHTML = capped(list, skuRow, 'אין מק"טים להצגה');
}
$('#skuSearch').addEventListener('input', renderSkus);

let CUSTS=[], TASKS=[], DEALS=[], MEETS=[], CONTS=[], PAYS=[], ORDS=[], SCALLS=[], OTEAMS=[], SKUS=[];
async function loadLeads(){
  const [l,c,t,d,m,k,p,o,sc,tm,sk] = await Promise.all([
    sb.schema('crm').from('leads').select('id,full_name,company,phone,email,city,source,status,sub_status,customer_type,customer_id,created_at').order('created_at',{ascending:false}).limit(10000),
    sb.schema('core').from('customers').select('id,name,phone,email,priority_id,status,customer_type,price_group,city,address,region,truck_access,elevator,freight_elevator,logistics_notes').order('created_at',{ascending:false}).limit(10000),
    sb.schema('crm').from('tasks').select('id,name,status,category,due_at,closed_at,linked_type,linked_id,owner_id').order('due_at',{ascending:true}).limit(10000),
    sb.schema('crm').from('deals').select('id,name,stage,amount,quote_status,irrelevant_reason,priority_quote_id,customer_id,contact_id,send_channel,sign_link,approved_at,closed_at,created_at').order('created_at',{ascending:false}).limit(10000),
    sb.schema('crm').from('meetings').select('id,subject,status,meet_date,start_time,end_time,meet_type,location,teams_link,linked_type,linked_id').order('meet_date',{ascending:false}).limit(10000),
    sb.schema('core').from('contacts').select('id,full_name,phone,office_phone,email,role,customer_id').order('full_name',{ascending:true}).limit(10000),
    sb.schema('crm').from('payments').select('id,customer_id,deal_id,status,due_date,total_amount,paid_amount,notes').order('due_date',{ascending:false}).limit(10000),
    sb.schema('ord').from('orders').select('id,order_number,order_date,customer_name,customer_number,phone,city,region,order_status,contact_status,scheduled_date,time_slot,team,delivery_method,items_count,erp_status,erp_price,equipment_list,address').order('order_date',{ascending:false}).limit(10000),
    sb.schema('ord').from('service_calls').select('id,call_number,opened_date,customer_name,customer_number,phone,city,status,call_type,product,fault_details,scheduled_date,urgency,team').order('opened_date',{ascending:false}).limit(10000),
    sb.schema('ord').from('teams').select('name,active,sort_order').eq('active',true).order('sort_order',{ascending:true}),
    sb.schema('ord').from('inv_items').select('partname,partdes,price,family,image_url,image_full').order('partname',{ascending:true}).limit(10000)
  ]);
  LEADS = l.data||[]; CUSTS = c.data||[]; TASKS = t.data||[]; DEALS = d.data||[]; MEETS = m.data||[]; CONTS = k.data||[]; PAYS = p.data||[];
  ORDS = o.data||[]; SCALLS = sc.data||[]; OTEAMS = tm.data||[]; SKUS = sk.data||[];
  renderStats(); renderToday(); renderLeads(); renderCustomers(); renderTasks(); renderDeals(); renderMeets(); renderConts(); renderPays(); renderOrders(); renderSkus();
}
function capped(list, rowFn, emptyMsg){
  if(!list.length) return `<div class="empty">${emptyMsg}</div>`;
  const html = list.slice(0,200).map(rowFn).join('');
  return list.length>200 ? html+`<div class="more">מציג 200 מתוך ${list.length} — חדד את החיפוש</div>` : html;
}

function taskRow(t){
  const overdue = t.status!=='הושלם' && t.due_at && new Date(t.due_at) < new Date();
  const due = t.due_at ? new Date(t.due_at).toLocaleString('he-IL',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}) : '—';
  return `<div class="lead">
    <div><div class="nm" style="${t.status==='הושלם'?'text-decoration:line-through;color:#94a3b8':''}">${esc(t.name)}</div>
    <div class="meta" style="${overdue?'color:#c0392b;font-weight:600':''}">יעד: ${due}${overdue?' · באיחור!':''}</div></div>
    ${t.status!=='הושלם'?`<button class="ghost" style="padding:8px 14px" onclick="doneTask('${t.id}')">בוצע ✓</button>`:`<span class="pill st-rel">הושלם</span>`}
  </div>`;
}
function myOpenTodayTasks(){
  const eod = new Date(); eod.setHours(23,59,59,999);
  return TASKS.filter(t=> t.status!=='הושלם' && t.due_at && new Date(t.due_at) <= eod);
}
function renderTasks(){
  const q=($('#taskSearch').value||'').trim();
  let list=TASKS.filter(t=>t.status!=='הושלם');
  if(q) list=TASKS.filter(t=>(t.name||'').includes(q));
  $('#tasks-list').innerHTML = capped(list, taskRow, q?'לא נמצאו משימות':'אין משימות פתוחות 🎉');
}
window.doneTask = async (id)=>{
  const { error } = await sb.schema('crm').from('tasks').update({ status:'הושלם', closed_at: new Date().toISOString() }).eq('id', id);
  if(error){ console.error(error); return; }
  await loadLeads();
};
$('#addTaskBtn').onclick = ()=>{ $('#t-name').value=''; $('#t-err').textContent='';
  $('#t-due').value = new Date().toISOString().slice(0,10); $('#taskModal').classList.remove('hidden'); };
$('#t-cancel').onclick = ()=> $('#taskModal').classList.add('hidden');
$('#t-save').onclick = async ()=>{
  const name=$('#t-name').value.trim(), d=$('#t-due').value, tm=$('#t-time').value||'09:00';
  if(!name||!d){ $('#t-err').textContent='שם ותאריך יעד חובה'; return; }
  const { error } = await sb.schema('crm').from('tasks').insert({ name, owner_id: ME.id, due_at: new Date(d+'T'+tm).toISOString(), category:'ליד' });
  if(error){ $('#t-err').textContent='שגיאה בשמירה'; console.error(error); return; }
  $('#taskModal').classList.add('hidden'); await loadLeads();
};

function custRow(c){
  const st = c.status==='פעיל'?'st-rel':(c.status==='לא פעיל'?'st-no':'st-def');
  return `<div class="lead" onclick="openCust('${c.id}')">
    <div><div class="nm">${esc(c.name)}</div>
    <div class="meta">${esc(c.phone||'')} · ${esc(c.priority_id||'ללא מספר פריוריטי')}</div></div>
    <span class="pill ${st}">${esc(c.status||'—')}</span></div>`;
}
function renderCustomers(){
  const q=($('#custSearch').value||'').trim();
  let list=CUSTS; if(q) list=CUSTS.filter(c=>(c.name||'').includes(q)||(c.phone||'').includes(q)||(c.priority_id||'').includes(q));
  $('#customers-list').innerHTML = capped(list, custRow, 'לא נמצאו לקוחות');
}
window.openCust = async (id)=>{
  const c = CUSTS.find(x=>x.id===id); if(!c) return;
  const { data: contacts } = await sb.schema('core').from('contacts').select('*').eq('customer_id', id);
  const { data: deals } = await sb.schema('crm').from('deals').select('*').eq('customer_id', id);
  $('#custSheet').innerHTML = `
    <h3>${esc(c.name)}</h3>
    <div class="row"><span class="k">מספר בפריוריטי</span><span class="v">${esc(c.priority_id||'—')}</span></div>
    <div class="row"><span class="k">סטטוס</span><span class="v">${esc(c.status||'—')}</span></div>
    <div class="row"><span class="k">טלפון</span><span class="v">${esc(c.phone||'—')}</span></div>
    <div class="row"><span class="k">דוא"ל</span><span class="v">${esc(c.email||'—')}</span></div>
    <div class="row"><span class="k">סוג לקוח</span><span class="v">${esc(c.customer_type||'—')}</span></div>
    <h2 class="sec">עסקאות (${(deals||[]).length})</h2>
    ${(deals||[]).map(d=>`<div class="row"><span class="k">${esc(d.priority_quote_id||'ללא הצעה')}</span><span class="v">${esc(d.stage)}${d.amount?' · ₪'+Number(d.amount).toLocaleString():''}</span></div>`).join('')||'<div class="empty" style="padding:10px">אין עסקאות</div>'}
    ${(()=>{ const co = custOrders(c); return co.length ? `<h2 class="sec">📦 הזמנות במערכת התיאומים (${co.length})</h2>` +
      co.map(o=>`<div class="row" style="cursor:pointer" onclick="document.getElementById('custModal').classList.add('hidden');openOrd('${o.id}')"><span class="k">${esc(o.order_number)}${o.scheduled_date?' · '+fmtD(o.scheduled_date):''}</span><span class="v"><span class="pill ${ordStClass(o.order_status)}">${esc(o.order_status||'—')}</span></span></div>`).join('') : ''; })()}
    <h2 class="sec">אנשי קשר (${(contacts||[]).length})</h2>
    ${(contacts||[]).map(p=>`<div class="row"><span class="k">${esc(p.full_name)}</span><span class="v">${esc(p.phone||p.email||'—')}</span></div>`).join('')||'<div class="empty" style="padding:10px">אין אנשי קשר</div>'}
    <div class="actions"><button class="ghost" onclick="document.getElementById('custModal').classList.add('hidden')">סגירה</button></div>`;
  $('#custModal').classList.remove('hidden');
};
$('#custSearch').addEventListener('input', renderCustomers);
$('#taskSearch').addEventListener('input', renderTasks);

/* ===== אנשי קשר ===== */
function contRow(k){
  const cust = k.customer_id ? CUSTS.find(c=>c.id===k.customer_id) : null;
  return `<div class="lead" onclick="${cust?`openCust('${cust.id}')`:''}">
    <div><div class="nm">${esc(k.full_name)}</div>

/* ===== תיאום ועדכון הזמנה (מיזוג שלב ב' — עריכה ישירה מהמערכת האחת) ===== */
const uniqVals = (arr, field, current) => {
  const s = new Set(arr.map(x=>x[field]).filter(Boolean));
  if(current) s.add(current);
  return [...s];
};
const optHtml = (vals, cur) => vals.map(v=>`<option ${v===cur?'selected':''}>${esc(v)}</option>`).join('');
function ordEditHtml(o){
  const stVals = uniqVals(ORDS,'order_status',o.order_status);

  const teamVals = [...new Set([...OTEAMS.map(t=>t.name), ...uniqVals(ORDS,'team',o.team)])];
  return `<h2 class="sec">🛠️ עדכון ותיאום</h2>
    <div class="field"><label>סטטוס בלוח</label><select id="oe-status">${optHtml(stVals,o.order_status)}</select></div>
    <div class="field"><label>סטטוס קשר</label><select id="oe-contact">${optHtml(ctVals,o.contact_status)}</select></div>

    <div class="field"><label>צוות</label><select id="oe-team"><option value="">—</option>${optHtml(teamVals,o.team)}</select></div>
    <button class="btn" onclick="saveOrd('${o.id}')">שמירת עדכון</button>
    <div class="err" id="oe-err"></div>`;
}
window.saveOrd = async (id)=>{
  const o = ORDS.find(x=>x.id===id); if(!o) return;
  const upd = {
    order_status: $('#oe-status').value,
    contact_status: $('#oe-contact').value,
    scheduled_date: $('#oe-date').value || null,
    time_slot: $('#oe-slot').value || null,
    team: $('#oe-team').value || null,
  };
  const { error } = await sb.schema('ord').from('orders').update(upd).eq('id', id);
  if(error){ $('#oe-err').textContent = 'השמירה נכשלה — ' + error.message; return; }
  const changes = [];
  for(const k of Object.keys(upd)) if((o[k]||null)!==(upd[k]||null)) changes.push(k);
  Object.assign(o, upd);
  try{
    await sb.schema('ord').from('audit_log').insert({
      user_email: ME.email, action: 'עדכון הזמנה מה-CRM',
      entity: 'הזמנה', entity_id: String(o.order_number), label: changes.join(', ') || 'ללא שינוי'
    });
  }catch(_e){}
  $('#ordModal').classList.add('hidden');
  renderOrders();
};

const ACTIVE_STAGES = STAGES.slice(0,5);
let DEAL_FILTER = 'active';
const shekel = n => '₪' + Math.round(Number(n||0)).toLocaleString('he-IL');
const stageClass = s => s==='הושלם' ? 'st-rel' : (s==='לא רלוונטי' ? 'st-no' : (s==='תהליך חדש' ? 'st-new' : 'st-def'));

function dealChips(){
  const sum = list => list.reduce((a,d)=>a+Number(d.amount||0),0);

/* ===== פגישות ===== */
let MEET_FILTER = 'week';
const meetStClass = s => s==='התקיימה'?'st-rel' : (['בוטלה','לא התקיימה','נדחתה'].includes(s)?'st-no' : 'st-new');
const todayStr = () => { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
function meetFilterList(){
  const t = todayStr();
  const in7 = new Date(Date.now()+7*864e5); const w = in7.getFullYear()+'-'+String(in7.getMonth()+1).padStart(2,'0')+'-'+String(in7.getDate()).padStart(2,'0');
  if(MEET_FILTER==='today') return MEETS.filter(m=>m.meet_date===t);
  if(MEET_FILTER==='week') return MEETS.filter(m=>m.meet_date>=t && m.meet_date<=w).sort((a,b)=>(a.meet_date||'').localeCompare(b.meet_date||''));
  if(MEET_FILTER==='future') return MEETS.filter(m=>m.meet_date>=t).sort((a,b)=>(a.meet_date||'').localeCompare(b.meet_date||''));
  return MEETS;
}
function meetChips(){
  const t = todayStr();
  const cnt = { today: MEETS.filter(m=>m.meet_date===t).length, future: MEETS.filter(m=>m.meet_date>=t).length };
  $('#meet-chips').innerHTML = `
    <button class="chip ${MEET_FILTER==='today'?'active':''}" onclick="setMeetFilter('today')">היום ${cnt.today}</button>
    <button class="chip ${MEET_FILTER==='week'?'active':''}" onclick="setMeetFilter('week')">השבוע</button>
    <button class="chip ${MEET_FILTER==='future'?'active':''}" onclick="setMeetFilter('future')">עתידיות ${cnt.future}</button>
    <button class="chip ${MEET_FILTER==='all'?'active':''}" onclick="setMeetFilter('all')">הכל ${MEETS.length}</button>`;
}
window.setMeetFilter = f => { MEET_FILTER = f; renderMeets(); };
function linkedName(m){
  if(!m.linked_id) return null;
  if(m.linked_type==='lead'){ const x=LEADS.find(l=>l.id===m.linked_id); return x?{label:'ליד',name:x.full_name}:null; }
  if(m.linked_type==='deal'){ const x=DEALS.find(d=>d.id===m.linked_id); return x?{label:'עסקה',name:x.name}:null; }
  if(m.linked_type==='customer'){ const x=CUSTS.find(c=>c.id===m.linked_id); return x?{label:'לקוח',name:x.name}:null; }
  return null;
}
function meetRow(m){
  const d = m.meet_date ? new Date(m.meet_date+'T00:00').toLocaleDateString('he-IL',{day:'2-digit',month:'2-digit'}) : '—';
  const ln = linkedName(m);
  return `<div class="lead" onclick="openMeet('${m.id}')">
    <div><div class="nm">${esc(m.subject)}</div>
    <div class="meta">${d}${m.start_time?' · '+esc(m.start_time):''}${m.meet_type?' · '+esc(m.meet_type):''}${ln?' · '+ln.label+': '+esc(ln.name):''}</div></div>
    <span class="pill ${meetStClass(m.status)}">${esc(m.status)}</span></div>`;
}
function renderMeets(){
  meetChips();
  $('#meets-list').innerHTML = capped(meetFilterList(), meetRow, 'אין פגישות בסינון הזה');
}
window.openMeet = (id)=>{
  const m = MEETS.find(x=>x.id===id); if(!m) return;
  const ln = linkedName(m);
  $('#meetSheet').innerHTML = `
    <h3>${esc(m.subject)}</h3>
    <div class="row"><span class="k">סטטוס</span><span class="v"><span class="pill ${meetStClass(m.status)}">${esc(m.status)}</span></span></div>
    <div class="row"><span class="k">תאריך</span><span class="v">${m.meet_date?new Date(m.meet_date+'T00:00').toLocaleDateString('he-IL',{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric'}):'—'}</span></div>
    <div class="row"><span class="k">שעות</span><span class="v">${esc(m.start_time||'—')}${m.end_time?' – '+esc(m.end_time):''}</span></div>
    <div class="row"><span class="k">סוג</span><span class="v">${esc(m.meet_type||'—')}</span></div>
    <div class="row"><span class="k">מיקום</span><span class="v">${esc(m.location||'—')}</span></div>
    ${ln?`<div class="row"><span class="k">מקושרת אל</span><span class="v">${ln.label}: ${esc(ln.name)}</span></div>`:''}
    ${m.teams_link?`<div class="row"><span class="k">פגישה מקוונת</span><span class="v"><a href="${esc(m.teams_link)}" target="_blank">הצטרפות ↗</a></span></div>`:''}
    <div class="actions"><button class="ghost" onclick="document.getElementById('meetModal').classList.add('hidden')">סגירה</button></div>
    <div class="note">שיגור זימונים, תזכורות וביטול — בשלב האוטומציות הבא.</div>`;
  $('#meetModal').classList.remove('hidden');
};

function renderStats(){
  const open = LEADS.filter(l=>['ליד חדש','ללא מענה','ללא מענה 2','ללא מענה 3'].includes(l.status)).length;
  const rel = LEADS.filter(l=>l.status==='רלוונטי').length;
  $('#s-open').textContent=open; $('#s-rel').textContent=rel;
  $('#s-total').textContent=LEADS.length; $('#s-tasks').textContent=myOpenTodayTasks().length;
}
function leadRow(l){
  return `<div class="lead" onclick="openLead('${l.id}')">
    <div><div class="nm">${esc(l.full_name)}</div>
    <div class="meta">${esc(l.phone||'')} · ${esc(l.source||'—')}</div></div>
    <span class="pill ${statusClass(l.status)}">${esc(l.status)}</span></div>`;
}
function renderToday(){
  const news = LEADS.filter(l=>l.status==='ליד חדש').slice(0,20);
  $('#today-leads').innerHTML = news.length? news.map(leadRow).join('') : '<div class="empty">אין לידים חדשים ✨</div>';
  const tt = myOpenTodayTasks().slice(0,20);
  $('#today-tasks').innerHTML = tt.length? tt.map(taskRow).join('') : '<div class="empty">אין משימות להיום 🎉</div>';
  const tm = MEETS.filter(m=>m.meet_date===todayStr() && m.status!=='בוטלה');
  $('#today-meets').innerHTML = tm.length? tm.map(meetRow).join('') : '<div class="empty">אין פגישות היום</div>';
}
function renderLeads(){
  const q = ($('#search').value||'').trim();
  let list = LEADS;
  if(q) list = LEADS.filter(l=>(l.full_name||'').includes(q)||(l.phone||'').includes(q)||(l.company||'').includes(q));
  $('#leads-list').innerHTML = capped(list, leadRow, 'לא נמצאו לידים');
}
$('#search').addEventListener('input', renderLeads);

// ליד חדש
$('#addBtn').onclick = ()=>{ $('#a-name').value='';$('#a-phone').value='';$('#a-err').textContent=''; $('#addModal').classList.remove('hidden'); };
$('#a-cancel').onclick = ()=> $('#addModal').classList.add('hidden');
$('#a-save').onclick = async ()=>{
  const full_name=$('#a-name').value.trim(), phone=$('#a-phone').value.trim();
  if(!full_name||!phone){ $('#a-err').textContent='שם וטלפון חובה'; return; }
  const { error } = await sb.schema('crm').from('leads').insert({
    full_name, phone, source:$('#a-source').value, customer_type:$('#a-type').value,
    status:'ליד חדש', owner_id: ME.id
  });
  if(error){ $('#a-err').textContent='שגיאה בשמירה'; console.error(error); return; }
  $('#addModal').classList.add('hidden'); await loadLeads();
};

// כרטיס ליד
window.openLead = (id)=>{
  const l = LEADS.find(x=>x.id===id); if(!l) return;
  const canConvert = l.status!=='רלוונטי';
  $('#leadSheet').innerHTML = `
    <h3>${esc(l.full_name)}</h3>
    <div class="row"><span class="k">טלפון</span><span class="v">${esc(l.phone||'—')}</span></div>
    <div class="row"><span class="k">סטטוס</span><span class="v"><span class="pill ${statusClass(l.status)}">${esc(l.status)}</span></span></div>
    <div class="row"><span class="k">מקור</span><span class="v">${esc(l.source||'—')}</span></div>
    <div class="row"><span class="k">סוג לקוח</span><span class="v">${esc(l.customer_type||'—')}</span></div>
    <div class="actions">
      ${canConvert? `<button class="btn green" onclick="convertLead('${l.id}')">העבר לרלוונטי ← פתח לקוח והצעה בפריוריטי</button>`:''}
      <button class="ghost" onclick="document.getElementById('leadModal').classList.add('hidden')">סגירה</button>
    </div>
    ${canConvert? '<div class="note">הפעולה תפתח לקוח זמני והצעת מחיר בפריוריטי, ותקשר אותם לליד.</div>':''}
    <div id="convResult"></div>
    <div id="lead-acts"></div>`;
  $('#leadModal').classList.remove('hidden');
  activityHtml('lead', id).then(h=>{ const el=$('#lead-acts'); if(el) el.innerHTML=h; });
};

window.convertLead = async (id)=>{
  const res = $('#convResult'); res.innerHTML='<div class="note">מבצע… פותח לקוח והצעה בפריוריטי…</div>';
  const { data, error } = await sb.functions.invoke('crm-convert-lead', { body:{ lead_id:id } });
  if(error || (data && data.ok===false)){
    res.innerHTML = `<div class="note" style="color:#c0392b">שגיאה: ${esc((data&&data.error)||error?.message||'לא ידוע')}</div>`; return;
  }
  res.innerHTML = `<div class="ok-box">✅ הומר בהצלחה!<br>לקוח בפריוריטי: <b>${esc(data.custname||'—')}</b><br>הצעת מחיר: <b>${esc(data.cprofnum||'—')}</b></div>`;
  await loadLeads();
};

function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ===== מסך חתימה ציבורי (?sign=TOKEN) ===== */
const SIGN_FN = SB_URL + '/functions/v1/sign-quote';
let signHasInk = false;
async function renderSignView(token){
  document.getElementById('login').classList.add('hidden');
  document.getElementById('signview').classList.remove('hidden');
  const body = document.getElementById('signbody');
  let info;
  try{ info = await (await fetch(SIGN_FN + '?token=' + encodeURIComponent(token))).json(); }
  catch{ body.innerHTML = '<div class="empty">שגיאת תקשורת — נסו שוב</div>'; return; }
  if(info.status === 'נחתם'){ body.innerHTML = `<div class="ok-box" style="text-align:center;font-size:16px;">✅ ההצעה כבר נחתמה<br><small>${new Date(info.signed_at).toLocaleString('he-IL')}</small></div>`; return; }
  if(!info.ok){ body.innerHTML = `<div class="empty">${esc(info.error||'הקישור אינו תקין')}</div>`; return; }
  const d = info.deal || {};
  body.innerHTML = `
    <div style="background:#fff;border-radius:14px;padding:18px;box-shadow:0 1px 3px rgba(0,0,0,.08);">
      <div class="row"><span class="k">לקוח</span><span class="v">${esc(d.customer_name||d.name||'—')}</span></div>
      ${d.quote_id?`<div class="row"><span class="k">הצעת מחיר</span><span class="v">${esc(d.quote_id)}</span></div>`:''}
      ${d.amount?`<div class="row"><span class="k">סכום (לפני מע"מ)</span><span class="v">₪${Number(d.amount).toLocaleString('he-IL')}</span></div>`:''}
      <div class="field" style="margin-top:16px;"><label>שם מלא של החותם *</label><input id="sg-name"></div>
      <label style="display:block;font-size:13px;color:#475569;margin-bottom:6px;">חתימה *</label>
      <canvas id="sg-canvas" width="460" height="170" style="width:100%;height:170px;border:1.5px dashed var(--line);border-radius:10px;background:#fff;touch-action:none;"></canvas>
      <button class="ghost" id="sg-clear" style="width:auto;padding:8px 14px;margin-top:8px;">ניקוי חתימה</button>
      <div class="actions">
        <button class="btn green" id="sg-submit">אישור ההצעה וחתימה</button>
      </div>
      <div class="err" id="sg-err"></div>
      <div class="note">בלחיצה על הכפתור אני מאשר/ת את הצעת המחיר. החתימה נשמרת עם חותמת זמן ומזהה מסמך מאובטח.</div>
    </div>`;
  const cv = document.getElementById('sg-canvas'), ctx = cv.getContext('2d');
  ctx.lineWidth = 2.2; ctx.lineCap = 'round'; ctx.strokeStyle = '#0b2239';
  let drawing = false;
  const pos = e => { const r = cv.getBoundingClientRect(); const p = e.touches? e.touches[0] : e;
    return { x: (p.clientX - r.left) * (cv.width / r.width), y: (p.clientY - r.top) * (cv.height / r.height) }; };
  const start = e => { drawing = true; const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); e.preventDefault(); };
  const move = e => { if(!drawing) return; const p = pos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); signHasInk = true; e.preventDefault(); };
  const end = () => { drawing = false; };
  cv.addEventListener('mousedown', start); cv.addEventListener('mousemove', move); window.addEventListener('mouseup', end);
  cv.addEventListener('touchstart', start, {passive:false}); cv.addEventListener('touchmove', move, {passive:false}); cv.addEventListener('touchend', end);
  document.getElementById('sg-clear').onclick = () => { ctx.clearRect(0,0,cv.width,cv.height); signHasInk = false; };
  document.getElementById('sg-submit').onclick = async () => {
    const err = document.getElementById('sg-err'); err.textContent = '';
    const name = document.getElementById('sg-name').value.trim();
    if(!name){ err.textContent = 'נא למלא שם מלא'; return; }
    if(!signHasInk){ err.textContent = 'נא לחתום במסגרת'; return; }
    document.getElementById('sg-submit').disabled = true;
    try{
      const r = await (await fetch(SIGN_FN, { method:'POST', headers:{'content-type':'application/json'},
        body: JSON.stringify({ token, signer_name: name, signature_data: cv.toDataURL('image/png') }) })).json();
      if(!r.ok){ err.textContent = r.error || 'שגיאה בחתימה'; document.getElementById('sg-submit').disabled = false; return; }
      body.innerHTML = `<div class="ok-box" style="text-align:center;font-size:16px;line-height:1.8;">✅ ההצעה אושרה ונחתמה בהצלחה!<br>תודה רבה, ניצור קשר בהמשך.<br><small style="color:#4d7c62;">מזהה מסמך: ${r.doc_hash.slice(0,16)}…</small></div>`;
    }catch{ err.textContent = 'שגיאת תקשורת — נסו שוב'; document.getElementById('sg-submit').disabled = false; }
  };
}

/* ===== יצירת קישור חתימה מכרטיס עסקה (צוות) ===== */
window.createSignLink = async (dealId)=>{
  const box = document.getElementById('signlink-box'); if(box) box.innerHTML = '<div class="note">יוצר קישור…</div>';
  const { data, error } = await sb.schema('crm').from('sign_requests').insert({ deal_id: dealId, created_by: ME.id }).select('token').single();
  if(error || !data){ if(box) box.innerHTML = '<div class="note" style="color:#c0392b">שגיאה ביצירת הקישור</div>'; console.error(error); return; }
  const link = location.origin + '/?sign=' + data.token;
  if(box) box.innerHTML = `<div class="ok-box">🔗 קישור חתימה נוצר (תקף 14 יום):<br>
    <input id="sl-url" readonly value="${esc(link)}" style="width:100%;margin-top:8px;padding:10px;border:1px solid var(--line);border-radius:8px;font-size:13px;direction:ltr;">
    <button class="ghost" style="margin-top:8px;padding:8px 14px;" onclick="navigator.clipboard.writeText(document.getElementById('sl-url').value).then(()=>this.textContent='הועתק ✓')">העתקת הקישור</button>
    <div class="note" style="margin-top:8px;">שלחו את הקישור ללקוח בוואטסאפ/מייל. כשיחתום — העסקה תעבור אוטומטית ל"אושר ע"י לקוח ממתין לתשלום" ותיפתח רשומת גבייה.</div></div>`;
};

const SIGN_TOKEN = new URLSearchParams(location.search).get('sign');
if (SIGN_TOKEN) { renderSignView(SIGN_TOKEN); } else { boot(); }
</script>
