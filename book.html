    var g = S.mg;
    if (!g) return '<div class="loading"><span class="spin" aria-hidden="true"></span>טוען את הפגישה…</div>';
    if (g.notFound) return '<h2>הקישור אינו תקין</h2><p class="sub">ייתכן שהקישור הועתק חלקית. אפשר לקבוע פגישה חדשה או להתקשר אלינו.</p>' +
      '<div class="btnrow"><a class="btn" href="/book">קביעת פגישה</a><a class="btn2" href="' + PHONE_TEL + '">' + PHONE + '</a></div>';
    if (g.error) return fallbackHtml('לא הצלחנו לטעון את הפגישה כרגע');
    var b = g.booking, sh = b.type === 'showroom';
    S.cfg = S.cfg || { consult_min: b.type === 'consult' ? b.duration : 15, showroom_min: sh ? b.duration : 30, horizon_days: 10, address: b.address };
    var pill = b.status === 'active' ? '<span class="pill ok">נקבעה</span>' : b.status === 'cancelled' ? '<span class="pill no">בוטלה</span>' : '<span class="pill no">המועד עבר</span>';
    var card = '<div class="bk"><div><div class="bt">' + h(typeName(b.type)) + '</div><div class="bw">' + h(dLong(b.date)) + ' · ' + h(b.time) + '–' + h(b.end) +
      (sh && b.address ? ' · ' + h(b.address) : '') + '</div></div>' + pill + '</div>';
    if (b.status === 'cancelled') {
      return msgHtml() + '<h2>הפגישה בוטלה</h2><p class="sub">אם תרצו, אפשר לקבוע מועד חדש בכל עת.</p>' + card +
        '<div class="btnrow"><a class="btn" href="/book?type=' + h(b.type) + '">קביעת מועד חדש</a></div>';
    }
    if (b.status === 'past') {
      return '<h2>מועד הפגישה כבר עבר</h2><p class="sub">לקביעת פגישה נוספת:</p>' + card +
        '<div class="btnrow"><a class="btn" href="/book">קביעת פגישה</a><a class="btn2" href="' + PHONE_TEL + '">' + PHONE + '</a></div>';
    }
    if (S.mgView === 'move') {
      if (g.degraded) return fallbackHtml('לא ניתן לשנות מועד אונליין כרגע');
      return msgHtml() + '<h2>בחירת מועד חדש</h2><p class="sub">המועד הנוכחי: ' + h(dLong(b.date)) + ' · ' + h(b.time) + '</p>' +
        calHtml(g.days, b.type) +
        '<div class="actions stick"><button type="button" class="btn" data-act="domove"' + (S.slot && !S.busy ? '' : ' disabled') + '>' +
        (S.busy ? '<span class="spin" aria-hidden="true"></span> מעדכנים…' : 'עדכון המועד') + '</button>' +
        '<button type="button" class="btn2" data-act="mginfo"' + (S.busy ? ' disabled' : '') + '>חזרה</button></div>';
    }
    return msgHtml() + '<h2>הפגישה שלכם</h2><p class="sub">אפשר לשנות מועד או לבטל כאן, בלי להתקשר.</p>' + card +
      (S.confirmCancel
        ? '<div class="msg warn" style="margin-top:20px" role="alert">לבטל את ' + (sh ? 'הפגישה' : 'השיחה') + '? אפשר לקבוע מחדש בכל עת.</div>' +
          '<div class="btnrow" style="margin-top:0"><button type="button" class="dangerbtn solid" data-act="docancel"' + (S.busy ? ' disabled' : '') + '>' +
          (S.busy ? '<span class="spin" aria-hidden="true"></span> מבטלים…' : 'כן, לבטל') + '</button><button type="button" class="btn2" data-act="nocancel"' + (S.busy ? ' disabled' : '') + '>לא, להשאיר</button></div>'
        : '<div class="btnrow"><button type="button" class="btn" data-act="mgmove">שינוי מועד</button><button type="button" class="dangerbtn" data-act="askcancel">ביטול ' + (sh ? 'הפגישה' : 'השיחה') + '</button></div>') +
      (sh && b.address ? '<div class="btnrow"><a class="btn3" href="https://waze.com/ul?q=' + encodeURIComponent(b.address) + '&navigate=yes" target="_blank" rel="noopener">ניווט ב-Waze</a></div>' : '') +
      '<div class="facts"><div><b>שאלות?</b><span><a href="' + PHONE_TEL + '">' + PHONE + '</a></span></div></div>';
  }

  function render(focusId) {
    paintSteps();
    var p = $('panel'), html;
    if (S.mode === 'manage') {
      $('h1').textContent = 'ניהול הפגישה שלכם';
      $('lead').textContent = 'שינוי מועד או ביטול, בלי להתקשר.';
      html = manageHtml();
    } else if (S.cfg && S.cfg.enabled === false) {
      html = '<h2>קביעת פגישות אונליין תיפתח בקרוב</h2><p class="sub">בינתיים נשמח לקבוע איתכם בטלפון.</p>' +
        '<div class="btnrow"><a class="btn" href="' + PHONE_TEL + '">' + ICO_PHONE + ' ' + PHONE + '</a><a class="btn2" href="https://ironfitness.co.il">חזרה לאתר</a></div>';
    } else if (!S.cfg) {
      html = S.degraded ? fallbackHtml() : '<div class="loading"><span class="spin" aria-hidden="true"></span>טוען…</div>';
    } else if (S.done) html = doneHtml();
    else if (S.step === 1) html = stepType();
    else if (S.step === 2) html = stepWhen();
    else html = stepDetails();
    p.innerHTML = html;
    $('aside').innerHTML = S.done ? '' : asideHtml();
    $('aside').style.display = (S.mode === 'book' && !S.done && S.cfg && S.cfg.enabled !== false) ? '' : 'none';
    if (focusId) { var f = $(focusId); if (f) { try { f.focus({ preventScroll: false }); } catch (e) { f.focus(); } } }
  }
  function scrollTop() { var y = $('panel').getBoundingClientRect().top + window.pageYOffset - 12; if (window.pageYOffset > y) window.scrollTo({ top: y, behavior: 'smooth' }); }

  // ═════════════ נתונים ═════════════
  function loadSlots() {
    S.days = null; S.degraded = false; render();
    api({ action: 'slots', type: S.type }).then(function (j) {
      if (j.enabled === false) { S.cfg.enabled = false; render(); return; }
      if (!j.ok || j.degraded) { S.degraded = true; track('booking_error', { booking_type: S.type, reason: j.degraded ? 'degraded' : 'slots_' + j._status }); render(); return; }
      S.days = j.days || []; S.dur = j.duration;
      if (S.day && !S.days.some(function (d) { return d.date === S.day && d.slots.indexOf(S.slot) >= 0; })) S.slot = null;
      render();
    });
  }
  function readForm() {
    var fm = $('frm'); if (!fm) return;
    S.f.name = fm.name.value.trim(); S.f.phone = fm.phone.value.trim(); S.f.email = fm.email.value.trim();
    S.f.city = fm.city.value.trim(); S.f.notes = fm.notes.value.trim(); S.f.consent = fm.consent.checked;
    S.f.website = fm.website.value;
  }
  function phoneOk(p) {
    var d = String(p).replace(/[^0-9]/g, '');
    if (d.indexOf('972') === 0) d = '0' + d.slice(3);
    return /^05[0-9]{8}$/.test(d) || /^0[2-9][0-9]{7}$/.test(d) || /^07[0-9]{8}$/.test(d);
  }
  function validate() {
    var e = {};
    if (S.f.name.length < 2) e.name = 'נא למלא שם מלא';
    if (!phoneOk(S.f.phone)) e.phone = 'נא למלא מספר טלפון תקין';
    if (S.f.email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(S.f.email)) e.email = 'כתובת האימייל אינה תקינה';
    if (!S.f.consent) e.consent = 'נדרש אישור';
    return e;
  }
  function submit() {
    readForm();
    S.errs = validate(); S.msg = null;
    if (Object.keys(S.errs).length) {
      S.msg = { k: 'err', html: 'נא להשלים: ' + h(Object.keys(S.errs).map(function (k) { return { name: 'שם', phone: 'טלפון', email: 'אימייל', consent: 'אישור יצירת קשר' }[k]; }).join(' · ')) };
      render(S.errs.name ? 'f_name' : S.errs.phone ? 'f_phone' : S.errs.email ? 'f_email' : 'f_consent'); return;
    }
    S.busy = true; render();
    track('booking_submit', { booking_type: S.type });
    var body = { action: 'book', type: S.type, date: S.day, time: S.slot, full_name: S.f.name, phone: S.f.phone,
      email: S.f.email || undefined, city: S.f.city || undefined, notes: S.f.notes || undefined, plan: S.plan || undefined,
      consent: S.f.consent === true, website: S.f.website || undefined, page: (srcPage || location.href).slice(0, 500) };
    UTM_KEYS.forEach(function (k) { if (utm[k]) body[k] = utm[k]; });
    api({ action: 'book' }, body).then(function (j) {
      S.busy = false;
      if (j.ok && j.booked) {
        S.done = { type: S.type, date: j.date || S.day, time: j.time || S.slot, end: j.end || '', address: j.address || '', token: j.manage_token || '' };
        if (!S.done.end) { var mm = +S.done.time.slice(0, 2) * 60 + +S.done.time.slice(3) + typeDur(S.type); S.done.end = String(Math.floor(mm / 60)).padStart(2, '0') + ':' + String(mm % 60).padStart(2, '0'); }
        track('booking_complete', { booking_type: S.type, booking_date: S.done.date, booking_time: S.done.time });
        render('doneh'); scrollTop(); return;
      }
      var err = j.error;
      track('booking_error', { booking_type: S.type, reason: String(err || j._status) });
      if (err === 'invalid' && j.fields) {
        var map = { full_name: 'name', phone: 'phone', email: 'email', consent: 'consent' };
        j.fields.forEach(function (f) { if (map[f]) S.errs[map[f]] = 'נא לבדוק את השדה'; });
        if (j.fields.indexOf('slot') >= 0) { S.step = 2; S.slot = null; S.msg = { k: 'err', html: 'המועד שבחרתם אינו תקין. בחרו מועד מחדש.' }; loadSlots(); return; }
        S.msg = { k: 'err', html: 'נא לבדוק את השדות המסומנים.' }; render(); return;
      }
      if (err === 'taken') {
        S.step = 2; S.slot = null; S.days = j.days || null;
        S.msg = { k: 'warn', html: 'המועד שבחרתם נתפס הרגע. בחרו מועד אחר — הלוח עודכן.' };
        if (!S.days) loadSlots(); else render(); scrollTop(); return;
      }
      if (err === 'exists') {
        var ex = j.existing || {};
        S.msg = { k: 'warn', html: 'כבר קבעתם איתנו' + (ex.date ? ' ל' + h(dLong(ex.date)) + ' בשעה ' + h(ex.time) : '') + '. לשינוי מועד או ביטול, השתמשו בקישור שנשלח אליכם בוואטסאפ, או התקשרו: <a href="' + PHONE_TEL + '">' + PHONE + '</a>.' };
        render(); scrollTop(); return;
      }
      if (err === 'rate_limited') { S.msg = { k: 'err', html: 'היו יותר מדי ניסיונות. נסו שוב בעוד שעה, או התקשרו: <a href="' + PHONE_TEL + '">' + PHONE + '</a>.' }; render(); return; }
      S.msg = { k: 'err', html: 'לא הצלחנו לקבוע אונליין כרגע. התקשרו אלינו ונקבע יחד: <a href="' + PHONE_TEL + '">' + PHONE + '</a>.' };
      render(); scrollTop();
    });
  }

  function loadManage() {
    api({ action: 'manage', m: token }).then(function (j) {
      if (j._status === 404) S.mg = { notFound: true };
      else if (!j.ok || !j.booking) S.mg = { error: true };
      else S.mg = { booking: j.booking, days: j.days || [], degraded: !!j.degraded };
      if (S.mg.booking) track('booking_manage_view', { booking_type: S.mg.booking.type, booking_status: S.mg.booking.status });
      render();
    });
  }
  function doCancel() {
    S.busy = true; S.msg = null; render();
    api({ action: 'cancel' }, { action: 'cancel', m: token }).then(function (j) {
      S.busy = false; S.confirmCancel = false;
      if (j.ok || j.result === 'already') {
        S.mg.booking = j.booking || S.mg.booking; S.mg.booking.status = 'cancelled';
        S.msg = { k: 'ok', html: 'הביטול נקלט. תודה שעדכנתם.' };
        track('booking_cancel', { booking_type: S.mg.booking.type });
      } else if (j.result === 'past') { S.mg.booking.status = 'past'; }
      else S.msg = { k: 'err', html: 'לא הצלחנו לבטל כרגע. התקשרו אלינו: <a href="' + PHONE_TEL + '">' + PHONE + '</a>.' };
      render();
    });
  }
  function doMove() {
    if (!S.slot) return;
    S.busy = true; S.msg = null; render();
    var old = S.mg.booking;
    api({ action: 'reschedule' }, { action: 'reschedule', m: token, date: S.day, time: S.slot }).then(function (j) {
      S.busy = false;
      if (j.ok) {
        S.mg.booking = j.booking || S.mg.booking; S.mgView = 'info'; S.day = null; S.slot = null;
        S.msg = { k: 'ok', html: 'המועד עודכן ל' + h(dLong(S.mg.booking.date)) + ' בשעה ' + h(S.mg.booking.time) + '. אישור חדש נשלח בוואטסאפ.' };
        track('booking_reschedule', { booking_type: old.type, booking_date: S.mg.booking.date, booking_time: S.mg.booking.time });
        loadManage(); render(); scrollTop(); return;
      }
      if (j.error === 'taken') { S.slot = null; if (j.days) S.mg.days = j.days; S.msg = { k: 'warn', html: 'המועד נתפס הרגע. בחרו מועד אחר — הלוח עודכן.' }; render(); return; }
      if (j.error === 'cancelled' || j.error === 'past') { S.mgView = 'info'; loadManage(); return; }
      S.msg = { k: 'err', html: 'לא הצלחנו לעדכן כרגע. התקשרו אלינו: <a href="' + PHONE_TEL + '">' + PHONE + '</a>.' };
      render();
    });
  }

  // ═════════════ אירועים ═════════════
  document.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
    var a = b.getAttribute('data-act'), v = b.getAttribute('data-v');
    if (a === 'type') { if (S.type !== v) { S.type = v; S.day = null; S.slot = null; S.days = null; } S.msg = null; track('booking_type', { booking_type: v }); render(); }
    else if (a === 'to2') { if (!S.type) return; readForm(); S.step = 2; S.msg = null; if (!S.days) loadSlots(); else render(); scrollTop(); }
    else if (a === 'to1') { S.step = 1; S.msg = null; render(); scrollTop(); }
    else if (a === 'to3') { if (!S.slot) return; S.step = 3; S.msg = null; render('f_name'); scrollTop(); }
    else if (a === 'day') { S.day = v; S.slot = null; render(); }
    else if (a === 'slot') { S.slot = v; track('booking_slot', { booking_type: S.type || (S.mg && S.mg.booking.type), booking_date: S.day, booking_time: v }); render(); }
    else if (a === 'mprev' || a === 'mnext') {
      var y = +S.month.slice(0, 4), m = +S.month.slice(5, 7) - 1 + (a === 'mnext' ? 1 : -1);
      if (m < 0) { m = 11; y--; } if (m > 11) { m = 0; y++; }
      S.month = y + '-' + String(m + 1).padStart(2, '0'); render();
    }
    else if (a === 'plan') { readForm(); S.plan = S.plan === v ? null : v; render(); }
    else if (a === 'mgmove') { S.mgView = 'move'; S.day = null; S.slot = null; S.month = null; S.msg = null; render(); }
    else if (a === 'mginfo') { S.mgView = 'info'; S.msg = null; render(); }
    else if (a === 'askcancel') { S.confirmCancel = true; S.msg = null; render(); }
    else if (a === 'nocancel') { S.confirmCancel = false; render(); }
    else if (a === 'docancel') doCancel();
    else if (a === 'domove') doMove();
  });
  document.addEventListener('submit', function (ev) { if (ev.target.id === 'frm') { ev.preventDefault(); if (!S.busy) submit(); } });
  document.addEventListener('input', function (ev) {
    var n = ev.target.name; if (n && S.errs[n]) { delete S.errs[n]; var l = ev.target.closest('.fl'); if (l) l.classList.remove('bad'); }
  });

  // ═════════════ התחלה ═════════════
  if (S.mode === 'manage') { render(); loadManage(); }
  else {
    render();
    api({ action: 'config' }).then(function (j) {
      if (!j.ok) { S.degraded = true; render(); return; }
      S.cfg = { enabled: j.enabled !== false, consult_min: j.consult_min || 15, showroom_min: j.showroom_min || 30, horizon_days: j.horizon_days || 10, address: j.address || '' };
      track('booking_view', { booking_enabled: S.cfg.enabled, booking_type: S.type || undefined });
      if (S.cfg.enabled && S.type) { S.step = 2; loadSlots(); } else render();
    });
  }
})();
</script>
</body>
</html>
