input[type=date],input[type=number]{text-align:right}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:.93rem;border:1px solid var(--baseline);border-radius:8px;padding:7px 10px;background:#fff;color:var(--ink);width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue);outline-offset:1px;border-color:var(--blue)}
label{font-size:.8rem;font-weight:600;color:var(--ink-2);display:block;margin-bottom:3px}

/* header */
.topbar{background:var(--header);color:#fff;padding:0 20px;display:flex;align-items:center;gap:18px;height:58px;position:sticky;top:0;z-index:50}
.logo{display:flex;align-items:center;gap:12px;font-weight:800;font-size:1.05rem;white-space:nowrap}
.logo .wordmark{height:34px;display:block}
.logo small{display:block;font-weight:500;font-size:.72rem;color:#9fb3bf;line-height:1.2;margin-top:3px}
.ver{font-size:.68rem;color:#6d8291;font-weight:600}
.tabs{display:flex;gap:4px;height:100%}
.tab{background:none;border:none;color:#9fb3bf;font-size:.95rem;font-weight:600;padding:0 13px;height:100%;border-bottom:3px solid transparent;display:flex;align-items:center;gap:6px;white-space:nowrap}
.tab:hover{color:#fff}
.tab.active{color:#fff;border-bottom-color:var(--green)}
.tab .badge{background:var(--green);color:#06231a;border-radius:99px;font-size:.7rem;padding:1px 7px;font-weight:700}
.conn{margin-inline-start:auto;font-size:.78rem;display:flex;align-items:center;gap:7px;color:#9fb3bf}
.conn .dot{width:9px;height:9px;border-radius:50%;background:var(--warning)}
.conn.live .dot{background:var(--good)}
.btn-sync{background:rgba(106,159,133,.16);border:1px solid rgba(106,159,133,.5);color:#a9c9b9;border-radius:8px;padding:5px 12px;font-size:.8rem;font-weight:700;margin-inline-end:10px}
.sync-when{font-size:.68rem;color:#6d8291;margin-inline-end:8px;white-space:nowrap}
.user-chip{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:99px;padding:4px 12px;font-size:.78rem;color:#dfe7ec;margin-inline-end:10px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.user-chip small{color:#9fb3bf}
.user-chip button{background:none;border:none;color:#e08585;font-size:.9rem;cursor:pointer;padding:0 2px}
.user-chip button:hover{color:#ff9d9d}

/* מסך התחברות */
.login-wrap{min-height:calc(100vh - 140px);display:flex;align-items:center;justify-content:center}
.login-box{background:#fff;border-radius:18px;box-shadow:0 10px 40px rgba(6,24,39,.16);width:390px;max-width:94vw;text-align:center;overflow:hidden}
.login-head{background:linear-gradient(135deg,var(--dark,#061827),#0b3552);padding:26px 20px}
.login-logo{height:52px}
.login-body{padding:26px 36px 32px}
.login-box h2{color:var(--brand);font-size:1.25rem;margin-bottom:4px}
.login-box p{color:var(--muted);font-size:.85rem;margin-bottom:22px}
.login-box label{text-align:right}
.login-box form{text-align:right}
.login-err{background:#fbe0e0;color:#a92f2f;border-radius:8px;padding:8px 12px;font-size:.85rem;margin-bottom:14px;font-weight:600}
.login-btn{width:100%;margin-top:16px;justify-content:center}
.login-link{background:none;border:none;color:var(--brand);font-weight:600;font-size:.83rem;margin-top:14px;cursor:pointer;text-decoration:underline;font-family:inherit}
.login-link:hover{color:var(--brand-dark)}

/* אווטאר ופרופיל */
.avatar{border-radius:50%;object-fit:cover;display:inline-flex;vertical-align:middle;flex:none}
.avatar-txt{background:var(--green);color:#06231a;font-weight:800;align-items:center;justify-content:center;display:inline-flex}
.avatar-wrap{position:relative;cursor:pointer;flex:none}
.avatar-wrap .av-edit{position:absolute;bottom:-2px;inset-inline-end:-4px;background:var(--brand);color:#fff;border-radius:50%;width:28px;height:28px;display:grid;place-items:center;font-size:.8rem;border:2px solid #fff}
.profile-top{display:flex;gap:18px;align-items:center;margin:6px 0 14px;flex-wrap:wrap}
.profile-facts{font-size:.88rem;line-height:1.9}

/* ניהול משתמשים */
.user-row{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--grid);flex-wrap:wrap}
.user-row .u-mail{font-size:.82rem;color:var(--ink-2);min-width:180px;font-weight:600}
.user-row .u-views,.user-row .u-edits{display:flex;gap:10px;flex-wrap:wrap;background:#f4f8f6;border-radius:8px;padding:5px 10px;align-items:center}
.user-row .u-edits{background:#f8f5ef}
.u-perm-title{font-size:.74rem;font-weight:800;color:var(--ink-2)}
.user-row.u-pending{background:#fdf3f3;border:1px solid #f3caca;border-radius:10px;padding:9px 10px}
.u-chk{display:inline-flex;align-items:center;gap:4px;font-size:.76rem;margin:0;font-weight:600;color:var(--ink-2)}
.u-chk input{width:auto}
.btn-sync:hover{background:rgba(106,159,133,.3);color:#fff}
.btn-sync:disabled{opacity:.5;cursor:wait}

main{max-width:1380px;margin:0 auto;padding:22px 22px 60px} /* מעט רחב מהמקור — מאוזן לדשבורד ולטבלאות */

.demo-banner{background:#fff7e6;border:1px solid #f2d492;color:#7a5b00;border-radius:var(--radius);padding:10px 14px;font-size:.87rem;margin-bottom:18px;display:flex;gap:8px;align-items:center}
.demo-banner b{font-weight:700}

/* דשבורד */
.dash-hero{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px;background:linear-gradient(135deg,#061827,#0b3552);border-radius:14px;padding:20px 26px;color:#fff;box-shadow:var(--shadow)}
.dash-hero h2{font-size:1.35rem;font-weight:800}
.dh-date{color:#9fb3bf;font-size:.85rem;margin-top:3px}
.dh-today{background:rgba(106,159,133,.18);border:1px solid rgba(106,159,133,.45);border-radius:12px;padding:10px 20px;font-size:.85rem;color:#cfe3d9;display:flex;align-items:center;gap:9px}
.dh-num{font-size:1.6rem;font-weight:800;color:#8fc7ab}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:13px;margin-bottom:22px}
.kpi{background:var(--surface-1);border:1px solid var(--ring);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);cursor:pointer;transition:transform .09s, box-shadow .09s;display:flex;gap:13px;align-items:center;border-top:4px solid var(--baseline)}
.kpi:hover{transform:translateY(-3px);box-shadow:0 6px 18px rgba(6,24,39,.14)}
.kpi .kic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:1.35rem;flex:none;background:var(--page)}
.kpi .val{font-size:1.85rem;font-weight:800;line-height:1.1}
.kpi .lbl{font-size:.84rem;font-weight:700;color:var(--ink-2)}
.kpi .sub{font-size:.7rem;color:var(--muted)}
.kpi.a-brand{border-top-color:var(--brand)} .kpi.a-brand .kic{background:#e6edf2} .kpi.a-brand .val{color:var(--brand)}
.kpi.a-red{border-top-color:var(--critical)} .kpi.a-red .kic{background:#fbe9e9} .kpi.a-red .val{color:var(--critical)}
.kpi.a-yellow{border-top-color:#e0a80b} .kpi.a-yellow .kic{background:#fdf3d8} .kpi.a-yellow .val{color:#a37a00}
.kpi.a-green{border-top-color:var(--green)} .kpi.a-green .kic{background:#e8f2ed} .kpi.a-green .val{color:#42775e}
.kpi.a-blue{border-top-color:var(--blue)} .kpi.a-blue .kic{background:#e7effb} .kpi.a-blue .val{color:#1c5cab}
.kpi.a-orange{border-top-color:var(--orange)} .kpi.a-orange .kic{background:#fdeae2} .kpi.a-orange .val{color:#b34a1b}

.section{background:var(--surface-1);border:1px solid var(--ring);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:20px}
.section h3{font-size:1rem;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.section h3 small{font-weight:500;color:var(--muted);font-size:.75rem}
.section h3 .h-ic{background:var(--page);border-radius:9px;width:32px;height:32px;display:grid;place-items:center;font-size:1rem}
.num-chip{border:2px solid var(--baseline);border-radius:99px;padding:0 9px;font-weight:800;font-size:.82rem;display:inline-block;min-width:32px;text-align:center}
.up-chip{flex:none;width:62px;text-align:center;background:var(--page);border-radius:9px;padding:4px 2px;line-height:1.25}
.up-chip b{display:block;font-size:.72rem;color:var(--brand)}
.up-chip span{font-size:.68rem;color:var(--muted);font-weight:700}
.up-chip.today{background:#e8f2ed;outline:1.5px solid var(--green)}
.up-chip.today b::after{content:' · היום';color:#42775e}
.two-col{display:grid;grid-template-columns:1.2fr 1fr;gap:20px;align-items:start}
@media(max-width:900px){.two-col{grid-template-columns:1fr}}

/* team load bars */
.loadbar-row{display:grid;grid-template-columns:130px 1fr 46px;align-items:center;gap:10px;margin-bottom:9px;font-size:.88rem}
.loadbar-row .name{font-weight:600;color:var(--ink-2);display:flex;align-items:center;gap:7px}
.loadbar-row .swatch{width:10px;height:10px;border-radius:3px;flex:none}
.loadbar-track{background:var(--page);border-radius:99px;height:20px;overflow:hidden}
.loadbar-fill{height:100%;border-radius:99px;min-width:4px;transition:width .4s}
.loadbar-row .num{font-weight:700;text-align:left}
.up-item{border-radius:9px;margin-bottom:4px;background:var(--surface-1)}
.up-item:hover{background:#f2f6f4}

/* upcoming list */
.up-item{display:flex;gap:10px;padding:9px 4px;border-bottom:1px solid var(--grid);font-size:.88rem;align-items:center;cursor:pointer}
.up-item:hover{background:var(--page)}
.up-item:last-child{border-bottom:none}
.up-date{flex:none;width:84px;font-weight:700;color:var(--ink-2);font-size:.8rem}
.up-main{flex:1;min-width:0}
.up-main .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.up-main .dt{font-size:.76rem;color:var(--muted)}

/* toolbar / filters */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px;align-items:center}
.toolbar .search{flex:1;min-width:200px;position:relative}
.toolbar .search input{padding-inline-start:32px}
.toolbar .search::before{content:'🔎';position:absolute;inset-inline-start:9px;top:7px;font-size:.85rem;opacity:.55}
.toolbar select{width:auto;min-width:120px}
.toolbar input[type=date]{width:auto}
.toolbar .tb-lbl{font-size:.78rem;color:var(--ink-2);white-space:nowrap}
.toolbar .tb-group{display:flex;gap:6px;align-items:center;white-space:nowrap}
.btn{border:none;border-radius:8px;padding:8px 16px;font-weight:700;font-size:.9rem;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--brand);color:#fff}
.btn-primary:hover{background:var(--brand-dark)}
.btn-ghost{background:#fff;border:1px solid var(--baseline);color:var(--ink-2)}
.btn-ghost:hover{border-color:var(--ink-2)}
.btn-wa{background:#1faa53;color:#fff;padding:5px 10px;border-radius:7px;font-size:.78rem;font-weight:700;text-decoration:none;display:inline-flex;gap:5px;align-items:center;white-space:nowrap}
.btn-wa:hover{background:#178a43}
.btn-wa.off{background:#ccc;pointer-events:none}

.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--baseline);background:#fff;border-radius:99px;padding:4px 13px;font-size:.82rem;font-weight:600;color:var(--ink-2)}
.chip.active{background:var(--brand);border-color:var(--brand);color:#fff}
.chip .n{font-weight:800}

/* table */
.tbl-wrap{overflow-x:auto;background:var(--surface-1);border:1px solid var(--ring);border-radius:var(--radius);box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;font-size:.8rem;min-width:840px}
th{position:sticky;top:0;background:#f7f7f4;text-align:right;padding:6px 7px;font-size:.72rem;color:var(--ink-2);border-bottom:2px solid var(--grid);white-space:nowrap;z-index:2}
td{padding:6px 8px;border-bottom:1px solid var(--grid);vertical-align:middle;white-space:nowrap;max-width:190px;overflow:hidden;text-overflow:ellipsis;line-height:1.35}
tbody tr{cursor:pointer}
tbody tr:nth-child(even){background:#f6f7f6} /* שורות זברה — אחת לבנה ואחת אפרפרה, לקריאות */
.rownum{width:38px;min-width:38px;text-align:center;color:var(--muted);font-size:.72rem;font-weight:600} /* מספור שורות דינאמי */
tbody tr:hover{background:#eef4f2}
.pill{display:inline-block;border-radius:99px;padding:1px 8px;font-size:.72rem;font-weight:700}
.inline-edit{width:auto;max-width:130px;font-size:.76rem;padding:3px 5px;border:1px solid transparent;background:transparent;border-radius:6px;cursor:pointer;color:var(--ink)}
.inline-edit:hover{border-color:var(--baseline);background:#fff}
.inline-edit:focus{border-color:var(--blue);background:#fff}
.inline-edit.ie-date{max-width:118px;direction:ltr}
select.pilled{border-radius:99px;font-weight:700;-webkit-appearance:none;appearance:none}
select.inline-edit.pilled{padding:2px 9px;font-size:.73rem}
select.pilled:hover{filter:brightness(.95)}
select.pilled.p-blue{background:#e3edfb;color:#1c5cab;border-color:#c4d9f5}
select.pilled.p-green{background:#e2f4e2;color:#006300;border-color:#bfe4bf}
select.pilled.p-yellow{background:#fdf0d2;color:#7a5b00;border-color:#f0dc9e}
select.pilled.p-orange{background:#fde5da;color:#a33c12;border-color:#f5c7b0}
select.pilled.p-red{background:#fbe0e0;color:#a92f2f;border-color:#f0bcbc}
select.pilled.p-violet{background:#e9e6f8;color:#4a3aa7;border-color:#cfc8f0}
select.pilled.p-gray{background:#eeeeea;color:#555;border-color:#d8d8d2}
td .note-preview{font-size:.68rem}
.p-gray{background:#eeeeea;color:#555}
.p-blue{background:#e3edfb;color:#1c5cab}
.p-green{background:#e2f4e2;color:#006300}
.p-yellow{background:#fdf0d2;color:#7a5b00}
.p-orange{background:#fde5da;color:#a33c12}
.p-red{background:#fbe0e0;color:#a92f2f}
.p-violet{background:#e9e6f8;color:#4a3aa7}
.team-tag{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:.8rem}
.team-tag .swatch{width:9px;height:9px;border-radius:3px}
.overdue{color:var(--critical);font-weight:700}
td .note-preview{color:var(--muted);font-size:.78rem}

/* calendar */
.cal-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.cal-head h2{font-size:1.15rem;flex:1}
.view-switch{display:flex;border:1px solid var(--baseline);border-radius:9px;overflow:hidden}
.view-switch button{background:#fff;border:none;padding:7px 16px;font-size:.85rem;font-weight:600;color:var(--ink-2)}
.view-switch button.active{background:var(--brand);color:#fff}
.cal-grid{display:grid;grid-template-columns:repeat(6,minmax(185px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px}
.month-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.month-grid .mh{font-size:.85rem;font-weight:800;color:var(--brand);text-align:center;padding:6px 0;background:#e9eff3;border-radius:8px}
.month-cell{background:var(--surface-1);border:1px solid var(--ring);border-radius:10px;min-height:132px;padding:7px 8px;cursor:pointer;box-shadow:var(--shadow)}
.month-cell:hover{background:#f2f6f4}
.month-cell.out{opacity:.35}
.month-cell.today{outline:2px solid var(--green);outline-offset:-1px;background:#f4faf7}
.month-cell .mnum{font-size:.85rem;font-weight:800;color:var(--ink);margin-bottom:5px;display:flex;justify-content:space-between;align-items:center}
.month-cell .mcount{background:var(--brand);color:#fff;border-radius:99px;font-size:.62rem;padding:0 6px;font-weight:700}
.mini-ev{font-size:.68rem;border-radius:6px;padding:3px 6px;margin-bottom:3px;background:var(--page);border-inline-start:3px solid var(--muted);line-height:1.35}
.mini-ev .me-line1{display:flex;gap:5px;align-items:baseline;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-ev .me-line1 b{overflow:hidden;text-overflow:ellipsis}
.mini-ev .me-time{color:var(--brand);font-weight:800;font-size:.63rem;flex:none}
.mini-ev .me-line2{color:var(--ink-2);font-size:.62rem;display:flex;gap:4px;align-items:center;white-space:nowrap;overflow:hidden}
.mini-ev .me-dot{width:7px;height:7px;border-radius:2px;flex:none;display:inline-block}
.mini-more{font-size:.68rem;color:var(--brand);font-weight:700;margin-top:2px}
.teamchip{color:#fff;border-radius:99px;padding:1px 9px;font-size:.66rem;font-weight:700}
.teamchip.nochip{background:#fbe0e0;color:#a92f2f}
.ev-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
.ev-time{font-weight:800;color:var(--brand);font-size:.74rem}
.ev-done{color:var(--good-text);font-size:.66rem;font-weight:700}
.ev-foot{margin-top:3px;align-items:center}
.day-list{max-width:760px}
.day-ev{background:var(--surface-1);border:1px solid var(--ring);border-radius:10px;padding:12px 14px;margin-bottom:10px;cursor:pointer;border-inline-start:5px solid var(--muted);box-shadow:var(--shadow);display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.day-ev:hover{background:#f2f6f4}
.day-ev .tm{font-weight:800;min-width:92px;font-size:.92rem}
.day-ev .who{flex:1;min-width:180px}
.day-ev .who .nm{font-weight:700}
.day-ev .who .dt{font-size:.78rem;color:var(--ink-2)}
.cal-day{background:var(--surface-1);border:1px solid var(--ring);border-radius:var(--radius);min-height:190px;padding:8px;box-shadow:var(--shadow)}
.cal-day.today{outline:2px solid var(--green);outline-offset:-1px}
.cal-day .dhead{font-size:.8rem;font-weight:700;color:var(--ink-2);display:flex;justify-content:space-between;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--grid)}
.cal-day .dhead .dnum{font-size:.95rem;color:var(--ink)}
.cal-day.nowork{background:repeating-linear-gradient(45deg,#f7f7f5,#f7f7f5 8px,#f1f1ee 8px,#f1f1ee 16px)}
.cal-day .fri-tag{background:#fde8c8;color:#8a5a00;border-radius:4px;padding:0 5px;font-size:.68rem;font-weight:800;margin-inline-start:4px}
.month-cell.nowork{background:#f6f6f4;opacity:.72}
.ev{border-radius:8px;padding:7px 9px;font-size:.78rem;margin-bottom:7px;cursor:pointer;border-inline-start:4px solid var(--muted);background:var(--page);line-height:1.45}
.ev:hover{filter:brightness(.96)}
.ev .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.8rem}
.ev .s{color:var(--ink-2);font-size:.7rem;display:flex;gap:5px;flex-wrap:wrap}
.ev.svc{background:#fdf4f4}
.ev .tagx{background:#fff;border:1px solid var(--ring);border-radius:4px;padding:0 4px;font-size:.65rem}
.cal-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:.8rem;color:var(--ink-2)}
.cal-legend span{display:inline-flex;align-items:center;gap:6px}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(10,10,10,.45);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:30px 14px;overflow-y:auto}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:14px;max-width:860px;width:100%;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.3);position:relative}
.modal-x{position:absolute;top:12px;inset-inline-start:14px;background:var(--page);border:none;border-radius:50%;width:32px;height:32px;font-size:.95rem;color:var(--ink-2);cursor:pointer;display:grid;place-items:center;z-index:5}
.modal-x:hover{background:#fbe0e0;color:#a92f2f}
.waze-btn{display:inline-flex;align-items:center;gap:4px;background:#e6f7fd;color:#0b6e8f;border:1px solid #b5e6f5;border-radius:99px;padding:1px 9px;font-size:.7rem;font-weight:800;text-decoration:none;vertical-align:middle}
.waze-btn:hover{background:#d2f0fb}
.waze-btn svg{width:15px;height:15px}
.modal h2{font-size:1.1rem;margin-bottom:4px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.modal .subline{color:var(--muted);font-size:.8rem;margin-bottom:16px}
.others-box{background:#f4f8f6;border:1px solid #d5e5dc;border-radius:9px;padding:10px 12px;margin:14px 0 4px;font-size:.82rem}
.others-box .ob-title{font-weight:700;color:#3a6a53;margin-bottom:6px}
.other-row{display:flex;gap:12px;align-items:center;padding:5px 6px;border-top:1px dashed #d5e5dc;cursor:pointer;flex-wrap:wrap}
.other-row:hover{background:#eaf2ee}
.other-row .ob-note{color:var(--ink-2);font-size:.76rem}
/* הזמנה נוספת לאותה כתובת משלוח — סימון בוהק כדי לשלב משלוחים/התקנות יחד */
.other-row.same-addr{background:#fff3a6;border:1.5px solid #eab308;border-radius:8px;border-top:1.5px solid #eab308}
.other-row.same-addr:hover{background:#ffec7a}
.same-tag{background:#f59e0b;color:#fff;font-weight:800;font-size:.72rem;padding:2px 9px;border-radius:99px;white-space:nowrap}
.form-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.form-grid .span2{grid-column:span 2}
.form-grid .span4{grid-column:span 4}
@media(max-width:760px){.form-grid{grid-template-columns:repeat(2,1fr)}.form-grid .span4{grid-column:span 2}}
.form-sep{grid-column:1/-1;font-size:.8rem;font-weight:700;color:var(--brand);border-bottom:1px solid var(--grid);padding-bottom:4px;margin-top:8px}
/* בורד מק"טים */
.sku-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.sku-bar #skuQ{max-width:340px}
.sku-stats{display:flex;gap:16px;flex-wrap:wrap;font-size:.8rem;color:var(--ink-2);margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--grid)}
.sku-stats b{color:var(--ink)}
.sku-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px}
.sku-card{background:var(--surface-1);border:1px solid var(--ring);border-radius:10px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column}
.sku-card[data-skuimg]{cursor:zoom-in}
.sku-card[data-skuimg]:hover{box-shadow:0 6px 18px rgba(6,24,39,.14)}
.sku-thumb{height:118px;background:#fff;display:grid;place-items:center;border-bottom:1px solid var(--grid);overflow:hidden}
.sku-thumb img{max-width:100%;max-height:118px;object-fit:contain;display:block}
.sku-noimg{color:var(--muted);font-size:.75rem}
.sku-info{padding:8px 10px;display:flex;flex-direction:column;gap:3px}
.sku-code{font-weight:800;font-size:.8rem;color:var(--brand);text-align:start}
.sku-name{font-size:.78rem;color:var(--ink-2);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.1em}
.sku-price{font-weight:800;font-size:.85rem;color:var(--good-text)}
.sku-noprice{color:var(--muted);font-weight:400;font-size:.75rem}
@media(max-width:760px){.sku-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}}
/* דו שיח פנימי מפריוריטי — תצוגה בלבד */
.dialog-box{background:#f6f8fa;border:1px solid var(--ring);border-radius:8px;padding:8px 10px;font-size:.8rem;line-height:1.5;max-height:120px;overflow:auto;white-space:normal;color:var(--ink)}
.dialog-box .dialog-empty{color:var(--ink-2)}
/* פירוט ההזמנה מפריוריטי — מק"ט, תיאור, כמות */
.items-wrap{max-height:280px;overflow:auto;border:1px solid var(--ring);border-radius:8px;background:var(--surface-1)}
.items-tbl{width:100%;border-collapse:collapse;font-size:.8rem}
.items-tbl th{position:sticky;top:0;background:#e9eff3;color:var(--brand);font-weight:800;font-size:.75rem;text-align:start;padding:6px 8px;z-index:1}
.items-tbl td{padding:5px 8px;border-top:1px solid var(--grid)}
.items-tbl tbody tr:nth-child(even){background:var(--page)}
.items-tbl .rn{color:var(--ink-2);font-size:.72rem}
.items-tbl .sku{font-weight:700;text-align:start}
.items-tbl .qty{font-weight:800;text-align:center}
.items-tbl .mismatch{background:#fde8c8;color:#8a5a00;border-radius:4px;padding:0 5px;font-size:.68rem;font-weight:800;margin-inline-start:6px}
.items-loading,.items-empty{color:var(--ink-2);font-size:.8rem;padding:8px 2px}
.slot-custom{display:flex;align-items:center;gap:6px}
.slot-custom input{flex:1;min-width:0}
.chk-line{display:flex;align-items:center;gap:8px;font-size:.85rem;background:#fff8ec;border:1px solid #f2d9ab;border-radius:8px;padding:8px 10px;cursor:pointer}
.chk-line input{width:16px;height:16px;flex:none;margin:0}
.chk-line .hint{color:var(--ink-2);font-size:.78rem;font-weight:400}
/* מסך הגדרות בסגנון אקורדיון — לחיצה על כותרת פותחת/סוגרת את הסעיף */
.section.acc>h3{cursor:pointer;user-select:none;margin-bottom:0}
.section.acc>h3::after{content:'▾';margin-inline-start:auto;color:var(--muted);font-size:1rem;transition:transform .15s}
.section.acc.open>h3::after{transform:rotate(180deg)}
.section.acc>h3:hover{color:var(--brand)}
.section.acc .acc-body{display:none;margin-top:14px}
.section.acc.open .acc-body{display:block}
/* תמונות שטח בקריאת שירות */
.photo-grid{display:flex;gap:8px;flex-wrap:wrap}
.photo-grid img{width:86px;height:86px;object-fit:cover;border-radius:8px;border:1px solid var(--ring)}
.photo-grid a:hover img{outline:2px solid var(--brand)}
.photo-add{width:86px;height:86px;border:2px dashed var(--baseline);border-radius:8px;display:grid;place-items:center;font-size:1.3rem;cursor:pointer;color:var(--muted)}
.photo-add:hover{border-color:var(--brand);color:var(--brand)}
/* שדות עם תוכן לועזי/מספרי (טלפון, אימייל, תאריך) — הערך תמיד צמוד לימין כמו כל השדות */
.form-grid input[dir="ltr"]{text-align:right}
input.ro,select.ro,textarea.ro{background:#eef0f2;color:#6a7178;border-color:#e2e5e8;cursor:not-allowed}
input.ro:focus,textarea.ro:focus{outline:none;border-color:#e2e5e8}
.src-tag{background:#eef0f2;color:#8a9199;border-radius:99px;padding:0 8px;font-size:.66rem;font-weight:700;margin-inline-start:5px}
.modal-actions{display:flex;gap:10px;margin-top:20px;align-items:center}
.modal-actions .del{margin-inline-start:auto;background:none;border:none;color:var(--critical);font-weight:600;font-size:.85rem}
.wa-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px dashed var(--grid)}

/* settings */
.team-row{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--grid)}
.team-row input[type=color]{width:44px;height:32px;padding:2px;border-radius:7px}
.team-row input[type=text]{max-width:220px}
.team-row .drag{color:var(--muted)}
/* אנשי צוות ושיבוץ להזמנה (הערה 2) */
.member-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--grid)}
.member-row input[type=text]{max-width:170px}
.member-row select{max-width:180px}
@media(max-width:760px){.member-row input[type=text],.member-row select{max-width:none;flex:1 1 46%}}
.assign-list{display:flex;flex-wrap:wrap;gap:8px}
.assign-chk{display:flex;align-items:center;gap:6px;margin:0;font-size:.83rem;background:var(--surface-1);border:1px solid var(--ring);border-radius:8px;padding:6px 10px;cursor:pointer}
.assign-chk input{width:16px;height:16px;flex:none;margin:0}
.assign-chk .assign-role{color:var(--ink-2);font-size:.74rem}
.assign-hint{color:var(--ink-2);font-size:.8rem;padding:6px 2px}
.assign-hint.warn{background:#fff8ec;border:1px solid #f2d9ab;border-radius:8px;padding:7px 10px;color:#8a5a00;margin-top:8px}
.hint-inline{color:var(--ink-2);font-size:.76rem;font-weight:400}
.settings-note{font-size:.8rem;color:var(--muted);margin-top:8px;line-height:1.5}
textarea.tpl{min-height:70px;margin-bottom:10px}
.code-box{background:#171717;color:#9fe7a9;border-radius:8px;padding:12px;font-family:monospace;font-size:.8rem;direction:ltr;text-align:left;overflow-x:auto;margin-top:8px}

.empty{padding:40px;text-align:center;color:var(--muted);font-size:.95rem}

/* לוח איפיון */
.spec-head{display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.spec-head h2{font-size:1.1rem;flex:1}
.spec-vp{position:relative;height:calc(100vh - 215px);min-height:480px;overflow:hidden;background:#e9edee;border:1px solid var(--ring);border-radius:var(--radius);cursor:grab;box-shadow:var(--shadow)}
.spec-vp.dragging{cursor:grabbing}
.spec-canvas{position:absolute;left:0;top:0;width:1640px;transform-origin:0 0}
.spec-edges{position:absolute;inset:0;overflow:visible;pointer-events:none}
.spec-zone{position:relative;margin:48px 34px;border:2px dashed rgba(6,24,39,.14);border-radius:20px;padding:60px 30px 30px;background:rgba(255,255,255,.55)}
.spec-zone>.ztitle{position:absolute;top:-20px;inset-inline-start:30px;color:#fff;border-radius:99px;padding:7px 26px;font-weight:800;font-size:1.05rem;box-shadow:0 2px 10px rgba(6,24,39,.24)}
.spec-row{display:flex;gap:40px 46px;align-items:stretch;margin-bottom:42px;flex-wrap:nowrap}
.spec-row:last-child{margin-bottom:0}
.snode{position:relative;border-radius:14px;padding:14px 17px;width:212px;min-height:80px;flex:none;box-shadow:0 4px 12px rgba(6,24,39,.13);cursor:pointer;transition:transform .08s;z-index:2}
.snode:hover{transform:scale(1.05);z-index:5}
.snode .nt{font-weight:800;font-size:.95rem;line-height:1.35}
.snode .ns{font-size:.8rem;color:#4c5560;margin-top:5px;line-height:1.5}
.snode .nfields{position:absolute;bottom:6px;inset-inline-end:10px;font-size:.64rem;color:#84898f;font-weight:700}
.snode.proc{background:#fff;border:2px solid #c6d2da}
.snode.dec{background:#fdf0d2;border:2px solid #e5c96a;border-radius:22px}
.snode.dec .nt::before{content:'❓ '}
.snode.data{background:#e3edfb;border:2px solid #9ec5f4}
.snode.data .nt::before{content:'🗄️ '}
.snode.ext{background:#061827;border:2px solid #000;color:#fff}
.snode.ext .ns{color:#9fb3bf}
.snode.auto{background:#e2f4e2;border:2px solid #9fd3ac}
.snode.auto .nt::before{content:'⚡ '}
.snode.term{background:var(--brand);color:#fff;border-radius:99px;border:2px solid #001a2b;display:flex;flex-direction:column;justify-content:center}
.snode.term .ns{color:#9fb3bf}
.snode.warn{background:#fbe0e0;border:2px solid #eda5a5}
.selabel{position:absolute;background:#fff;border:1.5px solid #c6d2da;border-radius:99px;padding:1px 10px;font-size:.76rem;font-weight:800;z-index:6;white-space:nowrap;transform:translate(-50%,-50%);box-shadow:0 1px 4px rgba(6,24,39,.15)}
.selabel.yes{background:#e2f4e2;border-color:#9fd3ac;color:#006300}
.selabel.no{background:#fbe0e0;border-color:#eda5a5;color:#a92f2f}
.spec-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.75rem;margin-top:10px;color:var(--ink-2)}
.spec-legend span{display:inline-flex;align-items:center;gap:5px;font-weight:600}
.spec-legend i{width:15px;height:11px;border-radius:4px;display:inline-block;border:2px solid}
.spec-pop{position:fixed;display:none;z-index:120;background:#fff;border-radius:14px;box-shadow:0 14px 44px rgba(6,24,39,.35);padding:16px 18px;width:400px;max-width:92vw;max-height:70vh;overflow-y:auto;font-size:.85rem;line-height:1.6}
.spec-pop h3{color:var(--brand);font-size:.95rem;margin-bottom:6px;padding-inline-end:20px}
.spec-pop .close{position:absolute;top:8px;inset-inline-end:12px;border:none;background:none;font-size:.95rem;cursor:pointer;color:#84898f}
.spec-pop table{width:100%;min-width:0;border-collapse:collapse;font-size:.78rem;margin-top:10px;table-layout:fixed}
.spec-pop th{background:#eef3f1;color:var(--brand);text-align:right;padding:5px 8px;font-size:.72rem}
.spec-pop th:first-child,.spec-pop td:first-child{width:44%}
.spec-pop td{border-bottom:1px solid #eef0f1;padding:4px 8px;vertical-align:top;overflow-wrap:break-word}
.spec-pop td code{background:#f0f3f4;border-radius:5px;padding:1px 7px;font-size:.72rem;direction:ltr;unicode-bidi:embed;display:inline-block;color:#1c5cab;font-weight:600}
.toast{position:fixed;bottom:24px;inset-inline-start:24px;background:var(--header);color:#fff;border-radius:10px;padding:11px 18px;font-size:.9rem;font-weight:600;z-index:200;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
.count-line{font-size:.8rem;color:var(--muted);margin:10px 2px}

/* ============================================================
   רספונסיביות — טאבלט וטלפון (צופים, מנהלים ואדמין)
   ============================================================ */
@media(max-width:1024px){
  .topbar{flex-wrap:wrap;height:auto;padding:8px 12px;gap:6px 14px;row-gap:4px}
  .tabs{order:3;width:100%;overflow-x:auto;height:46px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{padding:0 11px;font-size:.88rem;white-space:nowrap;flex:none}
  .conn{margin-inline-start:auto;flex-wrap:wrap;row-gap:4px}
  main{padding:14px 12px 50px}
  .kpi .val{font-size:1.5rem}
}
@media(max-width:760px){
  html{font-size:14.5px}
  .logo .wordmark{height:26px}
  .logo small{display:none}
  .sync-when{display:none}
  .user-chip small{display:none}
  .btn-sync{font-size:.74rem;padding:4px 9px;margin-inline-end:4px}
  .dash-hero{padding:14px 16px}
  .dash-hero h2{font-size:1.1rem}
  .dh-num{font-size:1.3rem}
  .kpi-grid{grid-template-columns:repeat(2,1fr);gap:9px}
  .kpi{padding:11px 12px;gap:9px}
  .kpi .kic{width:38px;height:38px;font-size:1.1rem}
  .toolbar{gap:7px}
  .toolbar .search{min-width:100%}
  .toolbar select{min-width:0;flex:1}
  .toolbar .tb-group{flex-wrap:wrap}
  .chips{gap:5px}
  .chip{padding:3px 10px;font-size:.78rem}
  .modal-bg{padding:12px 6px}
  .modal{padding:16px 12px;border-radius:12px}
  .modal h2{font-size:1rem;padding-inline-start:30px}
  .form-grid{grid-template-columns:repeat(2,1fr);gap:9px}
  .wa-row{flex-wrap:wrap;gap:7px}
  .modal-actions{flex-wrap:wrap;gap:8px}
  .loadbar-row{grid-template-columns:96px 1fr 38px;font-size:.82rem}
  .up-date{width:66px;font-size:.72rem}
  .month-grid{overflow-x:auto;grid-template-columns:repeat(6,minmax(120px,1fr))}
  .day-ev{padding:10px 11px;gap:9px}
  .spec-canvas-wrap{touch-action:none}
}
@media(max-width:560px){
  .form-grid{grid-template-columns:1fr}
  .form-grid .span2,.form-grid .span4{grid-column:span 1}
  .facts,.profile-top{grid-template-columns:1fr}
  .two-col{grid-template-columns:1fr}
  .view-switch button{padding:6px 11px;font-size:.8rem}
  .cal-head h2{font-size:.98rem;width:100%}
  .btn{padding:8px 12px;font-size:.85rem}
  .photo-grid img,.photo-add{width:72px;height:72px}
  .user-row .u-mail{min-width:0;width:100%}
}
</style>
</head>

const YESNO = ['כן','לא'];
const ACTIVE_ORDER = o => !['הושלם','בוטל','מבוטלת'].includes(o.order_status);
const ACTIVE_CALL = c => c.status !== 'הושלם';
const ROLE_LABELS = {admin:'אדמיניסטרטור', manager:'מנהל', viewer:'צופה', member:'איש צוות', pending:'ממתין לאישור'};
// איש צוות רואה רק את העבודות ששובץ אליהן, ורק את המסכים הרלוונטיים לשטח
const MEMBER_VIEWS = ['dashboard','orders','calendar'];
const ALL_VIEWS = [['dashboard','דשבורד'],['orders','הזמנות ותיאומים'],['service','קריאות שירות'],['calendar','לוח שנה'],['skus','מק"טים'],['docs','מסמכים'],['spec','איפיון']];
// הרשאות עריכה פרטניות (למנהל): מפתח ← תווית בהגדרות
const EDIT_PERMS = [['orders','עריכת הזמנות'],['calls','עריכת קריאות שירות'],['docs','שליחת מסמכים לחתימה'],['photos','העלאת תמונות שטח']];
function role(){
  if(S.viewAs && S.profile && S.profile.role==='admin') return S.viewAs;
  return S.profile ? S.profile.role : 'admin'; // בלי מערכת משתמשים — הכל פתוח (מצב דמו / טרם שודרג)
}
// הקשר העריכה הנוכחי (נקבע בזמן ציור לוח ההזמנות / הקריאות)
let EDIT_CTX = 'orders';
function canDo(k){ // k: 'orders' / 'calls' / 'docs' / 'photos'
  const r = role();
  if(r==='admin') return true;
  // איש צוות: בהזמנה ששובץ אליה מותרות לו שתי פעולות בלבד —
  // העלאת תמונות מהשטח ומילוי/חתימת דוח אישור תקינות. שום שדה אחר אינו ניתן לעדכון.
  if(r==='member') return k==='photos';
  if(r!=='manager') return false;
  if(S.viewAs && realAdmin()) return true; // מצב "צפה כמנהל" — מנהל מלא
  const e = S.profile && S.profile.perms && S.profile.perms.edit;
  return !e || e[k] !== false; // ברירת מחדל: מותר, אלא אם האדמין כיבה
}
function canEdit(){ return canDo(EDIT_CTX); }
function isMember(){ return role()==='member'; }
// פתיחת דוח אישור תקינות ציוד: אדמין/מנהל תמיד; איש צוות — בהזמנה ששובץ אליה בלבד
function canMakeReport(kind){ return canDo('docs') || (isMember() && kind!=='call'); }
function isAdmin(){ return role()==='admin'; }
function realAdmin(){ return S.profile ? S.profile.role==='admin' : true; }
function canView(v){
  const r = role();
  if(r==='pending') return false;
  if(r==='admin') return true;
  if(v==='settings') return false; // הגדרות — לאדמין בלבד
  // איש צוות: רק דשבורד, ההזמנות שלו והלוח (הערה 2)
  if(r==='member') return MEMBER_VIEWS.includes(v);
  if(S.viewAs && realAdmin()) return (S.viewAsViews||ALL_VIEWS.map(([k])=>k)).includes(v);
  const av=S.profile&&S.profile.allowed_views;
  return Array.isArray(av) && av.length ? av.includes(v) : true; // לא סומן כלום = רואים הכל
}
function viewAsBanner(){
  if(!S.viewAs) return '';

}

/* ===== שבוע עבודה: ראשון–חמישי. שישי רק כשמנהל העבודה סימן זאת בהזמנה (הערה 3) ===== */
const FRIDAY = 5, SATURDAY = 6;
function dowOf(dateStr){ const d=new Date(dateStr+'T00:00:00'); return d.getDay(); }
function isWorkDay(dateStr, fridayOk){
  const d = dowOf(dateStr);
  if(d === SATURDAY) return false;
  if(d === FRIDAY) return !!fridayOk;
  return true;
}
// תאריכי העבודה בפועל של הזמנה: מדלגים על שבת, ועל שישי אם לא אושר.
// מחזיר מערך תאריכים באורך days_count.
function workDates(o){
  const start = o.scheduled_date;
  if(!start) return [];
  const days = Math.max(1, o.days_count||1);
  const out=[];
  let cur = start, guard = 0;
  // אם התאריך שנקבע עצמו אינו יום עבודה — מציגים אותו בכל זאת, כדי שלא ייעלם מהלוח
  if(!isWorkDay(cur, o.friday_ok)) return [cur].concat(workDatesFrom(addDays(cur,1), days-1, o.friday_ok));
  while(out.length < days && guard++ < 60){
    if(isWorkDay(cur, o.friday_ok)) out.push(cur);
    cur = addDays(cur,1);
  }
  return out;
}
function workDatesFrom(from, count, fridayOk){
  const out=[]; let cur=from, guard=0;
  while(out.length < count && guard++ < 60){
    if(isWorkDay(cur, fridayOk)) out.push(cur);
    cur = addDays(cur,1);
  }
  return out;
}
// באיזה יום מתוך כמה נמצא התאריך הזה (1-based); 0 אם לא שייך
function dayIndexOf(o, dateStr){
  const ds = workDates(o);
  const i = ds.indexOf(dateStr);
  return i < 0 ? 0 : i+1;
}

/* ===== טווח שעות מותאם אישית (הערה 3) ===== */
// הערך נשמר באותה עמודה time_slot, בפורמט HH:MM-HH:MM.
const CUSTOM_SLOT_RE = /^\d{1,2}:\d{2}-\d{1,2}:\d{2}$/;
function isCustomSlot(v){ return !!v && !TIME_SLOTS.includes(v) && CUSTOM_SLOT_RE.test(v); }
// רשימת האפשרויות לבחירה — כולל הערך הנוכחי גם אם הוא מותאם אישית,
// אחרת עריכה מהירה בטבלה הייתה מוחקת אותו בשקט.
function slotOptions(val){
  return isCustomSlot(val) ? TIME_SLOTS.concat([val]) : TIME_SLOTS;
}
// שדה טווח השעות בכרטיס — רשימה מוכנה + אפשרות "מותאם אישית".
// הערך תמיד נשמר בעמודה time_slot; מותאם אישית נשמר כ-HH:MM-HH:MM.
function slotFieldHTML(cur){
  cur = cur || '';
  const custom = isCustomSlot(cur);
  const [cf,ct] = custom ? cur.split('-') : ['',''];
  const pad = v => { const m=String(v||'').match(/^(\d{1,2}):(\d{2})$/); return m ? String(m[1]).padStart(2,'0')+':'+m[2] : ''; };
  return `<div><label>טווח שעות</label><select id="slotPick">
      <option value="">—</option>
      ${TIME_SLOTS.map(s=>`<option value="${esc(s)}" ${cur===s?'selected':''}>${s}</option>`).join('')}
      <option value="__custom" ${custom?'selected':''}>מותאם אישית…</option>
    </select></div>
    <div id="slotCustomWrap" style="${custom?'':'display:none'}"><label>שעות מותאמות אישית</label>
      <div class="slot-custom"><input type="time" id="slotFrom" value="${esc(pad(cf))}"><span>—</span><input type="time" id="slotTo" value="${esc(pad(ct))}"></div>
    </div>
    <input type="hidden" name="time_slot" id="slotVal" value="${esc(cur)}">`;
}
// חיווט השדה. מחזיר פונקציה שבודקת לפני שמירה שהטווח המותאם הושלם.
function bindSlotField(){
  const pick=$('#slotPick'), wrap=$('#slotCustomWrap'), from=$('#slotFrom'), to=$('#slotTo'), val=$('#slotVal');
  if(!pick) return ()=>true;
  const sync=()=>{
    if(pick.value==='__custom'){
      wrap.style.display='';
      val.value = (from.value && to.value) ? `${from.value}-${to.value}` : '';
    } else {
      wrap.style.display='none';
      val.value = pick.value;
    }
  };
  pick.addEventListener('change',sync);
  from.addEventListener('change',sync);
  to.addEventListener('change',sync);
  return ()=>{
    if(pick.value==='__custom' && !val.value){
      toast('יש למלא שעת התחלה ושעת סיום, או לבחור טווח מהרשימה');
      return false;
    }
    return true;
  };
}

            if(event==='PASSWORD_RECOVERY'){ S.mode='auth'; S.authStage='newpass'; try{ updateHeader(); render(); }catch(_e){} }
          });
        }
        // האם מערכת המשתמשים הופעלה? (טבלת profiles קיימת)
        const probe = await S.sb.from('profiles').select('id').limit(0);
        const authEnabled = !(probe.error && probe.error.code==='42P01');
        if(authEnabled){
          const {data:{session}} = await S.sb.auth.getSession();
          if(!session){ S.mode='auth'; return; }
          S.user=session.user;
          const {data:prof,error:pe}=await S.sb.from('profiles').select('*').eq('id',S.user.id).single();
          if(pe||!prof){ S.mode='auth'; S.authError='המשתמש קיים אך אין לו פרופיל — פנה למנהל המערכת'; await S.sb.auth.signOut(); return; }
          if(prof.role==='pending'){ S.mode='auth'; S.authError='החשבון ממתין לאישור מנהל המערכת. פנה לרומן כדי לקבל הרשאה.'; await S.sb.auth.signOut(); return; }
          S.profile=prof;
        }
        await this.loadAll();
        if(isAdmin() && S.user){
          try{ const pr=await S.sb.from('profiles').select('*').order('created_at'); S.profiles=pr.data||[]; }catch(_e){}
        }
        S.mode='live';
        return;
      }catch(e){ console.error('Supabase init failed', e); }
    }
    // באתר האינטרנט אין נפילה למצב דמו — כשל חיבור מציג מסך שגיאה מאובטח
    if(location.protocol!=='file:'){
      S.mode='auth'; S.authStage='login';
      S.authError='החיבור לשרת לא הצליח. בדקו את החיבור לאינטרנט ורעננו את הדף.';
      return;
    }
    // מצב דמו — רק בקובץ המקומי
    S.orders = DEMO.orders.map(o=>({...o}));
    S.calls = DEMO.calls.map(c=>({...c}));
    S.teams = DEFAULT_TEAMS.map(t=>({...t}));
    S.cities = DEMO.cities;
    S.mode='demo';
  },
  async login(email,password){
    const {error}=await S.sb.auth.signInWithPassword({email,password});
    if(error) throw error;
    await this.init();
  },
  async logout(){
    await S.sb.auth.signOut();
    S.user=null; S.profile=null; S.mode='auth';
  },
  audit(action,entity,entity_id,label){
    if(S.mode!=='live'||!S.user) return;
    try{ S.sb.from('audit_log').insert({user_email:S.user.email,action,entity,entity_id:String(entity_id||''),label:String(label||'').slice(0,120)}).then(()=>{}); }catch(_e){}
  },
  async loadAll(){
    const [o,c,t,st,ci] = await Promise.all([
      S.sb.from('orders').select('*').order('order_number',{ascending:false}),
      S.sb.from('service_calls').select('*').order('call_number',{ascending:false}),
      S.sb.from('teams').select('*').order('sort_order'),
      S.sb.from('settings').select('*'),
      S.sb.from('cities').select('*'),
    ]);
    for(const r of [o,c,t,st,ci]) if(r.error) throw r.error;
    S.orders=o.data; S.calls=c.data; S.teams=t.data;
    S.settings={...DEFAULT_SETTINGS}; st.data.forEach(r=>S.settings[r.key]=r.value);
    S.cities={}; ci.data.forEach(r=>S.cities[r.city]=r.region);
    try{ const sl=await S.sb.from('sync_log').select('*').order('ran_at',{ascending:false}).limit(5); S.syncLog=sl.data||[]; }catch(_e){ S.syncLog=[]; }
    // אנשי צוות ושיבוצים (הערה 2) — השיבוץ הוא לכל הזמנה בנפרד
    try{ const tm=await S.sb.from('team_members').select('*').order('sort_order'); S.members=tm.data||[]; }catch(_e){ S.members=[]; }
    try{ const as=await S.sb.from('order_assignments').select('*'); S.assigns=as.data||[]; }catch(_e){ S.assigns=[]; }
    // פרוטוקולים לחתימה (בלי המסמכים הכבדים — רק נתוני מצב)
    try{ const pr=await S.sb.from('protocols').select('id,order_id,call_id,token,status,sent_at,signed_at,signer_name,order_number,customer_name,phone,doc_type,covered_orders').order('sent_at',{ascending:false}); S.protocols=pr.data||[]; }catch(_e){ S.protocols=[]; }
  },
  // יצירת פרוטוקול חדש לחתימה — מחזירה את האסימון לקישור האישי
  async sendProtocol(o){
    if(S.mode!=='live') throw new Error('שליחת פרוטוקול לחתימה זמינה רק בחיבור אמיתי לענן');
    const token=shortToken(); // קישור קצר ונקי לוואטסאפ
    const rec={order_id:o.id,token,order_number:o.order_number,customer_name:o.customer_name,phone:o.phone||null,doc_type:'פרוטוקול הכנה להתקנה',sent_by:S.user?S.user.email:''};
    const {data,error}=await S.sb.from('protocols').insert(rec).select('id,order_id,call_id,token,status,sent_at,signed_at,signer_name,order_number,customer_name,phone,doc_type,covered_orders').single();
    if(error) throw error;
    S.protocols.unshift(data);
    this.audit('שליחת פרוטוקול לחתימה','הזמנה',o.order_number,o.customer_name);
    return token;
  },
  // העלאת תמונת שטח: הקטנה במכשיר (עד 1600px, JPEG) ← העלאה לאחסון ← קישור ציבורי
  async uploadPhoto(callId, file){
    if(S.mode!=='live') throw new Error('העלאת תמונות זמינה רק בחיבור אמיתי לענן');
    const img=await createImageBitmap(file);
    const scale=Math.min(1, 1600/Math.max(img.width,img.height));
    const cv=document.createElement('canvas'); cv.width=Math.round(img.width*scale); cv.height=Math.round(img.height*scale);
    cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
    const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',0.8));
    const path=`${callId}/${Date.now()}_${Math.random().toString(36).slice(2,6)}.jpg`;
    const {error}=await S.sb.storage.from('tmunot-sherut').upload(path, blob, {contentType:'image/jpeg'});
    if(error) throw error;
    return S.sb.storage.from('tmunot-sherut').getPublicUrl(path).data.publicUrl;
  },
  // הוספת תמונות להזמנה עבור איש צוות — דרך פונקציה בשרת שנוגעת בשדה התמונות בלבד.
  // הרשאות ההזמנה נשארות סגורות: איש צוות לא יכול לעדכן אף שדה אחר.
  async memberAddOrderPhotos(orderId, urls){
    if(S.mode!=='live') throw new Error('העלאת תמונות זמינה רק בחיבור אמיתי לענן');
    const {data,error}=await S.sb.rpc('member_add_order_photos',{p_order:orderId, p_urls:urls});
    if(error) throw error;
    return Array.isArray(data)?data:[];
  },
  // יצירת דוח אישור תקינות ציוד לחתימה — להזמנה (סיום התקנה) או לקריאת שירות
  async sendReport(parent, kind){
    if(S.mode!=='live') throw new Error('דוח אישור תקינות זמין רק בחיבור אמיתי לענן');
    const token=shortToken(); // קישור קצר ונקי לוואטסאפ
    const ref = kind==='call' ? (parent.call_number||'') : (parent.order_number||'');
    const rec={ ...(kind==='call'?{call_id:parent.id}:{order_id:parent.id}),
      token, order_number:ref, customer_name:parent.customer_name, phone:parent.phone||null,
      doc_type:'דוח אישור תקינות ציוד', report_data:{photos:Array.isArray(parent.photos)?parent.photos:[]},
      sent_by:(S.profile&&S.profile.full_name)||(S.user&&S.user.email)||null};
    const {data,error}=await S.sb.from('protocols').insert(rec).select('id,order_id,call_id,token,status,sent_at,signed_at,signer_name,order_number,customer_name,phone,doc_type,covered_orders').single();
    if(error) throw error;
    S.protocols.unshift(data);
    this.audit('יצירת דוח אישור תקינות', kind==='call'?'קריאת שירות':'הזמנה', ref, parent.customer_name);
    return token;
  },
  async saveOrder(o){
    if(S.mode==='live'){
      const rec={...o}; delete rec._new; delete rec._orig;
      if(o._new){ delete rec.id; const {data,error}=await S.sb.from('orders').insert(rec).select().single(); if(error)throw error; S.orders.unshift(data); }
      else { const {error}=await S.sb.from('orders').update(rec).eq('id',o.id); if(error)throw error; Object.assign(S.orders.find(x=>x.id===o.id)||{},rec); }
    } else {
      if(o._new){ o.id=uid(); delete o._new; delete o._orig; S.orders.unshift(o); }
      else Object.assign(S.orders.find(x=>x.id===o.id)||{},o);
    }
    this.audit('שמירה','הזמנה',o.order_number,o.customer_name);
  },
  // עדכון חלקי — כותב רק את השדות שהשתנו, כדי לא לדרוס עדכונים מקבילים (סנכרון/תמונות)
  // בורד המק"טים (הערה 8) — נטען רק כשנכנסים ללשונית
  async loadSkus(){
    S.skusError=null;
    if(S.mode!=='live'){ S.skus=[]; S.skuLog=[]; return S.skus; }
    const {data,error}=await S.sb.from('inv_items')
      .select('partname,partdes,price,image_url,image_full').order('partname');
    if(error) throw error;
    S.skus=data||[];
    try{
      const {data:lg}=await S.sb.from('sku_image_sync_log').select('*').order('run_at',{ascending:false}).limit(3);
      S.skuLog=lg||[];
    }catch(_e){ S.skuLog=[]; }
    return S.skus;
  },
  // פירוט ההזמנה מפריוריטי — מק"ט, תיאור, כמות (הערה 7).
  // נטען רק כשפותחים את כרטיס ההזמנה, ונשמר בזיכרון כדי לא למשוך פעמיים.
  async orderItems(orderNumber){
    if(!orderNumber) return [];
    S._items = S._items || {};
    if(S._items[orderNumber]) return S._items[orderNumber];
    if(S.mode!=='live'){ return (S._items[orderNumber]=[]); }
    const {data,error}=await S.sb.from('order_items')
      .select('kline,partname,partdes,qty').eq('order_number',orderNumber).order('kline');
    if(error) throw error;
    const rows=data||[];
    // הצלבה מול בורד המק"טים — השמות אמורים להיות זהים.
    // אם בכל זאת יש הפרש, פריוריטי מנצח ומוצג, וההפרש מסומן לידיעה בלבד.
    try{
      const names=[...new Set(rows.map(r=>r.partname).filter(Boolean))];
      if(names.length){
        const {data:inv}=await S.sb.from('inv_items').select('partname,partdes').in('partname',names);
        const byName={}; (inv||[]).forEach(x=>byName[String(x.partname).trim().toUpperCase()]=x);
        rows.forEach(r=>{
          const hit=byName[String(r.partname||'').trim().toUpperCase()];
          r._inBoard = !!hit;
          r._boardDes = hit ? hit.partdes : null;
        });
      }
    }catch(_e){ /* ההצלבה היא תוספת בלבד — לא מפילה את הטבלה */ }
    return (S._items[orderNumber]=rows);
  },
  async patchOrder(id, fields){
    if(!fields || !Object.keys(fields).length) return;
    // בלם נוסף: אין דרך להגיע לעדכון הזמנה ללא הרשאת עריכה, גם לא בטעות בקוד
    if(!canDo('orders')) throw new Error('אין לך הרשאה לעדכן את ההזמנה');
    if(S.mode==='live'){ const {error}=await S.sb.from('orders').update(fields).eq('id',id); if(error)throw error; }
    Object.assign(S.orders.find(x=>x.id===id)||{}, fields);
    const o=S.orders.find(x=>x.id===id)||{};
    this.audit('שמירה','הזמנה',o.order_number,o.customer_name);
  },
  async patchCall(id, fields){
    if(!fields || !Object.keys(fields).length) return;
    if(!canDo('calls')) throw new Error('אין לך הרשאה לעדכן את קריאת השירות');
    if(S.mode==='live'){ const {error}=await S.sb.from('service_calls').update(fields).eq('id',id); if(error)throw error; }
    Object.assign(S.calls.find(x=>x.id===id)||{}, fields);
    const c=S.calls.find(x=>x.id===id)||{};
    this.audit('שמירה','קריאת שירות',c.call_number,c.customer_name);
  },
  async deleteOrder(id){
    const o=S.orders.find(x=>x.id===id);
    if(S.mode==='live'){ const {error}=await S.sb.from('orders').delete().eq('id',id); if(error)throw error; }
    S.orders=S.orders.filter(x=>x.id!==id);
    this.audit('מחיקה','הזמנה',o&&o.order_number,o&&o.customer_name);
  },
  async saveCall(c){
    if(S.mode==='live'){
      const rec={...c}; delete rec._new;
      if(c._new){ delete rec.id; const {data,error}=await S.sb.from('service_calls').insert(rec).select().single(); if(error)throw error; S.calls.unshift(data); }
      else { const {error}=await S.sb.from('service_calls').update(rec).eq('id',c.id); if(error)throw error; Object.assign(S.calls.find(x=>x.id===c.id)||{},rec); }
    } else {
      if(c._new){ c.id=uid(); delete c._new; S.calls.unshift(c); }
      else Object.assign(S.calls.find(x=>x.id===c.id)||{},c);
    }
    this.audit('שמירה','קריאת שירות',c.call_number,c.customer_name);

  async deleteCall(id){

  async saveTeam(t){

      const rec={name:t.name,color:t.color,active:t.active,sort_order:t.sort_order};
      if(t._new){ const {data,error}=await S.sb.from('teams').insert(rec).select().single(); if(error)throw error; S.teams.push(data); }
      else { const {error}=await S.sb.from('teams').update(rec).eq('id',t.id); if(error)throw error; }
    } else if(t._new){ t.id=uid(); delete t._new; S.teams.push(t); }

  async deleteTeam(id){
    if(S.mode==='live'){ const {error}=await S.sb.from('teams').delete().eq('id',id); if(error)throw error; }

  /* ===== אנשי צוות ושיבוצים (הערה 2) ===== */
  async saveMember(mm){
    const rec={full_name:mm.full_name,phone:mm.phone||null,team_id:mm.team_id||null,
      member_role:mm.member_role||'מתקין',active:!!mm.active,
      profile_id:mm.profile_id||null,sort_order:mm.sort_order||0};
    if(S.mode==='live'){
      if(mm._new){ const {data,error}=await S.sb.from('team_members').insert(rec).select().single(); if(error)throw error; S.members.push(data); }
      else { const {error}=await S.sb.from('team_members').update(rec).eq('id',mm.id); if(error)throw error; Object.assign(S.members.find(x=>x.id===mm.id)||{},rec); }
    } else if(mm._new){ mm.id=uid(); delete mm._new; S.members.push(mm); }
    this.audit('שמירה','איש צוות',mm.full_name,'');
  },
  async deleteMember(id){
    const mm=S.members.find(x=>x.id===id);
    if(S.mode==='live'){ const {error}=await S.sb.from('team_members').delete().eq('id',id); if(error)throw error; }
    S.members=S.members.filter(x=>x.id!==id);
    S.assigns=S.assigns.filter(a=>a.member_id!==id);
    this.audit('מחיקה','איש צוות',mm&&mm.full_name,'');
  },
  // שיבוץ להזמנה אחת בלבד — כל הזמנה משובצת בנפרד (הערה 2)
  async saveAssignments(orderId,memberIds){
    const want=[...new Set(memberIds.filter(Boolean).map(String))];
    const have=S.assigns.filter(a=>String(a.order_id)===String(orderId)).map(a=>String(a.member_id));
    const add=want.filter(x=>!have.includes(x));
    const del=have.filter(x=>!want.includes(x));
    if(S.mode==='live'){
      if(del.length){ const {error}=await S.sb.from('order_assignments').delete().eq('order_id',orderId).in('member_id',del); if(error)throw error; }
      if(add.length){ const {error}=await S.sb.from('order_assignments').insert(add.map(m=>({order_id:orderId,member_id:m}))); if(error)throw error; }
    }
    S.assigns=S.assigns.filter(a=>String(a.order_id)!==String(orderId))
      .concat(want.map(m=>({order_id:orderId,member_id:m})));
  },
  async saveSetting(key,value){
    S.settings[key]=value;
    if(S.mode==='live'){ const {error}=await S.sb.from('settings').upsert({key,value}); if(error)throw error; }
    this.audit('שמירה','הגדרות',key,'');
  },
  // קריאה מאובטחת לפונקציית ניהול המשתמשים (אדמין בלבד — נאכף גם בצד השרת)
  async adminUsers(payload){
    if(S.mode!=='live') throw new Error('זמין רק בחיבור אמיתי לענן');
    const {data:{session}}=await S.sb.auth.getSession();
    if(!session) throw new Error('נדרשת התחברות');
    const r=await fetch(`${SUPABASE_URL}/functions/v1/orders-admin-users`,{method:'POST',
      headers:{'content-type':'application/json','authorization':'Bearer '+session.access_token,'apikey':SUPABASE_ANON_KEY},
      body:JSON.stringify(payload)});
    const d=await r.json().catch(()=>({}));
    if(!r.ok||d.error) throw new Error(d.error||('שגיאה '+r.status));
    return d;
  },
  async saveProfile(p){
    if(S.mode!=='live') return;
    const {error}=await S.sb.from('profiles').update({full_name:p.full_name,phone:p.phone,role:p.role,allowed_views:p.allowed_views,perms:p.perms||null}).eq('id',p.id);
    if(error) throw error;
    this.audit('עדכון הרשאות','משתמש',p.email,ROLE_LABELS[p.role]||p.role);
  },
  async saveMyProfile(fields){
    if(S.mode!=='live'||!S.user) return;
    const {error}=await S.sb.from('profiles').update(fields).eq('id',S.user.id);
    if(error) throw error;
    Object.assign(S.profile,fields);
    this.audit('עדכון פרופיל','משתמש',S.user.email,fields.full_name||'');
  },
};

function orderChips(){
  const act=S.orders.filter(ACTIVE_ORDER), t=todayStr(), week=addDays(t,7);

    {key:'active',label:'פעילות',n:act.length},
    {key:'nocontact',label:'טרם נוצר קשר',n:act.filter(o=>o.contact_status==='טרם נוצר קשר').length},
    {key:'nosched',label:'ממתין לשיבוץ',n:act.filter(o=>!o.team||!o.scheduled_date).length},
    {key:'protocol',label:'פרוטוקול',n:act.filter(o=>['נוצר קשר ראשוני לפרוטוקול','פרוטוקול חתום ממתין לתיאום'].includes(o.contact_status)).length},
    {key:'week',label:'השבוע הקרוב',n:act.filter(o=>o.scheduled_date&&o.scheduled_date>=t&&o.scheduled_date<week).length},
    {key:'done',label:'הושלמו',n:S.orders.filter(o=>o.order_status==='הושלם').length},
    {key:'all',label:'הכל',n:S.orders.length},
  ];
}
function filteredOrders(){
  const f=S.filters, t=todayStr(), week=addDays(t,7);
  let list=S.orders.slice();
  if(f.chip==='active') list=list.filter(ACTIVE_ORDER);
  else if(f.chip==='nocontact') list=list.filter(o=>ACTIVE_ORDER(o)&&o.contact_status==='טרם נוצר קשר');
  else if(f.chip==='nosched') list=list.filter(o=>ACTIVE_ORDER(o)&&(!o.team||!o.scheduled_date));
  else if(f.chip==='protocol') list=list.filter(o=>ACTIVE_ORDER(o)&&['נוצר קשר ראשוני לפרוטוקול','פרוטוקול חתום ממתין לתיאום'].includes(o.contact_status));
  else if(f.chip==='week') list=list.filter(o=>ACTIVE_ORDER(o)&&o.scheduled_date&&o.scheduled_date>=t&&o.scheduled_date<week);
  else if(f.chip==='done') list=list.filter(o=>o.order_status==='הושלם');
  if(f.team) list=list.filter(o=> f.team==='__none__' ? !o.team : o.team===f.team);
  if(f.region) list=list.filter(o=>o.region===f.region);
  if(f.status) list=list.filter(o=>o.order_status===f.status);
  if(f.contact) list=list.filter(o=>o.contact_status===f.contact);
  if(f.q){ const q=f.q.toLowerCase(); list=list.filter(o=>[o.order_number,o.customer_name,o.phone,o.city,o.contact_name].some(v=>v&&String(v).toLowerCase().includes(q))); }
  // סינון לפי טווח תאריכים (תאריך מתואם)
  if(f.dateFrom) list=list.filter(o=>o.scheduled_date && o.scheduled_date>=f.dateFrom);
  if(f.dateTo) list=list.filter(o=>o.scheduled_date && o.scheduled_date<=f.dateTo);
  // מיון — ברירת מחדל: מס' הזמנה (החדשה ראשונה); ערכים ריקים תמיד בסוף
  const cmpStr=(a,b,k,dir)=>{ const va=a[k]||'', vb=b[k]||''; if(!va&&!vb) return 0; if(!va) return 1; if(!vb) return -1; return dir*String(va).localeCompare(String(vb)); };
  switch(f.sort){
    case 'order_date':    list.sort((a,b)=>cmpStr(a,b,'order_date',-1)); break;
    case 'scheduled':     list.sort((a,b)=>cmpStr(a,b,'scheduled_date',1)); break;
    case 'supply_end':    list.sort((a,b)=>cmpStr(a,b,'supply_end_date',1)); break;
    case 'customer':      list.sort((a,b)=>cmpStr(a,b,'customer_name',1)); break;
    case 'city':          list.sort((a,b)=>cmpStr(a,b,'city',1)); break;
    case 'status':        list.sort((a,b)=>ORDER_STATUSES.indexOf(a.order_status)-ORDER_STATUSES.indexOf(b.order_status)); break;
    default:              list.sort((a,b)=>String(b.order_number||'').localeCompare(String(a.order_number||'')));
  }
  return list;
}

/* ================= לוח שנה ================= */
function eventsOn(dateStr){
  const evs=[];
  for(const o of S.orders){
    if(!o.scheduled_date||!ACTIVE_ORDER(o)&&o.order_status!=='הושלם') continue;
    // ימי העבודה בפועל — בלי שבת, ובלי שישי אלא אם סומן בהזמנה (הערה 3)
    if(dateStr < o.scheduled_date) continue;
    const idx = dayIndexOf(o, dateStr);
    if(idx) evs.push({kind:'order',o,dayIdx:idx,dayTotal:Math.max(1,o.days_count||1)});
  }
  for(const c of S.calls){
    if(c.scheduled_date===dateStr) evs.push({kind:'svc',o:c});
  }
  return evs.sort((a,b)=>String(a.o.time_slot||'').localeCompare(String(b.o.time_slot||'')));
}

// סנכרון תמונות ידני. קודם מנסים מהשרת; אם האתר חוסם פניות משרת
// (הגנת קלאודפלייר), מושכים את המוצרים מהדפדפן של המשתמש ושולחים מפה מוכנה.
async function syncSkuImages(){
  if(S.mode!=='live'){ toast('סנכרון תמונות זמין רק בחיבור אמיתי לענן'); return; }
  const b=$('#btnSkuSync'); if(!b) return;
  const old=b.textContent; b.disabled=true; b.textContent='⏳ מסנכרן…';
  try{
    let {data,error}=await S.sb.functions.invoke('sku-images-sync');
    // functions.invoke מחזיר שגיאה גם כשהפונקציה החזירה 500 עם גוף תקין
    if(error && !data){ try{ data=await error.context.json(); }catch(_e){} }
    if(data && data.blocked){
      b.textContent='⏳ מושך מהאתר…';
      const map=await fetchSkuImagesFromBrowser(msg=>{ b.textContent='⏳ '+msg; });
      if(!Object.keys(map).length) throw new Error('לא נמצאו תמונות באתר');
      const r2=await S.sb.functions.invoke('sku-images-sync',{body:{map}});
      if(r2.error && !r2.data) throw r2.error;
      data=r2.data;
    }
    if(!data || data.ok===false) throw new Error((data&&data.error)||'שגיאה בסנכרון התמונות');
    S.skus=null; await api.loadSkus();
    toast(`סונכרנו תמונות ✓ הותאמו ${data.matched} מק״טים · עודכנו ${data.images_set}${data.cleared?` · נוקו ${data.cleared}`:''}`);
    render();
  }catch(err){ console.error(err); toast('שגיאת סנכרון תמונות: '+(err.message||err)); }
  const bb=$('#btnSkuSync'); if(bb){ bb.disabled=false; bb.textContent=old; }
}
// משיכת המוצרים מהאתר דרך הדפדפן של המשתמש — עוקף את חסימת הענן
async function fetchSkuImagesFromBrowser(onProgress){
  const STORE='https://ironfitness.co.il/wp-json/wc/store/v1/products';
  const map={};
  for(let page=1;page<=60;page++){
    if(onProgress) onProgress(`עמוד ${page} · ${Object.keys(map).length} תמונות`);
    let arr=null;
    for(let attempt=0;attempt<3 && arr===null;attempt++){
      try{
        const r=await fetch(`${STORE}?per_page=100&page=${page}`,{headers:{'Accept':'application/json'}});
        if(!r.ok){ if(r.status===400) return map; continue; }
        arr=await r.json();
      }catch(_e){ await new Promise(res=>setTimeout(res,800*(attempt+1))); }
    }
    if(!Array.isArray(arr)||!arr.length) break;
    for(const p of arr){
      const sku=String(p&&p.sku||'').trim().toUpperCase();
      if(!sku||map[sku]) continue;
      const img=Array.isArray(p.images)?p.images[0]:null;
      if(!img) continue;
      const thumb=img.thumbnail||img.src;
      if(!thumb) continue;
      map[sku]={thumb:String(thumb), full:String(img.src||thumb)};
    }
    if(arr.length<100) break;
  }
  return map;
}

/* ===== שיבוץ אנשי צוות להזמנה (הערה 2) =====
   השיבוץ נעשה לכל הזמנה בנפרד, ורק מתוך הצוות שנבחר בהזמנה —
   כך עבודה אחת לעולם לא תשלב אנשים משני צוותים שונים. */
function teamByName(name){ return S.teams.find(t=>t.name===name)||null; }
function membersOfTeam(teamName){
  const t=teamByName(teamName);
  if(!t) return [];
  return (S.members||[]).filter(mm=>String(mm.team_id)===String(t.id)&&mm.active)
    .sort((a,b)=>(a.sort_order||0)-(b.sort_order||0)||String(a.full_name).localeCompare(String(b.full_name),'he'));
}
function assignedIds(orderId){
  return (S.assigns||[]).filter(a=>String(a.order_id)===String(orderId)).map(a=>String(a.member_id));
}
function assignedNames(orderId){
  const ids=assignedIds(orderId);
  if(!ids.length) return [];
  return ids.map(id=>(S.members||[]).find(mm=>String(mm.id)===id)).filter(Boolean).map(mm=>mm.full_name);
}
function assignBoxHTML(orderId,teamName){
  const list=membersOfTeam(teamName);
  const cur=assignedIds(orderId);
  if(!teamName) return `<div class="assign-hint">יש לבחור צוות כדי לשבץ אנשי צוות להזמנה זו.</div>`;
  if(!list.length) return `<div class="assign-hint">אין אנשי צוות פעילים ב"${esc(teamName)}". אפשר להוסיף אותם בהגדרות ← אנשי צוות.</div>`;
  // מי ששובץ בעבר מצוות אחר — מוצג כדי שלא ייעלם בשקט, ויוסר בשמירה
  const stray=cur.filter(id=>!list.some(mm=>String(mm.id)===id))
    .map(id=>(S.members||[]).find(mm=>String(mm.id)===id)).filter(Boolean);
  return `<div class="assign-list">
    ${list.map(mm=>`<label class="assign-chk"><input type="checkbox" data-mem="${mm.id}" ${cur.includes(String(mm.id))?'checked':''}>
      <span>${esc(mm.full_name)}</span><span class="assign-role">${esc(mm.member_role||'')}</span></label>`).join('')}
  </div>
  ${stray.length?`<div class="assign-hint warn">⚠️ ${stray.map(mm=>esc(mm.full_name)).join(', ')} שובצו מצוות אחר — השמירה תסיר אותם, כי עבודה אחת שייכת לצוות אחד בלבד.</div>`:''}`;
}
