<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>הצעת מחיר — איירון פיטנס</title>
<meta property="og:title" content="הצעת מחיר">
<meta property="og:type" content="website">
<meta property="og:image" content="https://app.ironfitness.co.il/assets/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b2a45">
<link rel="icon" href="https://app.ironfitness.co.il/assets/icon-192.png">
<!--
  q.html v2 — עמוד הקישור הקצר להצעת מחיר (14/10/2026). נפרס מ-core.app_files.quote_view_html (gh-deploy v23).
  רומן: "הסמל הקטן לא נראה טוב, תעצב משהו יותר יפה … תוריד את הכפתור" + "את הקישור … עם הלוגו במקום הסמל".
  ⇒ לוגו מלא על כחול, מספר ההצעה, ספינר; ההצעה נפתחת לבד (location.replace — "חזרה" לא נתקעת בדף הזה).
  🟢 "לא נפתח? לחצו כאן" מופיע רק אחרי 4 שניות, כשההפניה לא קרתה (רשת איטית/חסימה) — בדרך כלל אינו נראה.
  ℹ️ הקוד נקרא מ-#hash (הקישור של 7.1.0), מ-?c= או מסוף הנתיב — כך אותו דף משרת גם את q.ironfitness.co.il.
  ⚠️ og:title כאן קבוע: Pages מגיש קובץ סטטי ו-WhatsApp אינו מריץ JS. כותרת עם מספר ההצעה — ב-q-link (Cloudflare).
-->
<style>
  :root{ --navy:#0b2a45; --navy2:#123a5c; --line:rgba(255,255,255,.14); --soft:rgba(255,255,255,.72); }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; }
  body{ background:var(--navy); background-image:radial-gradient(1200px 600px at 50% 0%, var(--navy2), var(--navy) 70%); color:#fff;
        font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif; -webkit-font-smoothing:antialiased; }
  .wrap{ min-height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:32px 16px; gap:28px; text-align:center; }
  .logo{ width:min(240px, 60vw); height:auto; opacity:.96; }
  .rule{ width:56px; height:2px; background:var(--line); border-radius:2px; }
  h1{ margin:0; font-size:22px; font-weight:600; letter-spacing:.2px; }
  .pq{ margin-top:6px; font-size:15px; color:var(--soft); direction:ltr; min-height:20px; letter-spacing:.6px; }
  .status{ display:flex; align-items:center; gap:10px; font-size:14px; color:var(--soft); min-height:20px; }
  .spin{ width:16px; height:16px; border-radius:50%; border:2px solid rgba(255,255,255,.25); border-top-color:#fff; animation:r .8s linear infinite; }
  @keyframes r{ to{ transform:rotate(360deg); } }
  .fb{ font-size:13px; color:var(--soft); }
  .fb a{ color:#fff; }
  .hidden{ display:none; }
  .err .spin{ display:none; }
</style>
</head>
<body>
<div class="wrap">
  <img class="logo" src="https://app.ironfitness.co.il/assets/logo-white.png" alt="IRON FITNESS">
  <div class="rule"></div>
  <div><h1>הצעת מחיר</h1><div class="pq" id="pq"></div></div>
  <div class="status" id="st"><span class="spin"></span><span id="msg">ההצעה נפתחת…</span></div>
  <div class="fb hidden" id="fb">לא נפתח? <a id="open" href="#" rel="noopener">לחצו כאן</a></div>
</div>
<script>
(function(){
  var API = 'https://hjibpfavkjqocjvffsbq.supabase.co/functions/v1/quote-view';
  var RX = /^[A-Za-z0-9]{8}$/;
  var h = String(location.hash || '').replace(/^#/, '');
  var qs = (location.search.match(/[?&]c=([A-Za-z0-9]{8})/) || [])[1] || '';
  var tail = String(location.pathname || '').split('/').pop() || '';
  var code = RX.test(h) ? h : (RX.test(qs) ? qs : (RX.test(tail) ? tail : ''));
  var st = document.getElementById('st'), msg = document.getElementById('msg');
  var fb = document.getElementById('fb'), btn = document.getElementById('open'), pq = document.getElementById('pq');
  function fail(t){ st.className = 'status err'; msg.textContent = t; }
  if(!code){ fail('הקישור אינו תקין. אפשר לבקש מנציג המכירות קישור חדש.'); return; }
  fetch(API + '?c=' + encodeURIComponent(code))
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(!d || !d.ok || !d.url){ fail((d && d.error ? d.error + '. ' : '') + 'אפשר לבקש מנציג המכירות קישור חדש.'); return; }
      if(d.pq){ pq.textContent = d.pq; document.title = 'הצעת מחיר ' + d.pq + ' — איירון פיטנס'; }
      btn.href = d.url;
      setTimeout(function(){ fb.classList.remove('hidden'); }, 4000);
      location.replace(d.url);
    })
    .catch(function(){ fail('לא ניתן לטעון את ההצעה כרגע. נסו שוב בעוד רגע.'); });
})();
</script>
</body>
</html>
