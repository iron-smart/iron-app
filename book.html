<style>
/* ═══ Design tokens ═══════════════════════════════════════════════════════ */
:root{
  /* צבע — מותג אחד, מצב "פנוי/הצלחה" אחד, שגיאה אחת */
  --brand:#0B2236; --brand-hover:#14324C; --brand-ink:#FFFFFF;
  --ink:#0E1A26; --ink-2:#3A4754; --ink-3:#5E6B78; --ink-4:#8A95A1;
  --bg:#F5F6F8; --surface:#FFFFFF; --surface-2:#F8F9FB; --hover:#F1F3F6;
  --line:#E3E7EC; --line-2:#CFD6DE;
  --ok:#1F7A55; --ok-bg:#E8F5EE; --ok-line:#BFE3CF;
  --warn:#8A5A00; --warn-bg:#FFF6E3; --warn-line:#F2DDA8;
  --err:#B42318; --err-bg:#FDF0EE; --err-line:#F4C7C1;
  --focus:#3B82F6;
  /* מרווחים — סולם 4 */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s8:32px; --s10:40px; --s12:48px;
  /* טיפוגרפיה */
  --t-xs:13px; --t-sm:14px; --t-md:16px; --t-lg:18px; --t-xl:22px; --t-2xl:28px;
  /* פינות, צללים, תנועה */
  --r-sm:8px; --r-md:10px; --r-lg:16px; --r-pill:999px;
  --sh-1:0 1px 2px rgba(14,26,38,.04), 0 1px 1px rgba(14,26,38,.03);
  --sh-2:0 12px 32px -12px rgba(14,26,38,.18), 0 2px 6px rgba(14,26,38,.04);
  --ease:cubic-bezier(.2,.7,.2,1); --dur:150ms;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
body{font-family:Heebo,system-ui,'Segoe UI',Arial,sans-serif;color:var(--ink);font-size:var(--t-md);line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
a{color:var(--brand);text-underline-offset:3px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ═══ Shell ═══════════════════════════════════════════════════════════════ */
.top{max-width:1040px;margin:0 auto;padding:var(--s5) var(--s6) 0;display:flex;align-items:center;justify-content:space-between;gap:var(--s4)}
.top .logo{display:block;height:22px;width:auto}
.top nav{display:flex;align-items:center;gap:var(--s5);font-size:var(--t-sm)}
.top nav a{text-decoration:none;color:var(--ink-3);display:inline-flex;align-items:center;gap:6px;min-height:40px}
.top nav a:hover{color:var(--ink)}
.top nav .tel{color:var(--ink);font-weight:600}
.wrap{max-width:1040px;margin:0 auto;padding:var(--s6)}
.card{display:grid;grid-template-columns:320px minmax(0,1fr);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-2);overflow:hidden;min-height:560px}
.foot{max-width:1040px;margin:0 auto;padding:0 var(--s6) var(--s10);font-size:var(--t-xs);color:var(--ink-4);display:flex;gap:var(--s3);flex-wrap:wrap}
.foot a{color:var(--ink-3)}

/* ═══ Summary (aside) ═════════════════════════════════════════════════════ */
.sum{background:var(--surface-2);border-inline-end:1px solid var(--line);padding:var(--s8) var(--s6);display:flex;flex-direction:column;gap:var(--s6)}
.sum .eyebrow{font-size:var(--t-xs);font-weight:600;color:var(--ink-3);letter-spacing:.02em}
.sum h1{margin:var(--s1) 0 0;font-size:var(--t-xl);line-height:1.25;font-weight:700;letter-spacing:-.01em}
.sum .lead{margin:var(--s2) 0 0;color:var(--ink-3);font-size:var(--t-sm)}
.facts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--s3)}
.facts li{display:flex;gap:var(--s3);align-items:flex-start;font-size:var(--t-sm);color:var(--ink-2)}
.facts li svg{flex:none;margin-top:2px;color:var(--ink-3)}
.facts li b{color:var(--ink);font-weight:600}
.facts li.pick b{color:var(--brand)}
.facts .chg{font-size:var(--t-xs);color:var(--ink-3);margin-inline-start:var(--s2);text-decoration:underline}
.facts .chg:hover{color:var(--ink)}
.assure{margin-top:auto;padding-top:var(--s5);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:var(--s2);font-size:var(--t-xs);color:var(--ink-3)}
.assure span{display:flex;gap:var(--s2);align-items:center}
.assure svg{color:var(--ok);flex:none}
/* מובייל: שורת סיכום אחת */
#sbar{display:none}

/* ═══ Main panel ══════════════════════════════════════════════════════════ */
.main{padding:var(--s8);display:flex;flex-direction:column;min-width:0}
.phead{display:flex;align-items:center;gap:var(--s3);margin-bottom:var(--s6)}
.back{width:36px;height:36px;border-radius:var(--r-pill);display:inline-flex;align-items:center;justify-content:center;color:var(--ink-2);border:1px solid var(--line);transition:background var(--dur) var(--ease),border-color var(--dur)}
.back:hover{background:var(--hover);border-color:var(--line-2)}
.phead .ttl{flex:1;min-width:0}
.phead h2{margin:0;font-size:var(--t-lg);font-weight:700;line-height:1.3}
.phead .stp{font-size:var(--t-xs);color:var(--ink-3);font-weight:500}
.prog{display:flex;gap:6px}
.prog i{width:22px;height:4px;border-radius:2px;background:var(--line)}
.prog i.on{background:var(--brand)}
.view{animation:in .18s var(--ease)}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ── Option cards (סוג פגישה) ── */
.opts{display:grid;gap:var(--s3)}
.opt{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:var(--s4);align-items:center;text-align:start;width:100%;padding:var(--s5);border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);transition:border-color var(--dur) var(--ease),background var(--dur),box-shadow var(--dur)}
.opt:hover{border-color:var(--line-2);background:var(--surface-2)}
.opt[aria-checked="true"]{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand) inset}
.opt .ic{width:44px;height:44px;border-radius:var(--r-md);background:var(--hover);display:flex;align-items:center;justify-content:center;color:var(--brand)}
.opt .t{font-weight:600;font-size:var(--t-md)}
.opt .d{color:var(--ink-3);font-size:var(--t-sm);margin-top:2px}
.opt .m{font-size:var(--t-xs);color:var(--ink-2);background:var(--hover);border-radius:var(--r-pill);padding:4px 10px;white-space:nowrap;font-weight:500}
.opt .go{color:var(--ink-4);transition:transform var(--dur) var(--ease),color var(--dur)}
.opt:hover .go{color:var(--ink);transform:translateX(-2px)}
.optfoot{margin-top:var(--s5);font-size:var(--t-sm);color:var(--ink-3)}

/* ── Day strip ── */
.lbl{font-size:var(--t-sm);font-weight:600;color:var(--ink-2);margin:0 0 var(--s3);display:flex;justify-content:space-between;align-items:baseline}
.lbl small{font-weight:400;color:var(--ink-4);font-size:var(--t-xs)}
.days{display:flex;gap:var(--s2);overflow-x:auto;padding:2px 2px var(--s2);margin:0 -2px;scrollbar-width:thin;scroll-snap-type:x proximity}
.day{flex:none;width:76px;padding:var(--s3) 0 10px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);display:flex;flex-direction:column;align-items:center;gap:2px;scroll-snap-align:start;transition:border-color var(--dur) var(--ease),background var(--dur)}
.day:hover{border-color:var(--line-2);background:var(--surface-2)}
.day .dw{font-size:var(--t-xs);color:var(--ink-3)}
.day .dn{font-size:var(--t-xl);font-weight:700;line-height:1.1}
.day .dm{font-size:11px;color:var(--ink-4)}
.day .dc{margin-top:4px;font-size:11px;font-weight:600;color:var(--ok)}
.day[aria-checked="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.day[aria-checked="true"] .dw,.day[aria-checked="true"] .dm,.day[aria-checked="true"] .dc{color:rgba(255,255,255,.78)}
/* ── Time grid ── */
.grp{margin-top:var(--s6)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:var(--s2)}
.slot{height:44px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);font-weight:600;font-size:var(--t-md);font-variant-numeric:tabular-nums;transition:border-color var(--dur) var(--ease),background var(--dur),color var(--dur)}
.slot:hover{border-color:var(--brand);color:var(--brand)}
.slot[aria-checked="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.tz{margin-top:var(--s5);font-size:var(--t-xs);color:var(--ink-4)}
/* ── Skeleton ── */
.sk{background:linear-gradient(90deg,var(--hover) 25%,#E9ECF0 37%,var(--hover) 63%);background-size:400% 100%;animation:sh 1.2s ease infinite;border-radius:var(--r-md)}
@keyframes sh{0%{background-position:100% 50%}100%{background-position:0 50%}}

/* ── Actions ── */
.actbar{margin-top:auto;padding-top:var(--s6);display:flex;gap:var(--s3);align-items:center;flex-wrap:wrap}
.btn{height:48px;padding:0 var(--s6);border-radius:var(--r-md);background:var(--brand);color:var(--brand-ink);font-weight:600;font-size:var(--t-md);display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);text-decoration:none;transition:background var(--dur) var(--ease),transform 80ms}
.btn:hover{background:var(--brand-hover)}
.btn:active{transform:scale(.985)}
.btn[disabled],.btn[aria-disabled="true"]{background:var(--line);color:var(--ink-4);cursor:not-allowed;transform:none}
.btn.full{width:100%}
.btn2{height:48px;padding:0 var(--s5);border-radius:var(--r-md);border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);text-decoration:none;transition:background var(--dur),border-color var(--dur)}
.btn2:hover{background:var(--hover)}
.btnq{height:40px;padding:0 var(--s3);border-radius:var(--r-sm);color:var(--ink-2);font-weight:500;font-size:var(--t-sm);display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btnq:hover{background:var(--hover);color:var(--ink)}
.btnd{height:48px;padding:0 var(--s5);border-radius:var(--r-md);color:var(--err);font-weight:600;display:inline-flex;align-items:center;gap:var(--s2)}
.btnd:hover{background:var(--err-bg)}
.btnd.solid{background:var(--err);color:#fff}
.btnd.solid:hover{background:#9A1D13}
.spin{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ── Form ── */
.chosen{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--s4);border-radius:var(--r-md);background:var(--surface-2);border:1px solid var(--line);margin-bottom:var(--s6);font-size:var(--t-sm)}
.chosen b{font-weight:600;display:block}
.chosen .cs{display:block;color:var(--ink-3);font-size:var(--t-xs);margin-top:1px}
.chosen .sp{flex:1}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:var(--s4) var(--s4)}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f label{font-size:var(--t-sm);font-weight:500;color:var(--ink-2)}
.f label .o{color:var(--ink-4);font-weight:400}
.f input,.f textarea{width:100%;border:1px solid var(--line-2);border-radius:var(--r-md);background:var(--surface);padding:0 var(--s3);height:46px;font-size:var(--t-md);transition:border-color var(--dur),box-shadow var(--dur)}
.f textarea{height:auto;min-height:88px;padding:10px var(--s3);resize:vertical}
.f input:hover,.f textarea:hover{border-color:#B9C2CC}
.f input:focus,.f textarea:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 3px rgba(11,34,54,.12)}
.f input[dir="ltr"]{text-align:right}
.f.bad input{border-color:var(--err);box-shadow:0 0 0 3px rgba(180,35,24,.10)}
.f .e{font-size:var(--t-xs);color:var(--err)}
.span2{grid-column:1/-1}
details.more{margin-top:var(--s5);border-top:1px solid var(--line);padding-top:var(--s4)}
details.more>summary{list-style:none;cursor:pointer;font-size:var(--t-sm);font-weight:500;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px;min-height:36px}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary svg{transition:transform var(--dur) var(--ease)}
details.more[open]>summary svg{transform:rotate(180deg)}
details.more .fields{margin-top:var(--s3)}
.chips{display:flex;flex-wrap:wrap;gap:var(--s2)}
.chip{height:36px;padding:0 var(--s4);border:1px solid var(--line-2);border-radius:var(--r-pill);font-size:var(--t-sm);background:var(--surface);transition:background var(--dur),border-color var(--dur)}
.chip:hover{background:var(--hover)}
.chip[aria-checked="true"]{border-color:var(--brand);background:var(--brand);color:var(--brand-ink)}
.consent{display:flex;gap:var(--s3);align-items:flex-start;margin-top:var(--s5);font-size:var(--t-sm);color:var(--ink-3);line-height:1.5}
.consent input{width:20px;height:20px;margin:1px 0 0;flex:none;accent-color:var(--brand)}
.consent.bad input{outline:2px solid var(--err);outline-offset:1px;border-radius:4px}
.ce{display:block;margin:6px 32px 0 0;font-size:var(--t-xs);color:var(--err)}
.hp{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;opacity:0;pointer-events:none}

/* ── Notices ── */
.note{display:flex;gap:var(--s3);align-items:flex-start;padding:var(--s3) var(--s4);border-radius:var(--r-md);font-size:var(--t-sm);margin-bottom:var(--s5);border:1px solid}
.note svg{flex:none;margin-top:2px}
.note.err{background:var(--err-bg);border-color:var(--err-line);color:var(--err)}
.note.warn{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn)}
.note.ok{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok)}
.note a{color:inherit;font-weight:600}
.state{margin:auto 0;text-align:center;padding:var(--s10) var(--s4);display:flex;flex-direction:column;align-items:center;gap:var(--s3)}
.state .ill{width:56px;height:56px;border-radius:50%;background:var(--hover);display:flex;align-items:center;justify-content:center;color:var(--ink-3)}
.state h3{margin:var(--s2) 0 0;font-size:var(--t-lg)}
.state p{margin:0;color:var(--ink-3);max-width:380px}
.state .row{display:flex;gap:var(--s3);margin-top:var(--s4);flex-wrap:wrap;justify-content:center}

/* ── Success / manage ── */
.done{display:flex;flex-direction:column;gap:var(--s6)}
.okc{width:52px;height:52px;border-radius:50%;background:var(--ok-bg);color:var(--ok);display:flex;align-items:center;justify-content:center;animation:pop .32s var(--ease)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.done h2{margin:0;font-size:var(--t-2xl);line-height:1.2;font-weight:700;letter-spacing:-.01em}
.done .sub{margin:var(--s2) 0 0;color:var(--ink-3)}
.when{display:grid;grid-template-columns:auto 1fr;gap:var(--s3) var(--s5);padding:var(--s5);border:1px solid var(--line);border-radius:var(--r-lg);font-size:var(--t-sm)}
.when dt{color:var(--ink-3)}
.when dd{margin:0;font-weight:600;color:var(--ink)}
.row{display:flex;gap:var(--s3);flex-wrap:wrap;align-items:center}
details.menu{position:relative}
details.menu>summary{list-style:none}
details.menu>summary::-webkit-details-marker{display:none}
details.menu .pop{position:absolute;inset-inline-start:0;top:calc(100% + 6px);z-index:5;min-width:220px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--sh-2);padding:6px;display:flex;flex-direction:column;animation:in .14s var(--ease)}
details.menu .pop a{padding:10px var(--s3);border-radius:var(--r-sm);text-decoration:none;color:var(--ink);font-size:var(--t-sm)}
details.menu .pop a:hover{background:var(--hover)}
.next{border-top:1px solid var(--line);padding-top:var(--s5);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s4);font-size:var(--t-sm)}
.next b{display:block;font-weight:600;margin-bottom:2px}
.next span{color:var(--ink-3)}
.pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:var(--r-pill);font-size:var(--t-xs);font-weight:600}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.mute{background:var(--hover);color:var(--ink-3)}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor}

/* ── Dialog ── */
dialog{border:0;padding:0;border-radius:var(--r-lg);box-shadow:var(--sh-2);max-width:420px;width:calc(100% - 32px);color:var(--ink)}
dialog::backdrop{background:rgba(14,26,38,.36)}
dialog .dbody{padding:var(--s6)}
dialog h3{margin:0 0 var(--s2);font-size:var(--t-lg)}
dialog p{margin:0;color:var(--ink-3);font-size:var(--t-sm)}
dialog .dact{display:flex;gap:var(--s3);justify-content:flex-start;padding:0 var(--s6) var(--s6)}

/* ═══ Responsive ══════════════════════════════════════════════════════════ */
@media (max-width:900px){
  .card{grid-template-columns:260px minmax(0,1fr)}
  .sum{padding:var(--s6) var(--s5)}
}
@media (max-width:760px){
  .top{padding:var(--s3) var(--s4) 0}
  .top .logo{height:18px}
  .top nav .back2,.top nav .tel span{display:none}
  .wrap{padding:var(--s3) 0 0}
  .card{grid-template-columns:1fr;grid-template-rows:auto 1fr;align-content:start;border-radius:var(--r-lg) var(--r-lg) 0 0;border-inline:0;border-bottom:0;min-height:calc(100vh - 60px);box-shadow:none}
  .sum{display:none}
  #sbar{display:block}
  .sumbar{display:flex;align-items:center;gap:var(--s3);padding:var(--s4);border-bottom:1px solid var(--line);background:var(--surface-2);font-size:var(--t-sm)}

  function icsHref(b, title) {

  /* ═══════════════ ציור ═══════════════ */

      }
      if (err === 'rate_limited') { S.msg = { k: 'err', html: 'היו יותר מדי ניסיונות. נסו שוב בעוד שעה, או התקשרו <a href="' + PHONE_TEL + '">' + PHONE + '</a>.' }; render(); return; }
      S.msg = { k: 'err', html: 'לא הצלחנו לקבוע אונליין כרגע. התקשרו ונקבע יחד: <a href="' + PHONE_TEL + '">' + PHONE + '</a>.' }; render(); toTop();
    });
  }
  function loadManage() {
    api({ action: 'manage', m: token }).then(function (j) {
      if (j._status === 404) S.mg = { notFound: true };
      else if (!j.ok || !j.booking) S.mg = { error: true };
      else S.mg = { booking: j.booking, days: j.days || [], degraded: !!j.degraded };
      if (S.mg.booking) track('booking_manage_view', { booking_type: S.mg.booking.type, booking_status: S.mg.booking.status });
      render();
    });
  }
  function doCancel() {
    S.busy = true; S.msg = null;
    api({ action: 'cancel' }, { action: 'cancel', m: token }).then(function (j) {
      S.busy = false; closeDlg();
      if (j.ok || j.result === 'already') {
        S.mg.booking = Object.assign({}, S.mg.booking, j.booking || {}, { status: 'cancelled' });
        S.msg = { k: 'ok', html: 'הביטול נקלט. תודה שעדכנתם.' };
        track('booking_cancel', { booking_type: S.mg.booking.type });
      } else if (j.result === 'past') S.mg.booking.status = 'past';
      else S.msg = { k: 'err', html: 'לא הצלחנו לבטל כרגע. התקשרו אלינו: <a href="' + PHONE_TEL + '">' + PHONE + '</a>.' };
      render('ph');
    });
  }
  function doMove() {
    if (!S.slot) return;
    S.busy = true; S.msg = null; render();
    var old = S.mg.booking;
    api({ action: 'reschedule' }, { action: 'reschedule', m: token, date: S.day, time: S.slot }).then(function (j) {
      S.busy = false;
      if (j.ok) {
        S.mg.booking = Object.assign({}, old, j.booking || {}); S.mgView = 'info'; S.day = null; S.slot = null;
        S.msg = { k: 'ok', html: 'המועד עודכן. שלחנו אישור חדש בוואטסאפ.' };
        track('booking_reschedule', { booking_type: old.type, booking_date: S.mg.booking.date, booking_time: S.mg.booking.time });
        render('ph'); toTop(); loadManage(); return;
      }
      if (j.error === 'taken') { S.slot = null; if (j.days) S.mg.days = j.days; S.msg = { k: 'warn', html: 'המועד נתפס הרגע. בחרו מועד אחר — הרשימה עודכנה.' }; render(); return; }
      if (j.error === 'cancelled' || j.error === 'past') { S.mgView = 'info'; loadManage(); return; }
      S.msg = { k: 'err', html: 'לא הצלחנו לעדכן כרגע. התקשרו אלינו: <a href="' + PHONE_TEL + '">' + PHONE + '</a>.' }; render();
    });
  }

  /* ── דיאלוג אישור (ביטול) ── */
  function openDlg(title, text, actions) {
    var d = $('dlg'); $('dlgT').textContent = title; $('dlgP').textContent = text; $('dlgA').innerHTML = actions;
    if (d.showModal) { try { d.showModal(); } catch (e) { d.setAttribute('open', ''); } } else d.setAttribute('open', '');
  }
  function closeDlg() { var d = $('dlg'); if (d.open) { try { d.close(); } catch (e) { d.removeAttribute('open'); } } }

  /* ═══════════════ אירועים ═══════════════ */
  function go(step) { S.step = step; S.msg = null; render('ph'); toTop(); }
  document.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
    var a = b.getAttribute('data-act'), v = b.getAttribute('data-v');
    if (a === 'type') { var ch = S.type !== v; S.type = v; track('booking_type', { booking_type: v }); if (ch) { S.day = null; S.slot = null; S.days = null; } S.step = 2; S.msg = null; if (!S.days) loadSlots(); render('ph'); toTop(); }
    else if (a === 'to1') go(1);
    else if (a === 'to2') { readForm(); go(2); }
    else if (a === 'to3') { if (S.slot) go(3); }
    else if (a === 'day') { S.day = v; S.slot = null; render(); var x = document.querySelector('.day[aria-checked="true"]'); if (x) x.focus(); }
    else if (a === 'slot') { S.slot = v; track('booking_slot', { booking_type: S.type || (S.mg && S.mg.booking.type), booking_date: S.day, booking_time: v }); render(); var y = document.querySelector('.slot[aria-checked="true"]'); if (y) y.focus(); }
    else if (a === 'plan') { readForm(); S.plan = S.plan === v ? null : v; S.moreOpen = true; render(); }
    else if (a === 'copy') {
      var done = function () { var l = $('cpL'); if (l) { l.textContent = 'הועתק ✓'; setTimeout(function () { if ($('cpL')) $('cpL').textContent = 'העתקת קישור'; }, 1800); } };
      try { navigator.clipboard.writeText(v).then(done, function () { window.prompt('הקישור:', v); }); } catch (e) { window.prompt('הקישור:', v); }
    }
    else if (a === 'mgmove') { S.mgView = 'move'; S.day = null; S.slot = null; S.msg = null; render('ph'); }
    else if (a === 'mginfo') { S.mgView = 'info'; S.msg = null; render('ph'); }
    else if (a === 'askcancel') {
      var sh = S.mg.booking.type === 'showroom';
      openDlg(sh ? 'לבטל את הפגישה?' : 'לבטל את השיחה?', dLong(S.mg.booking.date) + ' · ' + S.mg.booking.time + '. אפשר לקבוע מחדש בכל עת.',
        '<button type="button" class="btnd solid" data-act="docancel">כן, לבטל</button><button type="button" class="btn2" data-act="nocancel">לא, להשאיר</button>');
    }
    else if (a === 'nocancel') closeDlg();
    else if (a === 'docancel') { b.disabled = true; b.innerHTML = '<span class="spin" aria-hidden="true"></span> מבטלים…'; doCancel(); }
    else if (a === 'domove') doMove();
  });
  document.addEventListener('click', function (ev) { var cm = $('calm'); if (cm && cm.open && !ev.target.closest('#calm')) cm.open = false; });
  document.addEventListener('submit', function (ev) { if (ev.target.id === 'frm') { ev.preventDefault(); if (!S.busy) submit(); } });
  document.addEventListener('input', function (ev) { var n = ev.target.name; if (n && S.errs[n]) { delete S.errs[n]; var l = ev.target.closest('.f'); if (l) l.classList.remove('bad'); var e = $('e_' + n); if (e) e.remove(); } });
  /* חיצים בתוך קבוצת radio (סוג / יום / שעה / תכנון) */
  document.addEventListener('keydown', function (ev) {
    var t = ev.target; if (!t.getAttribute || t.getAttribute('role') !== 'radio') return;
    var k = ev.key; if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Home', 'End'].indexOf(k) < 0) return;
    var g = t.closest('[role="radiogroup"]'); if (!g) return;
    var items = Array.prototype.slice.call(g.querySelectorAll('[role="radio"]')); var i = items.indexOf(t);
    var nx = k === 'Home' ? 0 : k === 'End' ? items.length - 1 : (k === 'ArrowLeft' || k === 'ArrowDown') ? i + 1 : i - 1;
    if (nx < 0) nx = items.length - 1; if (nx >= items.length) nx = 0;
    ev.preventDefault(); items[nx].focus();
  });
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape') { var cm = $('calm'); if (cm && cm.open) cm.open = false; } });

  /* ═══════════════ התחלה ═══════════════ */
  if (S.mode === 'manage') { render(); loadManage(); }
  else {
    render();
    api({ action: 'config' }).then(function (j) {
      if (!j.ok) { S.degraded = true; render(); return; }
      S.cfg = { enabled: j.enabled !== false, consult_min: j.consult_min || 15, showroom_min: j.showroom_min || 30, horizon_days: j.horizon_days || 10, address: j.address || '' };
      track('booking_view', { booking_enabled: S.cfg.enabled, booking_type: S.type || undefined });
      if (S.cfg.enabled && S.type) { S.step = 2; loadSlots(); } else render();
    });
  }
})();
</script>
</body>
</html>
