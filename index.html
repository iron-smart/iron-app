<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>איירון פיטנס — המערכת</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --navy:#002D48; --green:#6A9F85; --dark:#061827; --bg:#f4f6f8; --line:#e2e8f0; --red:#c0392b; --amber:#d97706; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ margin:0; font-family:'Heebo',-apple-system,"Segoe UI",Rubik,Arial,sans-serif; background:var(--bg); color:var(--dark); }
  button{ font-family:inherit; cursor:pointer; }
  .hidden{ display:none !important; }

  /* התחברות */
  #login{ min-height:100vh; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg,var(--navy),var(--dark)); padding:20px; }
  #login .card{ background:#fff; border-radius:18px; padding:34px 26px; width:100%; max-width:380px; box-shadow:0 20px 60px rgba(0,0,0,.3); }
  #login h1{ text-align:center; color:var(--navy); margin:0 0 4px; font-size:24px; }
  #login .sub{ text-align:center; color:#64748b; margin:0 0 24px; font-size:14px; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:13px; color:#475569; margin-bottom:6px; }
  .field input{ width:100%; padding:12px 14px; border:1px solid var(--line); border-radius:10px; font-size:16px; }
  .field input:focus{ outline:none; border-color:var(--green); }
  .btn{ width:100%; padding:13px; border:none; border-radius:10px; background:var(--navy); color:#fff; font-size:16px; font-weight:600; }
  .btn:active{ opacity:.85; }
  .btn.green{ background:var(--green); }
  .err{ color:var(--red); font-size:13px; text-align:center; margin-top:10px; min-height:18px; }

  /* אפליקציה */
  header{ background:var(--navy); color:#fff; padding:12px 16px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:10; }
  header .who{ font-size:14px; } header .who b{ display:block; font-size:16px; }
  header .role{ font-size:11px; background:var(--green); padding:2px 8px; border-radius:20px; margin-inline-start:8px; }
  header button{ background:rgba(255,255,255,.15); color:#fff; border:none; border-radius:8px; padding:8px 12px; font-size:13px; }
  .tabs{ display:flex; background:#fff; border-bottom:1px solid var(--line); position:sticky; top:56px; z-index:9; overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .tabs button{ flex:none; padding:14px 16px; border:none; background:none; font-size:15px; color:#64748b; border-bottom:3px solid transparent; white-space:nowrap; }
  .tabs button.active{ color:var(--navy); font-weight:700; border-bottom-color:var(--green); }
  .tabs button.jump{ color:var(--green); font-weight:700; }
  main{ padding:16px 3vw; margin:0 auto; }

  .stats{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:20px; }
  .stat{ background:#fff; border-radius:14px; padding:18px; text-align:center; box-shadow:0 1px 3px rgba(0,0,0,.06); }
  .stat .n{ font-size:32px; font-weight:800; color:var(--navy); }
  .stat .l{ font-size:13px; color:#64748b; margin-top:4px; }
  h2.sec{ font-size:16px; color:var(--navy); margin:22px 4px 12px; }

  .toolbar{ display:flex; gap:10px; margin-bottom:14px; }
  .toolbar input{ flex:1; padding:11px 14px; border:1px solid var(--line); border-radius:10px; font-size:15px; }
  .toolbar .add{ background:var(--green); color:#fff; border:none; border-radius:10px; padding:0 18px; font-size:22px; font-weight:700; }

  .lead{ background:#fff; border-radius:12px; padding:14px; margin-bottom:10px; box-shadow:0 1px 3px rgba(0,0,0,.06); display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .lead:active{ background:#f8fafc; }
  .lead .nm{ font-weight:600; font-size:16px; }
  .lead .meta{ font-size:13px; color:#64748b; margin-top:3px; }
  .pill{ font-size:12px; padding:4px 10px; border-radius:20px; white-space:nowrap; }
  .st-new{ background:#e0e7ff; color:#3730a3; } .st-rel{ background:#dcfce7; color:#166534; }
  .st-no{ background:#fee2e2; color:#991b1b; } .st-def{ background:#f1f5f9; color:#475569; }
  .empty{ text-align:center; color:#94a3b8; padding:40px 20px; }
  .chips{ display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; margin-bottom:12px; -webkit-overflow-scrolling:touch; }
  .chip{ flex:none; border:1px solid var(--line); background:#fff; border-radius:20px; padding:8px 14px; font-size:13px; color:#475569; }
  .chip.active{ background:var(--navy); color:#fff; border-color:var(--navy); font-weight:600; }
  .chip small{ opacity:.75; }
  .more{ text-align:center; color:#64748b; font-size:13px; padding:10px; }

  /* מודל */
  .modal{ position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex; align-items:flex-end; justify-content:center; z-index:50; }
  .modal .sheet{ background:#fff; width:100%; max-width:520px; border-radius:20px 20px 0 0; padding:22px; max-height:92vh; overflow:auto; }
  @media(min-width:560px){ .modal{ align-items:center; } .modal .sheet{ border-radius:20px; } }
  .sheet h3{ margin:0 0 16px; color:var(--navy); }
  .row{ display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--line); font-size:15px; }
  .row .k{ color:#64748b; } .row .v{ font-weight:600; text-align:end; }
  .actions{ display:flex; flex-direction:column; gap:10px; margin-top:18px; }
  .ghost{ background:#f1f5f9; color:var(--navy); border:none; border-radius:10px; padding:12px; font-size:15px; }
  select,.actions input{ width:100%; padding:12px 14px; border:1px solid var(--line); border-radius:10px; font-size:16px; }
  .note{ font-size:13px; color:#64748b; background:#f8fafc; border-radius:10px; padding:10px 12px; margin-top:10px; }
  .ok-box{ background:#dcfce7; color:#166534; border-radius:10px; padding:12px; font-size:14px; margin-top:12px; line-height:1.6; }
  .linkout{ background:#eef4fa; border:1px solid #c9dcee; color:#0b3552; border-radius:12px; padding:11px 14px; font-size:13px; margin-bottom:12px; }
  .linkout a{ color:#0b3552; font-weight:700; }

  /* ===== רספונסיביות — טאבלט ומחשב ===== */
  @media(min-width:700px){
    .stats{ grid-template-columns:repeat(4,1fr); }
    .tabs{ justify-content:center; }
    .tabs button{ font-size:14px; }
  }
  @media(min-width:700px){
    /* שפה עיצובית אחידה עם לוח התיאום: שורות טבלאיות, קווים דקים, סטטוסים צבעוניים */
    main{ padding:22px 3vw; }
    .lead{ border-radius:0; box-shadow:none; border:1px solid var(--line); margin-bottom:-1px; padding:10px 14px; }
    .lead:hover{ background:#f8fafc; cursor:pointer; }
    .lead:first-child{ border-radius:12px 12px 0 0; }
    .lead:last-child{ border-radius:0 0 12px 12px; margin-bottom:12px; }
    .lead:only-child{ border-radius:12px; }
    .lead .nm{ font-size:15px; }
    .lead .meta{ font-size:12.5px; }
    .modal .sheet{ max-width:600px; }
    .toolbar input{ max-width:520px; }
  }
  @media(max-width:380px){
    .stat .n{ font-size:26px; }
    .tabs button{ padding:12px 11px; font-size:14px; }
    main{ padding:12px; }
  }

  /* ===== מעטפת מאוחדת — סרגל עליון + תפריט צד ימני (עיצוב לוח התיאום) ===== */
  .topnav{ position:sticky; top:0; z-index:30; display:flex; align-items:center; gap:12px; background:linear-gradient(135deg,#061827,#0b3552); color:#fff; padding:9px 14px; min-height:52px; box-sizing:border-box; }
  .topnav .burger{ background:rgba(255,255,255,.12); border:none; color:#fff; font-size:19px; border-radius:8px; padding:5px 12px; }
  .brand-wm{ height:36px; width:auto; }
  .user-chip{ display:flex; align-items:center; gap:8px; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.18); border-radius:999px; padding:4px 12px 4px 6px; font-size:13px; }
  .user-chip .av{ width:26px; height:26px; border-radius:50%; background:var(--green); color:#fff; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; }
  .user-chip .rle{ opacity:.75; font-size:12px; }
  .topnav .spacer{ flex:1; }
  .topnav .who2{ font-size:13px; opacity:.92; }
  .topnav button.out{ background:rgba(255,255,255,.15); color:#fff; border:none; border-radius:8px; padding:7px 12px; font-size:13px; }
  .shell{ display:flex; align-items:stretch; }
  aside#side{ width:225px; flex:none; background:linear-gradient(180deg,#061827,#0b3552); padding:12px 0; position:sticky; top:52px; align-self:flex-start; height:calc(100vh - 52px); overflow-y:auto; box-sizing:border-box; }
  aside#side.closed{ display:none; }
  .nav-item{ display:flex; align-items:center; justify-content:space-between; gap:10px; width:100%; text-align:start; background:none; border:none; color:#cfd8e3; font-size:14px; font-family:inherit; padding:8px 18px; border-inline-start:3px solid transparent; }
  .side-top{ display:flex; align-items:center; justify-content:space-between; padding:2px 18px 8px; color:#8fa3b5; font-size:12px; border-bottom:1px solid rgba(255,255,255,.08); margin-bottom:6px; }
  .side-hide{ background:rgba(255,255,255,.1); border:none; color:#cfd8e3; border-radius:6px; padding:2px 9px; font-size:14px; cursor:pointer; }
  .side-hide:hover{ background:rgba(255,255,255,.2); color:#fff; }
  .nav-wrap{ position:relative; }
  .nav-arrow{ font-size:13px; opacity:.55; }
  .submenu{ display:none; position:absolute; inset-inline-start:100%; inset-inline-end:auto; top:0; background:#0b3552; border:1px solid rgba(255,255,255,.15); border-radius:10px 0 0 10px; min-width:165px; padding:6px 0; box-shadow:0 8px 30px rgba(0,0,0,.35); z-index:45; }
  .nav-wrap:hover .submenu{ display:block; }
  .submenu button{ display:block; width:100%; text-align:start; background:none; border:none; color:#cfd8e3; font-size:13.5px; font-family:inherit; padding:9px 16px; cursor:pointer; }
  .submenu button:hover{ color:#fff; background:rgba(255,255,255,.08); }
  .nav-item.active{ color:#fff; background:rgba(255,255,255,.07); border-inline-start-color:var(--green); font-weight:700; }
  .nav-item:hover{ color:#fff; }
  .side-foot{ color:#84898f; font-size:11px; text-align:center; padding:14px 10px; }
  .content{ flex:1; min-width:0; }
  /* כל המסכים פרוסים לרוחב מלא עם שוליים אחידים (3vw) */
  .frame-wrap{ height:calc(100vh - 82px); }
  .frame-wrap iframe{ width:100%; height:100%; border:none; border-radius:0; background:#fff; }

  /* טבלה בעיצוב הלוח */
  .tbl-wrap{ background:#fff; border:1px solid var(--line); border-radius:12px; overflow:auto; }
  table.tbl{ width:100%; border-collapse:collapse; font-size:14px; }
  .tbl th{ text-align:right; color:#fff; background:linear-gradient(135deg,#061827,#0b3552); font-weight:700; font-size:13px; padding:10px 12px; white-space:nowrap; position:sticky; top:0; z-index:3; }
  .tbl td{ padding:9px 12px; border-bottom:1px solid #eef1f4; white-space:nowrap; }
  /* תיקון ממצא 23 — רק עוטף שיש בתוכו טבלה מקבל גובה מרבי, כדי שהגלילה תתרחש בתוכו והכותרת תידבק */
  .tbl-wrap:has(> table.tbl){ max-height:calc(100vh - 215px); }
  /* תיקון ממצא 17 — רקע מוצלל מאחורי הסרגל הנפתח במובייל */
  #sideBackdrop{ display:none; position:fixed; inset:52px 0 0 0; background:rgba(6,24,39,.45); z-index:28; }
  @media(min-width:801px){ #sideBackdrop{ display:none !important; } }
  .tbl tbody tr{ cursor:pointer; }
  .tbl tbody tr:hover{ background:#f6f9fb; }
  .tbl tbody tr:last-child td{ border-bottom:none; }
  /* טבלת מקטים — כותרות ותאים ממורכזים, תיאור צמוד לימין (הערת רומן 27/07) */
  table.tbl-center th, table.tbl-center td{ text-align:center; vertical-align:middle; }
  table.tbl-center td.td-desc{ text-align:right; white-space:normal; min-width:220px; }

  /* ===== שפת הטבלה של הלוח הישן — על כל המערכת (איפיון 8, סבב 3) ===== */
  .tbl tbody tr:nth-child(even){ background:#f6f7f6; }
  .tbl tbody tr:hover{ background:#eef4f2; }
  .tbl td{ max-width:200px; overflow:hidden; text-overflow:ellipsis; line-height:1.35; }
  .rownum{ width:38px; min-width:38px; text-align:center; color:#94a3b8; font-size:11.5px; font-weight:600; }
  .note-preview{ font-size:11px; color:#8a9199; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:180px; }
  .count-line2{ color:#64748b; font-size:12.5px; padding:8px 4px; }
  .inline-edit{ width:auto; max-width:135px; font-size:12.5px; padding:3px 6px; border:1px solid transparent; background:transparent; border-radius:6px; cursor:pointer; }
  .inline-edit:hover{ border-color:var(--line); background:#fff; }
  .inline-edit:focus{ border-color:#579bfc; background:#fff; outline:none; }
  .inline-edit.ie-date{ max-width:122px; direction:ltr; }
  select.pilled{ border-radius:99px; font-weight:700; -webkit-appearance:none; appearance:none; }
  select.inline-edit.pilled{ padding:2px 10px; font-size:12px; }
  select.pilled:hover{ filter:brightness(.95); }
  select.pilled.p-blue{ background:#e3edfb; color:#1c5cab; border-color:#c4d9f5; }
  select.pilled.p-green{ background:#e2f4e2; color:#006300; border-color:#bfe4bf; }
  select.pilled.p-yellow{ background:#fdf0d2; color:#7a5b00; border-color:#f0dc9e; }
  select.pilled.p-orange{ background:#fde5da; color:#a33c12; border-color:#f5c7b0; }
  select.pilled.p-red{ background:#fbe0e0; color:#a92f2f; border-color:#f0bcbc; }
  select.pilled.p-violet{ background:#e9e6f8; color:#4a3aa7; border-color:#cfc8f0; }
  select.pilled.p-gray{ background:#eeeeea; color:#555; border-color:#d8d8d2; }
  select.inline-edit.mdc{ color:#fff; border:none; border-radius:99px; font-weight:700; padding:2px 10px; font-size:12px; -webkit-appearance:none; appearance:none; }
  .btn-wa2{ background:#1faa53; color:#fff; padding:4px 9px; border-radius:7px; font-size:12.5px; font-weight:700; text-decoration:none; display:inline-flex; gap:4px; align-items:center; }
  .btn-wa2:hover{ background:#178a43; }
  .tools-bar{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; align-items:center; }
  .tools-bar .search{ flex:1; min-width:200px; position:relative; }
  .tools-bar .search input{ width:100%; padding:9px 32px 9px 12px; border:1px solid var(--line); border-radius:10px; font-size:14px; box-sizing:border-box; }
  .tools-bar .search::before{ content:'🔎'; position:absolute; inset-inline-start:9px; top:8px; font-size:13px; opacity:.55; }
  .tools-bar select{ width:auto; min-width:110px; padding:8px 9px; font-size:13px; border:1px solid var(--line); border-radius:9px; background:#fff; }
  .tools-bar input[type=date]{ width:auto; padding:7px 8px; font-size:13px; border:1px solid var(--line); border-radius:9px; }
  .tools-bar .tb-lbl{ font-size:12px; color:#64748b; white-space:nowrap; }
  .tools-bar .tb-group{ display:flex; gap:5px; align-items:center; white-space:nowrap; }
  .chip .n{ font-weight:800; }
  #toast{ position:fixed; bottom:22px; inset-inline-start:50%; transform:translateX(50%); background:#0b3552; color:#fff; padding:10px 22px; border-radius:99px; font-size:14px; font-weight:600; z-index:200; box-shadow:0 8px 30px rgba(0,0,0,.3); opacity:0; transition:opacity .2s; pointer-events:none; }
  #toast.show{ opacity:1; }
  /* כפתור צף עגול להחזרת הפאנל (הערה 2, סבב 3) */
  /* (העיצוב המלא של הכפתור הצף מוגדר בהמשך — צד ימין, ליד הפאנל) */
  /* לובי — סמל איירון ליד השם (הערה 3, סבב 3) */
  .nav-item .nav-ico{ width:17px; height:17px; object-fit:contain; margin-inline-end:2px; vertical-align:-3px; }

  /* לוח שנה */
  .cal-head2{ display:flex; align-items:center; justify-content:center; gap:10px; margin:4px 0 12px; font-size:17px; color:var(--navy); }
  .cal-btn{ width:auto; padding:8px 14px; }
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
  .cal-names{ margin-bottom:4px; text-align:center; color:#64748b; font-size:12px; font-weight:700; }
  .cal-day{ background:#fff; border:1px solid var(--line); border-radius:10px; min-height:96px; padding:5px; font-size:11.5px; overflow:hidden; }
  .cal-out{ opacity:.35; }
  .cal-today{ outline:2px solid var(--green); }
  .cal-num{ font-weight:700; color:#64748b; font-size:11px; margin-bottom:3px; }
  .cal-ev{ background:#f6f9fb; border:1px solid var(--line); border-inline-start:4px solid #64748b; border-radius:6px; padding:2px 5px; margin-bottom:3px; cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .cal-ev:hover{ background:#eef4fa; }
  .cal-legend{ display:flex; gap:14px; flex-wrap:wrap; margin-top:10px; font-size:12.5px; color:#475569; }
  .cal-lg{ display:flex; align-items:center; gap:5px; }
  .cal-dot{ width:10px; height:10px; border-radius:50%; display:inline-block; }
  @media(max-width:700px){ .cal-day{ min-height:64px; } .cal-ev small{ display:none; } }
  .sku-img{ width:46px; height:46px; object-fit:cover; border-radius:10px; border:1px solid var(--line); flex:none; cursor:pointer; }
  .sku-none{ display:flex; align-items:center; justify-content:center; background:#f1f5f9; font-size:20px; cursor:default; }
  #board-wrap{ height:calc(100vh - 122px); }
  #board-wrap iframe{ border-radius:0; box-shadow:none; }
  #dash-board-wrap{ margin-bottom:18px; }
  #board-wrap{ height:calc(100vh - 175px); }
  #board-wrap iframe{ width:100%; height:100%; border:none; border-radius:12px; background:#fff; box-shadow:0 2px 10px rgba(6,24,39,.08); }
  @media(max-width:800px){
    /* תיקון ממצא 17 — ב-RTL‏ inset-inline-start הוא הצד הימני, שם הסרגל יושב בדסקטופ */
    aside#side{ position:fixed; inset-inline-start:0; inset-inline-end:auto; top:52px; z-index:29; box-shadow:0 0 40px rgba(0,0,0,.45); max-width:82vw; }
    /* תיקון ממצא 18 — במגע אין hover, לכן תפריטי המשנה נפרסים בתוך הרשימה */
    .submenu{ display:block; position:static; min-width:0; padding:2px 0 6px; border:none; border-radius:0; box-shadow:none; background:rgba(255,255,255,.05); }
    .submenu button{ padding:8px 34px; font-size:13px; }
    .tbl-wrap:has(> table.tbl){ max-height:calc(100vh - 168px); }
    #board-wrap{ height:calc(100vh - 165px); }
    #lastSync{ display:none; }
    .user-chip .rle{ display:none; }
    .brand-wm{ height:28px; }
  }

  /* ===== כרטיסים: X לסגירה + חזרה אחורה (הערות 1–3) ===== */
  .modal .sheet{ position:relative; }
  .card-bar{ display:flex; justify-content:space-between; align-items:center; margin:-6px -6px 8px 0; }
  .card-x{ background:#f1f5f9; border:none; color:#475569; width:32px; height:32px; border-radius:50%; font-size:15px; line-height:1; }
  .card-x:hover{ background:#e2e8f0; color:#0b3552; }
  .card-back{ background:none; border:none; color:var(--navy); font-size:13.5px; font-weight:700; padding:6px 8px; border-radius:8px; }
  .card-back:hover{ background:#f1f5f9; }

  /* ===== הדגשת קטגוריה פעילה חזקה (הערה 4) ===== */
  .nav-item.active{ color:#fff; background:linear-gradient(90deg,rgba(106,159,133,.35),rgba(106,159,133,.08)); border-inline-start:4px solid var(--green); font-weight:800; }
  .nav-item.active .nav-arrow{ opacity:1; color:var(--green); }

  /* ===== פאנל בסגנון GreenInvoice (הערה 6) ===== */
  aside#side{ display:flex; flex-direction:column; }
  #side nav{ flex:1; overflow-y:auto; }
  .nav-item{ padding:9px 18px; }
  .nav-item .nav-arrow{ font-size:12px; opacity:.45; }
  .side-user{ display:flex; align-items:center; gap:10px; padding:10px 16px; border-top:1px solid rgba(255,255,255,.1); color:#cfd8e3; font-size:13px; cursor:pointer; }
  .side-user:hover{ color:#fff; background:rgba(255,255,255,.05); }

function _rgbOf(h){
  h = String(h||'').trim().replace('#','');
  if(h.length===3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  if(!/^[0-9a-fA-F]{6}$/.test(h)) return null;
  return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
}
function _lumOf(c){
  const f = v => { v/=255; return v<=0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055, 2.4); };
  return 0.2126*f(c[0]) + 0.7152*f(c[1]) + 0.0722*f(c[2]);
}
function _contrast(a,b){
  const l1=_lumOf(a), l2=_lumOf(b);
  return (Math.max(l1,l2)+0.05)/(Math.min(l1,l2)+0.05);
}
/* צבע טקסט על גבי רקע צבעוני — לבן או כהה, מה שקריא יותר */
function inkOn(bg){
  const c=_rgbOf(bg); if(!c) return '#fff';
  return _contrast(c,[255,255,255]) >= _contrast(c,[16,34,47]) ? '#fff' : '#10222f';

document.addEventListener('keydown', function(e){
  /* Esc — סגירת כרטיס פתוח, אחרת סגירת התפריט הצף במובייל */

  if(e.key !== 'Enter' && e.key !== ' ') return;
  const el = e.target;
  if(!el || !el.getAttribute) return;
  const tag = el.tagName;
  if(tag === 'BUTTON' || tag === 'A' || tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;

  document.querySelectorAll(sel).forEach(function(el){
    if(el.hasAttribute('tabindex')) return;
    el.setAttribute('tabindex','0');
    if(!el.getAttribute('role')) el.setAttribute('role','button');
  });
  const b = document.getElementById('sideToggle');
  if(b) b.setAttribute('aria-expanded', String(!document.getElementById('side').classList.contains('closed')));
}
let _a11yTimer = null;
try{
  new MutationObserver(function(){
    clearTimeout(_a11yTimer);
    _a11yTimer = setTimeout(a11yUpgrade, 120);
  }).observe(document.body, { childList:true, subtree:true });
  a11yUpgrade();
}catch(e){ console.error('הפעלת שיפורי הנגישות נכשלה', e); }

function toast(msg){
  let t=document.getElementById('toast');
  if(!t){ t=document.createElement('div'); t.id='toast'; document.body.appendChild(t); }
  t.textContent=msg; t.classList.add('show');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'), 1800);
}

window.ieSave = async (el)=>{
  const [kind,id,field]=el.dataset.ie.split('|');
  const cfg=IE_TABLES[kind]; if(!cfg) return;
  const rec=cfg.arr().find(x=>String(x.id)===id); if(!rec) return;
  const val = el.value===''?null:el.value;
  const patch={ [field]:val };
  if(kind==='task' && field==='status' && val==='הושלם') patch.closed_at=new Date().toISOString();
  if(kind==='deal' && field==='stage' && ['הושלם','לא רלוונטי'].includes(val)) patch.closed_at=new Date().toISOString();
  let error, row = null;
  if(cfg.bridge){
    const r = await oldCall(cfg.bridge, { id, patch });
    error = r.error; row = r.data && r.data.row;
  }else{
    ({ error } = await sb.schema(cfg.schema).from(cfg.table).update(patch).eq('id', id));
  }
  if(error){ toast('שגיאה בשמירה: '+error.message); cfg.rerender(); return; }
  Object.assign(rec, row || patch);
  if(cfg.schema==='ord'){
    try{ await sb.schema('ord').from('audit_log').insert({ user_email:ME.email, action:'עריכה ישירה מהטבלה', entity:cfg.ent, entity_id:String(cfg.key(rec)||''), label:field }); }catch(_e){}
  }
  toast('נשמר ✓');
  cfg.rerender();
};

/* ===== לוח שנה נטיבי — שיבוצי התקנות, משלוחים וקריאות שירות ===== */
let CAL_D = new Date();
const isoD = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
let CAL_VIEW='month';
window.calMode = v=>{ CAL_VIEW=v; renderCal(); };
window.calShift = n=>{
  if(CAL_VIEW==='month') CAL_D = new Date(CAL_D.getFullYear(), CAL_D.getMonth()+n, 1);
  else CAL_D = new Date(CAL_D.getFullYear(), CAL_D.getMonth(), CAL_D.getDate()+n*(CAL_VIEW==='week'?7:1));
  renderCal();
};
window.calToday = ()=>{ CAL_D = new Date(); renderCal(); };
function teamColor(name){ const t=OTEAMS.find(x=>x.name===name); return (t&&t.color)?t.color:'#64748b'; }
/* לוח שנה בעיצוב המערכת הקודמת (הזמנות ותיאומים), בקנה מידה נוכחי — הנחיית רומן 27/07.
   שבוע עבודה ראשון–חמישי; שישי מוצג רק אם שובצה בו עבודה שאושרה; אירועים רב-יומיים לפי days_count. */
const CAL_FRIDAY=5, CAL_SATURDAY=6;
const dowOf = ds => new Date(ds+'T12:00:00').getDay();
const addDaysIso = (ds,n)=>{ const d=new Date(ds+'T12:00:00'); d.setDate(d.getDate()+n); return isoD(d); };
const dayNameHe = ds => new Date(ds+'T12:00:00').toLocaleDateString('he-IL',{weekday:'long'});
const weekStartIso = ds => addDaysIso(ds, -dowOf(ds));
function workDates(o){
  const out=[]; if(!o.scheduled_date) return out;
  let d=o.scheduled_date, guard=0; const total=Math.max(1,o.days_count||1);
  while(out.length<total && guard++<60){
    const dw=dowOf(d);
    if(dw!==CAL_SATURDAY && (dw!==CAL_FRIDAY || o.friday_ok)) out.push(d);
    d=addDaysIso(d,1);
  }
  return out;
}
function dayIndexOf(o, ds){ const i=workDates(o).indexOf(ds); return i<0?0:i+1; }
function eventsOn(ds){
  const evs=[];
  for(const o of ORDS){
    if(!o.scheduled_date || ['בוטל','מבוטלת'].includes(o.order_status)) continue;
    if(ds<o.scheduled_date) continue;
    const idx=dayIndexOf(o,ds);
    if(idx) evs.push({kind:'order',o,dayIdx:idx,dayTotal:Math.max(1,o.days_count||1)});
  }
  for(const c of SCALLS){ if(c.scheduled_date===ds && c.status!=='בוטלה') evs.push({kind:'svc',o:c}); }
  return evs.sort((a,b)=>String(a.o.time_slot||'').localeCompare(String(b.o.time_slot||'')));
}
const teamChip=(name,col)=> name?`<span class="teamchip" style="background:${col}">${esc(name)}</span>`:'<span class="teamchip nochip">ללא צוות</span>';
const slotShort=s=>!s?'':(s==='יום מלא'?'יום מלא':String(s).split('-')[0]);
const evOpen=e=> e.kind==='svc'?`openScall('${e.o.id}')`:`openOrd('${e.o.id}')`;
const evDone=e=> e.kind==='order' ? e.o.order_status==='הושלם' : ['הושלם','הושלמה'].includes(e.o.status);
function evCard(e){
  const o=e.o, col=teamColor(o.team), done=evDone(e);
  return `<div class="ev ${e.kind==='svc'?'svc':''}" style="border-inline-start-color:${col};${done?'opacity:.55':''}" onclick="${evOpen(e)}">
    <div class="ev-top"><span class="ev-time">${esc(o.time_slot||'ללא שעה')}</span>${done?'<span class="ev-done">✓ הושלם</span>':''}</div>
    <div class="t">${e.kind==='svc'?'🛠️ ':''}${esc(o.customer_name||'')}</div>
    <div class="s">${e.kind==='svc'?esc(String(o.product||'').slice(0,30)):esc(o.order_number||'')}${o.items_count?` · ${o.items_count} פר'`:''}</div>
    ${o.city||o.address?`<div class="s">📍 ${esc(o.city||'')}${o.address?`, ${esc(String(o.address).slice(0,24))}`:''}</div>`:''}
    ${o.phone?`<div class="s" dir="ltr" style="text-align:right">📞 ${esc(o.phone)}</div>`:''}
    <div class="s ev-foot">${teamChip(o.team,col)}${e.kind==='order'&&e.dayTotal>1?`<span class="tagx">${e.dayIdx>1?'המשך · ':''}יום ${e.dayIdx} מתוך ${e.dayTotal}</span>`:''}${e.kind==='order'&&o.friday_ok?'<span class="tagx" title="אושרה עבודה ביום שישי">🗓️ שישי</span>':''}${e.kind==='order'&&o.order_notes?`<span class="tagx" title="${esc(o.order_notes)}">📝</span>`:''}</div>
  </div>`;
}
window.calGoDay = ds=>{ CAL_D=new Date(ds+'T12:00:00'); CAL_VIEW='day'; renderCal(); };
function renderCal(){
  const el = $('#cal-wrap'); if(!el) return;
  const t=isoD(new Date()), cd=isoD(CAL_D);
  let title='', body='';
  if(CAL_VIEW==='month'){
    const first=cd.slice(0,8)+'01';
    const mNum=new Date(first+'T12:00:00').getMonth();
    title=CAL_D.toLocaleDateString('he-IL',{month:'long',year:'numeric'});
    let cur=weekStartIso(first); const cells=[];
    for(let w=0;w<6;w++){
      for(let i=0;i<6;i++) cells.push(addDaysIso(cur,i));
      cur=addDaysIso(cur,7);
      if(new Date(cur+'T12:00:00').getMonth()!==mNum && w>=3) break;
    }
    body=`<div class="cal-scroll"><div class="month-grid">
      ${['ראשון','שני','שלישי','רביעי','חמישי','שישי'].map(n=>`<div class="mh">${n}</div>`).join('')}
      ${cells.map(d=>{
        const inMonth=new Date(d+'T12:00:00').getMonth()===mNum;
        const evs=eventsOn(d); const shown=evs.slice(0,3);
        const nowork=dowOf(d)===CAL_FRIDAY&&!evs.length;
        return `<div class="month-cell ${inMonth?'':'out'} ${d===t?'today':''} ${nowork?'nowork':''}" onclick="calGoDay('${d}')">
          <div class="mnum"><span>${parseInt(d.slice(8),10)}</span>${evs.length?`<span class="mcount">${evs.length}</span>`:''}</div>
          ${shown.map(e=>{ const o=e.o, col=teamColor(o.team), done=evDone(e);
            return `<div class="mini-ev" style="border-inline-start-color:${col};${done?'opacity:.5':''}" title="${esc(o.customer_name||'')} · ${esc(o.time_slot||'ללא שעה')} · ${esc(o.team||'ללא צוות')}${o.city?' · '+esc(o.city):''}">
              <div class="me-line1"><span class="me-time">${esc(slotShort(o.time_slot))||'—'}</span><b>${e.kind==='svc'?'🛠️':''}${esc(o.customer_name||'')}</b></div>
              <div class="me-line2"><span class="me-dot" style="background:${col}"></span>${esc(o.team||'ללא צוות')}${o.city?` · ${esc(o.city)}`:''}</div>
            </div>`;}).join('')}
          ${evs.length>3?`<div class="mini-more">+${evs.length-3} נוספים…</div>`:''}
        </div>`;}).join('')}
    </div></div>`;
  } else if(CAL_VIEW==='week'){
    const ws=weekStartIso(cd);
    const days=[0,1,2,3,4].map(i=>addDaysIso(ws,i));
    const fri=addDaysIso(ws,5);
    if(eventsOn(fri).length) days.push(fri);
    title=`שבוע ${fmtD(days[0])} — ${fmtD(days[days.length-1])}`;
    body=`<div class="cal-scroll"><div class="wk-grid" style="grid-template-columns:repeat(${days.length},minmax(185px,1fr))">
      ${days.map(d=>{ const evs=eventsOn(d);
        return `<div class="wk-day ${d===t?'today':''} ${dowOf(d)===CAL_FRIDAY?'nowork':''}">
          <div class="dhead" onclick="calGoDay('${d}')"><span>${dayNameHe(d)}${dowOf(d)===CAL_FRIDAY?' <span class="fri-tag">שישי</span>':''}</span><span class="dnum">${fmtD(d)}</span></div>
          ${evs.map(evCard).join('')||'<div style="color:#c3cbd4;font-size:12px;text-align:center;padding:14px 0">—</div>'}
        </div>`;}).join('')}
    </div></div>`;
  } else {
    const evs=eventsOn(cd);
    title=`${dayNameHe(cd)}, ${fmtD(cd)}`;
    body=`<div class="cal-scroll"><div class="day-list">
      ${evs.length? evs.map(e=>{ const o=e.o, col=teamColor(o.team), done=evDone(e);
        return `<div class="day-ev" style="border-inline-start-color:${col};${done?'opacity:.55':''}" onclick="${evOpen(e)}">
          <div class="tm">${esc(o.time_slot||'ללא שעה')}</div>
          <div class="who">
            <div class="nm2">${e.kind==='svc'?'🛠️ ':'📦 '}${esc(o.customer_name||'')} ${done?'✓':''}</div>

function filteredSkus(){
  const q=(SKU_F.q||'').trim(), qU=q.toUpperCase();
  let list=SKUS.filter(s=>{
    if(q && !(String(s.partname||'').toUpperCase().includes(qU)||(s.partdes||'').includes(q)||String(s.barcode||'').toUpperCase().includes(qU)||(s.supplier||'').includes(q))) return false;
    if(SKU_F.fam && s.family!==SKU_F.fam) return false;
    if(SKU_F.act==='y' && !skuActive(s)) return false;
    if(SKU_F.act==='n' && skuActive(s)) return false;
    if(SKU_F.stock==='in' && !(Number(s.qty)>0)) return false;
    if(SKU_F.stock==='out' && Number(s.qty)>0) return false;
    return true;
  });
  const n=v=>Number(v||0);
  switch(SKU_F.sort){
    case 'partdes': list.sort((a,b)=>(a.partdes||'').localeCompare(b.partdes||'','he')); break;
    case 'family': list.sort((a,b)=>(a.family||'').localeCompare(b.family||'','he')||String(a.partname).localeCompare(String(b.partname))); break;
    case 'price_d': list.sort((a,b)=>n(b.price)-n(a.price)); break;
    case 'qty_d': list.sort((a,b)=>n(b.qty)-n(a.qty)); break;
    case 'sold_d': list.sort((a,b)=>n(b.sales_total)-n(a.sales_total)); break;
    default: list.sort((a,b)=>String(a.partname||'').localeCompare(String(b.partname||'')));
  }
  return list;
}

let DOC_FILTER='sent';
const TOKEN_AB='abcdefghjkmnpqrstuvwxyz23456789';

const viewUrl = t => new URL('sign.html?view='+t, location.href).href;
function waLink(phone, text){ let d=digitsOf(phone); if(d.startsWith('0')) d='972'+d.slice(1); return 'https://wa.me/'+d+'?text='+encodeURIComponent(text); }
window.copyTxt = async t=>{ try{ await navigator.clipboard.writeText(t); alert('הקישור הועתק ✓'); }catch(_e){ prompt('העתקה ידנית:', t); } };

    body = `<h2 class="sec" style="margin-top:0">ניהול משתמשים</h2>
      <div class="note">כניסה אחת לכל המערכת. הרשאה קובעת מה מותר; דשבורד קובע מה רואים בכניסה; תפקיד — הגדרת התפקיד בחברה.</div>
      <div id="usersBox" class="tbl-wrap" style="padding:12px"><div class="empty">טוען משתמשים…</div></div>
      <h2 class="sec">➕ הוספת משתמש חדש</h2>
      <div class="tbl-wrap" style="padding:12px">
        <div class="usr-row" style="border:none">
          <input id="nu-name" placeholder="שם מלא">
          <input id="nu-email" placeholder="אימייל" dir="ltr">
          <input id="nu-pass" placeholder="סיסמה (8 תווים+)" dir="ltr">
          <select id="nu-job"><option value="">— תפקיד —</option>${JOB_TITLES.map(j=>`<option>${j}</option>`).join('')}</select>
          <select id="nu-role">${ROLE_OPTS.filter(r=>r[0]!=='pending').map(([v,l])=>`<option value="${v}" ${v==='rep'?'selected':''}>${l}</option>`).join('')}</select>
          <button class="chip" onclick="createUser()">יצירה</button>
        </div>
        <div class="err" id="nu-err"></div>
      </div>`;
  } else if(SET_VIEW==='teams'){
    body = `<h2 class="sec" style="margin-top:0">צוותי לוגיסטיקה (צבע · שם · פעיל)</h2>
    <div class="tbl-wrap" style="padding:12px">
      ${OTEAMS.map(t=>`<div style="display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap">
        <input type="color" value="${esc(t.color||'#64748b')}" id="tc-${t.id}" ${admin?'':'disabled'} style="width:42px;height:34px;border:none;background:none;padding:0">
        <input value="${esc(t.name)}" id="tn-${t.id}" ${admin?'':'disabled'} style="flex:1;min-width:120px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-family:inherit">
        <label style="font-size:12px;display:flex;align-items:center;gap:4px"><input type="checkbox" id="ta-${t.id}" ${t.active!==false?'checked':''} ${admin?'':'disabled'}>פעיל</label>
        ${admin?`<button class="chip" onclick="saveTeam('${t.id}')">שמירה</button>`:''}
      </div>`).join('')||'<div class="empty">אין צוותים</div>'}
    </div>`;
  } else if(SET_VIEW==='texts'){
    /* טקסטים מקובצים לפי קטגוריה (הערות 5–6, סבב 3) */
    const tbox = s => { const i=OSET.indexOf(s); return `<div class="tbl-wrap" style="padding:12px;margin-bottom:10px">
      <b style="font-size:13px">${esc(s.key)}</b>
      <textarea id="sv-${i}" ${admin?'':'disabled'} style="width:100%;min-height:90px;margin-top:6px;padding:10px;border:1px solid var(--line);border-radius:8px;font-family:inherit;font-size:13.5px;box-sizing:border-box">${esc(s.value||'')}</textarea>
      ${admin?`<button class="chip" onclick="saveSetting(${i})">שמירה</button>`:''}
    </div>`; };
    const groups=[
      ['📄 פרוטוקול התקנה', s=>String(s.key).startsWith('protocol')],
      ['✅ דוח אישור תקינות ציוד (150)', s=>String(s.key).startsWith('report150')],
      ['💬 הודעות וואטסאפ', s=>String(s.key).startsWith('wa')],
    ];
    const used=new Set();
    let gHtml='';
    for(const [title,match] of groups){
      const items=OSET.filter(s=>match(s)&&!used.has(s.key));
      items.forEach(s=>used.add(s.key));
      if(items.length) gHtml+=`<h2 class="sec">${title}</h2>`+items.map(tbox).join('');
    }
    const rest=OSET.filter(s=>!used.has(s.key));
    if(rest.length) gHtml+=`<h2 class="sec">⚙️ אחר</h2>`+rest.map(tbox).join('');
    body = `<h2 class="sec" style="margin-top:0">טקסטים ומסמכים — מקובץ לפי קטגוריה</h2>`+(gHtml||'<div class="empty">אין טקסטים מוגדרים</div>');

    const lastSync = $('#lastSync').textContent || '—';
    body = `<h2 class="sec" style="margin-top:0">כללי</h2>

      </div>

  }
  el.innerHTML = `<div class="set-layout">
    <div class="set-nav">${cats.map(([v,l])=>`<button class="${SET_VIEW===v?'active':''}" onclick="setMode('${v}')">${l}<span class="nav-arrow" style="color:#94a3b8">‹</span></button>`).join('')}</div>
    <div class="set-body">${body}</div>
  </div>`;
  if(SET_VIEW==='users' && isAdmin) renderUsers();
}
async function renderUsers(){
  const box=$('#usersBox'); if(!box) return;
  const { data, error } = await sb.schema('core').from('profiles').select('id,full_name,email,role,dashboard,job_title,active').order('full_name',{ascending:true});
  if(error){ box.innerHTML='<div class="empty">שגיאה בטעינת המשתמשים: '+esc(error.message)+'</div>'; return; }
  SET_USERS=data||[];
  box.innerHTML = `<div class="usr-row" style="font-weight:800;color:var(--navy);border-bottom:2px solid var(--line)">
      <span>משתמש</span><span>הרשאה</span><span>דשבורד</span><span>תפקיד</span><span>פעיל</span><span></span></div>` +
    SET_USERS.map(u=>`<div class="usr-row">
      <span><b>${esc(u.full_name||'—')}</b><br><small style="color:#94a3b8" dir="ltr">${esc(u.email)}</small></span>
      <select id="ur-${u.id}">${ROLE_OPTS.map(([v,l])=>`<option value="${v}" ${v===u.role?'selected':''}>${l}</option>`).join('')}</select>
      <select id="ud-${u.id}">${DASH_OPTS.map(([v,l])=>`<option value="${v}" ${v===(u.dashboard||'')?'selected':''}>${l}</option>`).join('')}</select>
      <select id="uj-${u.id}"><option value="">—</option>${JOB_TITLES.map(j=>`<option ${j===u.job_title?'selected':''}>${j}</option>`).join('')}</select>
      <label style="display:flex;align-items:center;gap:4px;font-size:12px"><input type="checkbox" id="ua-${u.id}" ${u.active!==false?'checked':''}>פעיל</label>
      <span style="display:flex;gap:5px;flex-wrap:wrap">
        <button class="chip" onclick="saveUser('${u.id}')">שמירה</button>
        <button class="chip" onclick="resetUserPass('${u.id}')" title="איפוס סיסמה">🔑</button>
        ${u.id!==ME.id?`<button class="chip" style="color:#c0392b" onclick="deleteUser('${u.id}')" title="מחיקת משתמש">🗑️</button>`:''}
      </span>
    </div>`).join('');
}
window.saveUser = async id=>{
  const upd={ role:$('#ur-'+id).value, dashboard:$('#ud-'+id).value||null, job_title:$('#uj-'+id).value||null, active:$('#ua-'+id).checked };
  const { error } = await sb.schema('core').from('profiles').update(upd).eq('id', id);
  if(error){ alert('שמירה נכשלה: '+error.message); return; }
  alert('המשתמש עודכן ✓');
  if(id===ME.id){ ME={...ME,...upd}; $('#sideRole').textContent=ME.job_title||'אזור אישי'; }
};
async function adminUsersFn(body){
  const { data:{ session } } = await sb.auth.getSession();
  const r = await fetch(SB_URL+'/functions/v1/orders-admin-users', {
    method:'POST', headers:{ 'authorization':'Bearer '+session.access_token, 'apikey':SB_KEY, 'content-type':'application/json' },
    body: JSON.stringify(body) });
  return r.json();
}
window.createUser = async ()=>{
  const err=$('#nu-err'); err.textContent='';
  const full_name=$('#nu-name').value.trim(), email=$('#nu-email').value.trim(), password=$('#nu-pass').value;
  if(!email.includes('@')||password.length<8){ err.textContent='נדרשים אימייל תקין וסיסמה של 8 תווים לפחות'; return; }
  const j = await adminUsersFn({ action:'create-user', email, password, full_name, role: $('#nu-role').value==='admin'?'admin':'manager' });
  if(j.error){ err.textContent=j.error; return; }
  /* עדכון הפרופיל המאוחד: הרשאה, תפקיד */
  try{ await sb.schema('core').from('profiles').update({ role:$('#nu-role').value, job_title:$('#nu-job').value||null, full_name, active:true }).eq('id', j.user_id); }catch(_e){}
  alert('המשתמש נוצר ✓');
  renderUsers(); $('#nu-name').value=''; $('#nu-email').value=''; $('#nu-pass').value='';
};
window.resetUserPass = async id=>{
  const u=(SET_USERS||[]).find(x=>x.id===id);
  const password=prompt('סיסמה חדשה עבור '+((u&&u.email)||'המשתמש')+' (8 תווים לפחות):');
  if(!password) return;
  if(password.length<8){ alert('סיסמה קצרה מדי'); return; }
  const j = await adminUsersFn({ action:'reset-password', user_id:id, password });
  alert(j.error?('שגיאה: '+j.error):'הסיסמה אופסה ✓');
};
window.deleteUser = async id=>{
  const u=(SET_USERS||[]).find(x=>x.id===id);
  if(!confirm('למחוק את המשתמש '+((u&&u.email)||'')+'? פעולה זו אינה הפיכה.')) return;
  const j = await adminUsersFn({ action:'delete-user', user_id:id });
  if(j.error){ alert('שגיאה: '+j.error); return; }
  try{ await sb.schema('core').from('profiles').delete().eq('id', id); }catch(_e){}
  alert('המשתמש נמחק');
  renderUsers();
};
window.saveTeam = async id=>{
  const upd={ name:$('#tn-'+id).value.trim(), color:$('#tc-'+id).value, active:$('#ta-'+id).checked };
  const { error } = await sb.schema('ord').from('teams').update(upd).eq('id', id);
  if(error){ alert('שמירה נכשלה: '+error.message); return; }
  const t=OTEAMS.find(x=>x.id===id); if(t) Object.assign(t,upd);
  renderCal(); renderOps(); alert('הצוות נשמר ✓');
};
window.saveSetting = async i=>{
  const s=OSET[i]; const v=$('#sv-'+i).value;
  const { error } = await sb.schema('ord').from('settings').update({value:v}).eq('key', s.key);
  if(error){ alert('שמירה נכשלה: '+error.message); return; }
  s.value=v; alert('נשמר ✓ — ישתקף במסמכים הבאים שיישלחו');
};

    b=document.createElement('div'); b.id='loadErr';

  oldBoot(true);   /* טעינה טרייה מהמערכת הישנה בכל רענון */
  try{
  _q = await Promise.all([
    sb.schema('crm').from('leads').select('id,full_name,company,phone,email,city,source,status,sub_status,reject_reason,irrelevant_reason,customer_type,customer_id,created_at').order('created_at',{ascending:false}).limit(10000),
    sb.schema('core').from('customers').select('id,name,phone,email,priority_id,status,customer_type,price_group,city,address,region,truck_access,elevator,freight_elevator,logistics_notes').order('created_at',{ascending:false}).limit(10000),
    sb.schema('crm').from('tasks').select('id,name,status,value_tag,category,due_at,closed_at,linked_type,linked_id,owner_id').order('due_at',{ascending:true}).limit(10000),
    sb.schema('crm').from('deals').select('id,name,stage,amount,quote_status,irrelevant_reason,priority_quote_id,customer_id,contact_id,send_channel,sign_link,approved_at,closed_at,created_at').order('created_at',{ascending:false}).limit(10000),
    sb.schema('crm').from('meetings').select('id,subject,status,meet_date,start_time,end_time,meet_type,location,teams_link,linked_type,linked_id').order('meet_date',{ascending:false}).limit(10000),
    sb.schema('core').from('contacts').select('id,full_name,phone,office_phone,email,role,customer_id').order('full_name',{ascending:true}).limit(10000),
    sb.schema('crm').from('payments').select('id,customer_id,deal_id,status,due_date,total_amount,paid_amount,notes').order('due_date',{ascending:false}).limit(10000),
    oldPart('orders'),          /* ישירות ממערכת ההזמנות הישנה — מקור האמת */
    oldPart('service_calls'),   /* ישירות ממערכת ההזמנות הישנה — מקור האמת */
    sb.schema('ord').from('teams').select('id,name,color,active,sort_order').order('sort_order',{ascending:true}),
    oldPart('sync_log'),        /* ישירות ממערכת ההזמנות הישנה — מקור האמת */
    sb.schema('ord').from('inv_items').select('partname,partdes,price,family,qty,barcode,image_url,image_full,erp_status,unit,cost,supplier,sales_total,ord,pord,bals,install_price_iron,install_price_contractor,pallet_load_factor').order('partname',{ascending:true}).limit(10000),
    sb.schema('ord').from('protocols').select('id,order_id,call_id,order_number,customer_name,phone,doc_type,status,sent_at,signed_at,signer_name,token').order('sent_at',{ascending:false}).limit(10000),
    sb.schema('ord').from('settings').select('key,value').order('key',{ascending:true})
  ]);
  }catch(e){ console.error('טעינת הנתונים נכשלה לגמרי', e); loadErrBanner(['החיבור לשרת']); return; }
  const [l,c,t,d,m,k,p,o,sc,tm,sy,sk,pr,st] = _q;
  /* תיקון ממצא 11 — שאילתה שנכשלה כבר לא מתחזה ל"אין נתונים" */
  const _bad = _q.map((r,i)=>(r&&r.error)?{n:LOAD_NAMES[i],e:r.error}:null).filter(Boolean);
  if(_bad.length){ _bad.forEach(b=>console.error('טעינת נתונים נכשלה —', b.n, b.e)); loadErrBanner(_bad.map(b=>b.n)); }
  else loadErrBanner(null);
  LEADS = l.data||[]; CUSTS = c.data||[]; TASKS = t.data||[]; DEALS = d.data||[]; MEETS = m.data||[]; CONTS = k.data||[]; PAYS = p.data||[];
  ORDS = o.data||[]; SCALLS = sc.data||[]; OTEAMS = tm.data||[]; SKUS = sk.data||[]; PROTS = pr.data||[]; OSET = st.data||[];
  const lastOk = (sy.data||[]).find(r=>r.ok && (!r.details || !r.details.fn || r.details.fn==='priority-sync'));
  $('#lastSync').textContent = lastOk ? 'סנכרון אחרון: ' + new Date(lastOk.ran_at).toLocaleString('he-IL',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}) : '';
  renderAllViews();
}
/* ציור כל המסכים מחדש — משמש גם במעבר בין תצוגת טבלה לכרטיסים (תיקון ממצא 24) */
function renderAllViews(){
  renderStats(); renderToday(); renderLeads(); renderCustomers(); renderTasks(); renderDeals(); renderMeets(); renderConts(); renderPays(); renderOrdersTools(); renderOrders(); renderSkuTools(); renderSkus(); renderLogi(); renderDocs(); renderOps();
}
function capped(list, rowFn, emptyMsg){
  if(!list.length) return `<div class="empty">${emptyMsg}</div>`;
  const html = list.slice(0,200).map(rowFn).join('');
  return list.length>200 ? html+`<div class="more">מציג 200 מתוך ${list.length} — חדד את החיפוש</div>` : html;
}

function taskRow(t){
  const overdue = t.status!=='הושלם' && t.due_at && new Date(t.due_at) < new Date();
  const due = t.due_at ? new Date(t.due_at).toLocaleString('he-IL',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}) : '—';
  /* סטטוס משימה — הרשימה מהמאנדיי (הערה 17) */
  const stSel = `<select onclick="event.stopPropagation()" onchange="setTaskStatus('${t.id}',this.value)"
    style="width:auto;padding:5px 8px;font-size:12.5px;border-radius:99px;border:1.5px solid ${TASK_ST_COLORS[t.status]||'#e2e8f0'};color:${TASK_ST_COLORS[t.status]&&t.status!=='חדש'?onWhite(TASK_ST_COLORS[t.status]):'#475569'};font-weight:700">
    ${TASK_STATUSES.map(s=>`<option ${s===t.status?'selected':''}>${s}</option>`).join('')}</select>`;
  return `<div class="lead">
    <div><div class="nm" style="${t.status==='הושלם'?'text-decoration:line-through;color:#94a3b8':''}">${esc(t.name)}</div>
    <div class="meta" style="${overdue?'color:#c0392b;font-weight:600':''}">יעד: ${due}${overdue?' · באיחור!':''}${t.category?' · '+esc(t.category):''}</div></div>
    <div style="display:flex;gap:6px;align-items:center">${stSel}
    ${t.status!=='הושלם'?`<button class="ghost" style="padding:8px 12px;width:auto" onclick="doneTask('${t.id}')">בוצע ✓</button>`:''}</div>
  </div>`;
}
window.setTaskStatus = async (id, status)=>{
  const patch = { status };
  if(status==='הושלם') patch.closed_at = new Date().toISOString();
  const { error } = await sb.schema('crm').from('tasks').update(patch).eq('id', id);
  if(error){ alert('עדכון הסטטוס נכשל: '+error.message); return; }
  const t=TASKS.find(x=>x.id===id); if(t) Object.assign(t,patch);
  renderTasks(); renderToday(); renderStats();
};
function myOpenTodayTasks(){
  const eod = new Date(); eod.setHours(23,59,59,999);
  return TASKS.filter(t=> t.status!=='הושלם' && t.due_at && new Date(t.due_at) <= eod);
}
function taskTable(list){
  if(!list.length) return '<div class="empty">אין משימות פתוחות 🎉</div>';
  const rows=list.slice(0,300).map((t,i)=>{
    const overdue = t.status!=='הושלם' && t.due_at && new Date(t.due_at) < new Date();
    const due = t.due_at ? new Date(t.due_at).toLocaleString('he-IL',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}) : '—';
    return `<tr>
      <td class="rownum">${i+1}</td>
      <td style="max-width:340px"><b style="${t.status==='הושלם'?'text-decoration:line-through;color:#94a3b8':''}">${esc(t.name)}</b></td>
      <td>${esc(t.category||'—')}</td>
      <td style="${overdue?'color:#c0392b;font-weight:700':''}">${due}${overdue?' · באיחור!':''}</td>
      <td>${ieSel('task',t.id,'status',TASK_STATUSES,t.status,{mdColors:TASK_ST_COLORS})}</td>
      <td>${t.status!=='הושלם'?`<button class="chip" onclick="event.stopPropagation();doneTask('${t.id}')">בוצע ✓</button>`:'✓'}</td>
    </tr>`;}).join('');
  return `<div class="tbl-wrap"><table class="tbl"><thead><tr><th class="rownum">#</th><th>משימה</th><th>סיווג</th><th>יעד</th><th>סטטוס</th><th></th></tr></thead><tbody>${rows}</tbody></table></div><div class="count-line2">מציג ${Math.min(list.length,300)} מתוך ${list.length} משימות</div>`;
}
function renderTasks(){
  const q=($('#taskSearch').value||'').trim();
  let list=TASKS.filter(t=>t.status!=='הושלם');
  if(q) list=list.filter(t=>(t.name||'').includes(q));
  $('#tasks-list').innerHTML = wideScreen() ? taskTable(list) : capped(list, taskRow, q?'לא נמצאו משימות':'אין משימות פתוחות 🎉');
}
window.doneTask = async (id)=>{
  const { error } = await sb.schema('crm').from('tasks').update({ status:'הושלם', closed_at: new Date().toISOString() }).eq('id', id);
  if(error){ console.error(error); return; }
  await loadLeads();
};

$('#t-save').onclick = async ()=>{

  if(!name||!d){ $('#t-err').textContent='שם ותאריך יעד חובה'; return; }

const remaining = p => Math.max(0, Number(p.total_amount||0) - Number(p.paid_amount||0));
function payChips(){
  const open = PAYS.filter(p=>p.status!=='שולמה');
  const paid = PAYS.filter(p=>p.status==='שולמה');
  const sumRem = open.reduce((a,p)=>a+remaining(p),0);
  $('#pay-chips').innerHTML = `
    <button class="chip ${PAY_FILTER==='open'?'active':''}" onclick="setPayFilter('open')">לחיוב ${open.length} <small>· יתרה ${shekel(sumRem)}</small></button>
    <button class="chip ${PAY_FILTER==='paid'?'active':''}" onclick="setPayFilter('paid')">שולם ${paid.length}</button>
    <button class="chip ${PAY_FILTER==='all'?'active':''}" onclick="setPayFilter('all')">הכל ${PAYS.length}</button>`;
}
window.setPayFilter = f => { PAY_FILTER = f; renderPays(); };

const ACTIVE_ORD = o => !['הושלם','בוטל','מבוטלת'].includes(o.order_status);
const ORDER_SORTS = [['','מס\' הזמנה (חדשה ראשונה)'],['order_date','תאריך הזמנה (חדש ראשון)'],['scheduled','תאריך מתואם (קרוב ראשון)'],['supply_end','תאריך סיום אספקה'],['customer','שם לקוח (א-ב)'],['city','עיר (א-ב)'],['status','סטטוס הזמנה']];

function filteredOrders(){
  const t=todayStr(), wk=addDaysIso(t,7);
  let list=ORDS.slice();
  if(OF.chip==='active') list=list.filter(ACTIVE_ORD);
  else if(OF.chip==='nocontact') list=list.filter(o=>ACTIVE_ORD(o)&&o.contact_status==='טרם נוצר קשר');
  else if(OF.chip==='nosched') list=list.filter(o=>ACTIVE_ORD(o)&&(!o.team||!o.scheduled_date));
  else if(OF.chip==='protocol') list=list.filter(o=>ACTIVE_ORD(o)&&['נוצר קשר ראשוני לפרוטוקול','פרוטוקול חתום ממתין לתיאום'].includes(o.contact_status));
  else if(OF.chip==='week') list=list.filter(o=>ACTIVE_ORD(o)&&o.scheduled_date&&o.scheduled_date>=t&&o.scheduled_date<wk);
  else if(OF.chip==='done') list=list.filter(o=>o.order_status==='הושלם');
  if(OF.team) list=list.filter(o=> OF.team==='__none__' ? !o.team : o.team===OF.team);
  if(OF.region) list=list.filter(o=>o.region===OF.region);
  if(OF.status) list=list.filter(o=>o.order_status===OF.status);
  if(OF.contact) list=list.filter(o=>o.contact_status===OF.contact);
  if(OF.q){ const q=OF.q.toLowerCase(); list=list.filter(o=>[o.order_number,o.customer_name,o.phone,o.city,o.contact_name].some(v=>v&&String(v).toLowerCase().includes(q))); }
  if(OF.dateFrom) list=list.filter(o=>o.scheduled_date && o.scheduled_date>=OF.dateFrom);
  if(OF.dateTo) list=list.filter(o=>o.scheduled_date && o.scheduled_date<=OF.dateTo);
  const cmpStr=(a,b,k,dir)=>{ const va=a[k]||'', vb=b[k]||''; if(!va&&!vb) return 0; if(!va) return 1; if(!vb) return -1; return dir*String(va).localeCompare(String(vb)); };
  switch(OF.sort){
    case 'order_date': list.sort((a,b)=>cmpStr(a,b,'order_date',-1)); break;
    case 'scheduled': list.sort((a,b)=>cmpStr(a,b,'scheduled_date',1)); break;
    case 'supply_end': list.sort((a,b)=>cmpStr(a,b,'supply_end_date',1)); break;
    case 'customer': list.sort((a,b)=>cmpStr(a,b,'customer_name',1)); break;
    case 'city': list.sort((a,b)=>cmpStr(a,b,'city',1)); break;
    case 'status': list.sort((a,b)=>ORDER_STATUSES.indexOf(a.order_status)-ORDER_STATUSES.indexOf(b.order_status)); break;
    default: list.sort((a,b)=>String(b.order_number||'').localeCompare(String(a.order_number||'')));
  }
  return list;
}
function ordChips(){
  const act=ORDS.filter(ACTIVE_ORD), t=todayStr(), wk=addDaysIso(t,7);
  const scOpen=SCALLS.filter(s=>!['הושלם','הושלמה','בוטלה','סגורה'].includes(s.status));
  const chips=[
    ['active','פעילות',act.length],
    ['nocontact','טרם נוצר קשר',act.filter(o=>o.contact_status==='טרם נוצר קשר').length],
    ['nosched','ממתין לשיבוץ',act.filter(o=>!o.team||!o.scheduled_date).length],
    ['protocol','פרוטוקול',act.filter(o=>['נוצר קשר ראשוני לפרוטוקול','פרוטוקול חתום ממתין לתיאום'].includes(o.contact_status)).length],
    ['week','השבוע הקרוב',act.filter(o=>o.scheduled_date&&o.scheduled_date>=t&&o.scheduled_date<wk).length],
    ['done','הושלמו',ORDS.filter(o=>o.order_status==='הושלם').length],
    ['calls','קריאות שירות',scOpen.length],
    ['all','הכל',ORDS.length],
  ];
  $('#ord-chips').innerHTML = chips.map(([k,l,n])=>`<button class="chip ${OF.chip===k?'active':''}" onclick="setOrdFilter('${k}')">${l} <span class="n">${n}</span></button>`).join('');
}

function waTpl(key,fallback){ const r=OSET.find(x=>x.key===key); return (r&&r.value)||fallback; }
function waFill(tpl,v){
  return String(tpl||'')
    .replace(/\{name\}|\{שם\}/g, v.name||'')
    .replace(/\{date\}|\{תאריך\}/g, v.date||'')
    .replace(/\{time\}|\{שעה\}/g, v.time||'')
    .replace(/\{slot\}|\{שעות\}/g, v.time?(' '+v.time):'')
    .replace(/\{link\}|\{קישור\}/g, v.link||'')
    .replace(/\\n/g, '\n')
    .replace(/ ?בשעה(?=[ \t]*([.,!?]|\n|$))/g, '')
    .replace(/[ \t]+([,.!?])/g, '$1')
    .replace(/[ \t]{2,}/g, ' ')
    .trim();
}

async function loadOrderItems(orderNumber){
  const box=$('#orderItemsBox'); if(!box) return;
  try{
    const { data: res, error } = await oldCall('order_items', { order_number: orderNumber });
    if(error) throw new Error(error.message);
    const rows = (res && res.items) || [];
    if(!box.isConnected) return;
    /* אותה שורה עשויה להופיע מכמה ריצות סנכרון — מציגים את העדכני לכל kline */
    const byLine={};
    (rows||[]).forEach(r=>{ const k=r.kline; if(!byLine[k]||String(r.synced_at||'')>String(byLine[k].synced_at||'')) byLine[k]=r; });
    const list=Object.values(byLine).sort((a,b)=>(a.kline||0)-(b.kline||0));
    if(!list.length){ box.innerHTML='<div class="items-empty">אין שורות ציוד להזמנה זו</div>'; return; }
    const totalQty=list.reduce((s,r)=>s+(Number(r.qty)||0),0);
    box.innerHTML=`<div class="items-wrap"><table class="items-tbl">
      <thead><tr><th style="width:34px">#</th><th style="width:130px">מק"ט</th><th>תיאור</th><th style="width:70px">כמות</th></tr></thead>
      <tbody>${list.map((r,i)=>`<tr>
        <td class="rn">${i+1}</td>
        <td dir="ltr" class="sku">${esc(r.partname||'')}</td>
        <td>${esc(r.partdes||'')}</td>
        <td class="qty">${r.qty==null?'':Number(r.qty).toLocaleString('he-IL')}</td>
      </tr>`).join('')}</tbody>
    </table></div>
    <div class="count-line">${list.length} שורות · סה"כ ${totalQty.toLocaleString('he-IL')} יח'</div>`;
  }catch(err){ console.error(err); box.innerHTML='<div class="items-empty">לא ניתן לטעון את פירוט ההזמנה</div>'; }
}

/* ===== עסקאות ===== */
const STAGES = ['תהליך חדש','נשלחה הצעת מחיר ראשונית','נשלחה הצעת מחיר לחתימה','תואמה פגישת המשך','אושר ע"י לקוח ממתין לתשלום','הושלם','לא רלוונטי'];
const ACTIVE_STAGES = STAGES.slice(0,5);
let DEAL_FILTER = 'active';
const shekel = n => '₪' + Math.round(Number(n||0)).toLocaleString('he-IL');
const stageClass = s => s==='הושלם' ? 'st-rel' : (s==='לא רלוונטי' ? 'st-no' : (s==='תהליך חדש' ? 'st-new' : 'st-def'));
/* צבעי שלבי עסקה — כמו במאנדיי (הערה 18) */
const DEAL_ST_COLORS = {'תהליך חדש':'#ffcb00','נשלחה הצעת מחיר ראשונית':'#cab641','נשלחה הצעת מחיר לחתימה':'#579bfc','תואמה פגישת המשך':'#66ccff','אושר ע"י לקוח ממתין לתשלום':'#4eccc6','הושלם':'#037f4c','לא רלוונטי':'#bb3354'};

function dealChips(){
  const sum = list => list.reduce((a,d)=>a+Number(d.amount||0),0);
  const act = DEALS.filter(d=>ACTIVE_STAGES.includes(d.stage));
  let html = `<button class="chip ${DEAL_FILTER==='active'?'active':''}" onclick="setDealFilter('active')">פעילות ${act.length} <small>· ${shekel(sum(act))}</small></button>`;
  for(const s of STAGES){
    const list = DEALS.filter(d=>d.stage===s);
    if(!list.length) continue;
    html += `<button class="chip ${DEAL_FILTER===s?'active':''}" onclick="setDealFilter('${s.replace(/"/g,'&quot;')}')">${s} ${list.length} <small>· ${shekel(sum(list))}</small></button>`;
  }
  html += `<button class="chip ${DEAL_FILTER==='all'?'active':''}" onclick="setDealFilter('all')">הכל ${DEALS.length}</button>`;

let MEET_FILTER = 'week';

const todayStr = () => { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
function meetFilterList(){
  const t = todayStr();
  const in7 = new Date(Date.now()+7*864e5); const w = in7.getFullYear()+'-'+String(in7.getMonth()+1).padStart(2,'0')+'-'+String(in7.getDate()).padStart(2,'0');
  if(MEET_FILTER==='today') return MEETS.filter(m=>m.meet_date===t);
  if(MEET_FILTER==='week') return MEETS.filter(m=>m.meet_date>=t && m.meet_date<=w).sort((a,b)=>(a.meet_date||'').localeCompare(b.meet_date||''));
  if(MEET_FILTER==='future') return MEETS.filter(m=>m.meet_date>=t).sort((a,b)=>(a.meet_date||'').localeCompare(b.meet_date||''));
  return MEETS;
}
function meetChips(){
  const t = todayStr();

window.saveLead = async (id)=>{
  const l = LEADS.find(x=>x.id===id); if(!l) return;
  const st=$('#l-status').value, sub=$('#l-sub')?$('#l-sub').value||null:null;
  /* תיקון ממצא 22 — החלפת סטטוס מנקה את תתי-הסטטוס שאינם שייכים לו */
  const upd={ status:st, source:$('#l-source').value||null,
    sub_status: st==='רלוונטי'?sub:null,
    reject_reason: st==='סירוב'?sub:null,
    irrelevant_reason: st==='לא רלוונטי'?sub:null };
  const { error } = await sb.schema('crm').from('leads').update(upd).eq('id', id);
  if(error){ $('#l-err').textContent='השמירה נכשלה — '+error.message; return; }
  Object.assign(l, upd);
  closeCards(); renderLeads(); renderToday(); renderStats();
};

window.convertLead = async (id)=>{
  const res = $('#convResult'); res.innerHTML='<div class="note">מבצע… פותח לקוח והצעה בפריוריטי…</div>';
  const { data, error } = await sb.functions.invoke('crm-convert-lead', { body:{ lead_id:id } });
  if(error || (data && data.ok===false)){
    res.innerHTML = `<div class="note" style="color:#c0392b">שגיאה: ${esc((data&&data.error)||error?.message||'לא ידוע')}</div>`; return;
  }
  res.innerHTML = `<div class="ok-box">✅ הומר בהצלחה!<br>לקוח בפריוריטי: <b>${esc(data.custname||'—')}</b><br>הצעת מחיר: <b>${esc(data.cprofnum||'—')}</b></div>`;
  await loadLeads();
};

function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
/* בריחה בטוחה לתוך מחרוזת ג'אווהסקריפט בתוך onclick — מק"טים עם גרש (תיקון ממצא 20) */
function jsq(s){ return esc(String(s??'').replace(/\\/g,'\\\\').replace(/'/g,"\\'")); }
/* קריאת מספר מהמשתמש — פסיק עשרוני ומפריד אלפים (תיקון ממצא 21). מחזיר null לריק, undefined ללא-תקין */
function numIn(raw){
  let v=String(raw==null?'':raw).trim().replace(/[\s‎‏₪]/g,'');
  if(v==='') return null;
  const lc=v.lastIndexOf(','), ld=v.lastIndexOf('.');
  if(lc>-1 && ld>-1){ v = (lc>ld) ? v.replace(/\./g,'').replace(/,/g,'.') : v.replace(/,/g,''); }
  else if(lc>-1){ const p=v.split(','); v = (p.length===2 && p[1].length!==3) ? p[0]+'.'+p[1] : v.replace(/,/g,''); }
  if(!/^-?(\d+\.?\d*|\.\d+)$/.test(v)) return undefined;
  const x=Number(v);
  return isFinite(x) ? x : undefined;
}

/* ===== מסך חתימה ציבורי (?sign=TOKEN) ===== */
const SIGN_FN = SB_URL + '/functions/v1/sign-quote';
let signHasInk = false;
async function renderSignView(token){
  document.getElementById('login').classList.add('hidden');
  document.getElementById('signview').classList.remove('hidden');
  const body = document.getElementById('signbody');
  let info;
  try{ info = await (await fetch(SIGN_FN + '?token=' + encodeURIComponent(token))).json(); }
  catch{ body.innerHTML = '<div class="empty">שגיאת תקשורת — נסו שוב</div>'; return; }
  if(info.status === 'נחתם'){ body.innerHTML = `<div class="ok-box" style="text-align:center;font-size:16px;">✅ ההצעה כבר נחתמה<br><small>${new Date(info.signed_at).toLocaleString('he-IL')}</small></div>`; return; }
  if(!info.ok){ body.innerHTML = `<div class="empty">${esc(info.error||'הקישור אינו תקין')}</div>`; return; }
  const d = info.deal || {};
  body.innerHTML = `
    <div style="background:#fff;border-radius:14px;padding:18px;box-shadow:0 1px 3px rgba(0,0,0,.08);">
      <div class="row"><span class="k">לקוח</span><span class="v">${esc(d.customer_name||d.name||'—')}</span></div>
      ${d.quote_id?`<div class="row"><span class="k">הצעת מחיר</span><span class="v">${esc(d.quote_id)}</span></div>`:''}
      ${d.amount?`<div class="row"><span class="k">סכום (לפני מע"מ)</span><span class="v">₪${Number(d.amount).toLocaleString('he-IL')}</span></div>`:''}
      <div class="field" style="margin-top:16px;"><label>שם מלא של החותם *</label><input id="sg-name"></div>
      <label style="display:block;font-size:13px;color:#475569;margin-bottom:6px;">חתימה *</label>
      <canvas id="sg-canvas" width="460" height="170" style="width:100%;height:170px;border:1.5px dashed var(--line);border-radius:10px;background:#fff;touch-action:none;"></canvas>
      <button class="ghost" id="sg-clear" style="width:auto;padding:8px 14px;margin-top:8px;">ניקוי חתימה</button>
      <div class="actions">
        <button class="btn green" id="sg-submit">אישור ההצעה וחתימה</button>
      </div>
      <div class="err" id="sg-err"></div>
      <div class="note">בלחיצה על הכפתור אני מאשר/ת את הצעת המחיר. החתימה נשמרת עם חותמת זמן ומזהה מסמך מאובטח.</div>
    </div>`;
  const cv = document.getElementById('sg-canvas'), ctx = cv.getContext('2d');
  ctx.lineWidth = 2.2; ctx.lineCap = 'round'; ctx.strokeStyle = '#0b2239';
  let drawing = false;
  const pos = e => { const r = cv.getBoundingClientRect(); const p = e.touches? e.touches[0] : e;
    return { x: (p.clientX - r.left) * (cv.width / r.width), y: (p.clientY - r.top) * (cv.height / r.height) }; };
  const start = e => { drawing = true; const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); e.preventDefault(); };
  const move = e => { if(!drawing) return; const p = pos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); signHasInk = true; e.preventDefault(); };
  const end = () => { drawing = false; };
  cv.addEventListener('mousedown', start); cv.addEventListener('mousemove', move); window.addEventListener('mouseup', end);
  cv.addEventListener('touchstart', start, {passive:false}); cv.addEventListener('touchmove', move, {passive:false}); cv.addEventListener('touchend', end);
  document.getElementById('sg-clear').onclick = () => { ctx.clearRect(0,0,cv.width,cv.height); signHasInk = false; };
  document.getElementById('sg-submit').onclick = async () => {
    const err = document.getElementById('sg-err'); err.textContent = '';
    const name = document.getElementById('sg-name').value.trim();
    if(!name){ err.textContent = 'נא למלא שם מלא'; return; }
    if(!signHasInk){ err.textContent = 'נא לחתום במסגרת'; return; }
    document.getElementById('sg-submit').disabled = true;
    try{
      const r = await (await fetch(SIGN_FN, { method:'POST', headers:{'content-type':'application/json'},
        body: JSON.stringify({ token, signer_name: name, signature_data: cv.toDataURL('image/png') }) })).json();
      if(!r.ok){ err.textContent = r.error || 'שגיאה בחתימה'; document.getElementById('sg-submit').disabled = false; return; }
      body.innerHTML = `<div class="ok-box" style="text-align:center;font-size:16px;line-height:1.8;">✅ ההצעה אושרה ונחתמה בהצלחה!<br>תודה רבה, ניצור קשר בהמשך.<br><small style="color:#4d7c62;">מזהה מסמך: ${r.doc_hash.slice(0,16)}…</small></div>`;
    }catch{ err.textContent = 'שגיאת תקשורת — נסו שוב'; document.getElementById('sg-submit').disabled = false; }
  };
}

/* ===== יצירת קישור חתימה מכרטיס עסקה (צוות) ===== */
window.createSignLink = async (dealId)=>{
  const box = document.getElementById('signlink-box'); if(box) box.innerHTML = '<div class="note">יוצר קישור…</div>';
  const { data, error } = await sb.schema('crm').from('sign_requests').insert({ deal_id: dealId, created_by: ME.id }).select('token').single();
  if(error || !data){ if(box) box.innerHTML = '<div class="note" style="color:#c0392b">שגיאה ביצירת הקישור</div>'; console.error(error); return; }
  const link = new URL('?sign=' + data.token, location.href).href;
  if(box) box.innerHTML = `<div class="ok-box">🔗 קישור חתימה נוצר (תקף 14 יום):<br>
    <input id="sl-url" readonly value="${esc(link)}" style="width:100%;margin-top:8px;padding:10px;border:1px solid var(--line);border-radius:8px;font-size:13px;direction:ltr;">
    <button class="ghost" style="margin-top:8px;padding:8px 14px;" onclick="navigator.clipboard.writeText(document.getElementById('sl-url').value).then(()=>this.textContent='הועתק ✓')">העתקת הקישור</button>
    <div class="note" style="margin-top:8px;">שלחו את הקישור ללקוח בוואטסאפ/מייל. כשיחתום — העסקה תעבור אוטומטית ל"אושר ע"י לקוח ממתין לתשלום" ותיפתח רשומת גבייה.</div></div>`;
};

const SIGN_TOKEN = new URLSearchParams(location.search).get('sign');
if (SIGN_TOKEN) { renderSignView(SIGN_TOKEN); } else { boot(); }
