    <div><label>סטטוס הזמנה</label><select name="order_status" class="pilled ${STATUS_PILL[o.order_status]||''}" data-recolor>${ORDER_STATUSES.map(s=>`<option ${o.order_status===s?'selected':''}>${s}</option>`).join('')}</select></div>
    <div><label>יצרנו קשר?</label><select name="contact_status" class="pilled ${STATUS_PILL[o.contact_status]||''}" data-recolor>${CONTACT_STATUSES.map(s=>`<option ${o.contact_status===s?'selected':''}>${s}</option>`).join('')}</select></div>
    <div><label>עיר</label><input name="city" value="${esc(o.city||'')}" list="cityList"></div>
    <div><label>אזור גיאוגרפי <span class="src-tag">אוטומטי לפי עיר</span></label><select name="region"><option value=""></option>${REGIONS.map(r=>`<option ${o.region===r?'selected':''}>${r}</option>`).join('')}</select></div>
    <div><label>צוות</label><select name="team"><option value="">— לא משויך —</option>${S.teams.filter(t=>t.active||t.name===o.team).map(t=>`<option ${o.team===t.name?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div>
    <div class="span2"><label>👷 אנשי צוות משובצים <span class="hint-inline">— רק מהצוות שנבחר; עבודה אחת שייכת לצוות אחד בלבד</span></label>
      <div id="assignBox">${isNew?'<div class="assign-hint">השיבוץ ייפתח לאחר שמירת ההזמנה.</div>':assignBoxHTML(o.id,o.team)}</div></div>
    <div><label>תאריך מתואם</label><input type="date" name="scheduled_date" value="${esc(o.scheduled_date||'')}"></div>
    <div><label>מספר ימים</label><input type="number" name="days_count" min="1" value="${o.days_count||1}"></div>
    ${slotFieldHTML(o.time_slot)}
    <div class="span2"><label class="chk-line"><input type="checkbox" id="fridayOk" ${o.friday_ok?'checked':''}> <b>לאשר עבודה ביום שישי בהזמנה זו</b> <span class="hint">— שבוע העבודה הוא ראשון–חמישי; שישי ייפתח בלוח רק אם מנהל העבודה סימן כאן</span></label></div>
    <div class="form-sep">אספקה, מחסן ומסמכים</div>
    <div><label>זמן אספקה (ימים)</label><input type="number" name="supply_days" value="${o.supply_days??''}"></div>
    <div><label>תאריך סיום אספקה</label><input type="date" name="supply_end_date" value="${esc(o.supply_end_date||'')}"></div>
    <div><label>תעודת משלוח</label><select name="delivery_note" class="pilled ${o.delivery_note==='כן'?'p-green':'p-red'}" data-recolor>${YESNO.map(s=>`<option value="${s}" ${(o.delivery_note==='כן'?'כן':'לא')===s?'selected':''}>${s}</option>`).join('')}</select></div>
    <div><label>חשבונית</label><select name="invoice" class="pilled ${o.invoice==='כן'?'p-green':'p-red'}" data-recolor>${YESNO.map(s=>`<option value="${s}" ${(o.invoice==='כן'?'כן':'לא')===s?'selected':''}>${s}</option>`).join('')}</select></div>
    <div class="span2"><label>רשימת ציוד</label><textarea name="equipment_list" rows="2">${esc(o.equipment_list||'')}</textarea></div>
    <div class="span2"><label>הערות למחסן</label><textarea name="warehouse_notes" rows="2">${esc(o.warehouse_notes||'')}</textarea></div>
    <div class="span2"><label>דו שיח פנימי${SRC_TAG}</label><div class="dialog-box">${o.internal_dialog?esc(o.internal_dialog).replace(/\n/g,'<br>'):'<span class="dialog-empty">אין דו שיח פנימי בהזמנה זו</span>'}</div></div>
    ${!isNew?`<div class="form-sep">📦 פירוט ההזמנה${SRC_TAG}</div><div class="span4" id="orderItemsBox"><div class="items-loading">טוען פירוט הזמנה…</div></div>`:''}
    ${!isNew?techAreaHTML('order'):''}
  </div>
  <datalist id="cityList">${Object.keys(S.cities).slice(0,1500).map(c=>`<option value="${esc(c)}">`).join('')}</datalist>
  ${(function(){
    // תיבת "הזמנות פתוחות נוספות ללקוח" — בתחתית הכרטיס, לפני השמירה.
    // הזמנה נוספת עם אותה כתובת משלוח מסומנת בצבע בוהק — כדי לשלב אותן יחד בהובלה/התקנה.
    if(!others.length) return '';
    const norm=a=>String(a||'').trim().replace(/\s+/g,' ').toLowerCase();
    const myAddr=norm(o.address);
    const hasSame=myAddr && others.some(x=>norm(x.address)===myAddr);
    return `<div class="others-box"><div class="ob-title">📦 ללקוח יש עוד ${others.length===1?'הזמנה פתוחה':others.length+' הזמנות פתוחות'}:${hasSame?' <span class="same-tag">🚚 שימו לב — יש הזמנות לאותה כתובת משלוח, כדאי לשלב יחד!</span>':''}</div>
    ${others.map(x=>{
      const same=myAddr && norm(x.address)===myAddr;
      return `<div class="other-row ${same?'same-addr':''}" data-other="${x.id}"><b>${esc(x.order_number)}</b><span>${fmtDate(x.order_date)||'—'}</span><span>${x.items_count??'?'} פריטים</span>${x.address?`<span class="ob-note" title="כתובת משלוח: ${esc(x.address)}">🚚 ${esc(String(x.address).slice(0,30))}</span>`:''}${same?'<span class="same-tag">אותה כתובת משלוח!</span>':''}${x.order_notes?`<span class="ob-note" title="${esc(x.order_notes)}">📝 ${esc(String(x.order_notes).slice(0,40))}${String(x.order_notes).length>40?'…':''}</span>`:''}</div>`;
    }).join('')}
  </div>`;
  })()}
  <div id="protoList"></div>
  ${canDo('docs')?`<div class="wa-row">
    <a class="btn-wa off" id="waCoordBtn" href="#" target="_blank">📱 שלח וואטסאפ תיאום</a>
    <a class="btn-wa off" id="waProtoBtn" href="#" target="_blank">📄 שלח וואטסאפ פרוטוקול</a>
    <span class="settings-note" id="waHint" style="margin:0;align-self:center"></span>
  </div>`:''}
  <div class="modal-actions">
    ${canEdit()?`<button type="submit" class="btn btn-primary">💾 שמירה</button>`:''}
    <button type="button" class="btn btn-ghost" id="btnCancel">${canEdit()?'ביטול':'סגירה'}</button>
    ${isNew||!isAdmin()?'':`<button type="button" class="del" id="btnDelOrder">🗑️ מחיקת הזמנה</button>`}
  </div></form>`;
  openModal();
  if(!canEdit()) $('#orderForm').querySelectorAll('input,select,textarea').forEach(el=>el.disabled=true);
  document.querySelectorAll('#modalBox [data-other]').forEach(el=>el.addEventListener('click',()=>openOrderModal(el.dataset.other)));
  const form=$('#orderForm');
  bindAutoRegion(form); // אזור גיאוגרפי — תמיד אוטומטי לפי העיר
  if(!isNew) bindTechArea(o,'order'); // אזור מתקין — דוח אישור תקינות בסיום התקנה
  // כפתורי וואטסאפ חיים — מגיבים מיד לשינויים בכרטיס, עוד לפני שמירה:
  // תיאום: טלפון + תאריך מתואם · פרוטוקול: טלפון + משלב "נוצר קשר ראשוני לפרוטוקול"
  const PROTO_STAGES=['נוצר קשר ראשוני לפרוטוקול','פרוטוקול חתום ממתין לתיאום','תואם'];
  function updWaButtons(){
    const date=form.querySelector('[name=scheduled_date]').value;
    const slot=form.querySelector('[name=time_slot]').value;
    const cs=form.querySelector('[name=contact_status]').value;
    const coord=waLink(o.phone, fillTpl(S.settings.wa_coord,{name:o.customer_name,date,slot}));
    const proto=waLink(o.phone, fillTpl(S.settings.wa_protocol,{name:o.customer_name,date,slot}));
    const cOK=!!(coord&&date), pOK=!!(proto&&PROTO_STAGES.includes(cs));
    const bc=$('#waCoordBtn'), bp=$('#waProtoBtn'), h=$('#waHint');
    if(!bc) return;
    bc.classList.toggle('off',!cOK); bc.href=cOK?coord:'#';
    bp.classList.toggle('off',!pOK); // הלחיצה עצמה יוצרת קישור חתימה ופותחת וואטסאפ
    const hints=[];
    if(!o.phone) hints.push('אין טלפון ללקוח');
    else{
      if(!cOK) hints.push('תיאום — יש למלא תאריך מתואם');
      if(!pOK) hints.push('פרוטוקול — נפתח משלב "נוצר קשר ראשוני לפרוטוקול"');
    }
    h.textContent=hints.length?`(${hints.join(' · ')})`:'';
  }
  form.addEventListener('input',updWaButtons);
  form.addEventListener('change',updWaButtons);
  updWaButtons();
  // רשימת הפרוטוקולים שנשלחו להזמנה — כולל צפייה במסמך החתום
  function renderProtoList(){
    const box=$('#protoList'); if(!box) return;
    const list=(S.protocols||[]).filter(p=>!p.call_id && !(p.doc_type||'').includes('תקינות') && (p.order_id===o.id || (Array.isArray(p.covered_orders)&&p.covered_orders.some(c=>c.id===o.id))));
    if(!list.length){ box.innerHTML=''; return; }
    box.innerHTML=`<div class="others-box" style="background:#f6f5fb;border-color:#d9d5ee"><div class="ob-title" style="color:#4a3aa7">📄 פרוטוקולים לחתימה:</div>
      ${list.map(p=>`<div class="other-row" style="cursor:default">
        ${p.status==='נחתם'?`<span class="pill p-green">✍️ נחתם</span>`:`<span class="pill p-yellow">ממתין לחתימה</span>`}
        ${Array.isArray(p.covered_orders)&&p.covered_orders.length>1?`<span class="pill p-blue" title="${esc(p.covered_orders.map(c=>c.order_number).join(', '))}">מכסה ${p.covered_orders.length} הזמנות</span>`:''}
        <span class="ob-note">נשלח ${fmtDT(p.sent_at)}</span>
        ${p.signed_at?`<span class="ob-note">נחתם ${fmtDT(p.signed_at)}${p.signer_name?` ע"י ${esc(p.signer_name)}`:''}</span>`:''}
        ${p.status==='נחתם'
          ?`<a class="waze-btn" href="${SITE_BASE}/sign.html?view=${p.token}" target="_blank">📄 צפייה במסמך החתום</a>`
          :(canDo('docs')?`<a class="waze-btn" href="${signUrl(p.token)}" target="_blank">🔗 דף החתימה</a>`:`<span class="ob-note">ממתין לחתימת הלקוח</span>`)}
      </div>`).join('')}
    </div>`;
  }
  renderProtoList();
  // פירוט ההזמנה מפריוריטי — מק"ט, תיאור, כמות בלבד (הערה 7)
  (async function renderOrderItems(){
    const box=$('#orderItemsBox'); if(!box) return;
    try{
      const rows=await api.orderItems(o.order_number);
      if(!box.isConnected) return;
      if(!rows.length){ box.innerHTML='<div class="items-empty">אין שורות ציוד להזמנה זו</div>'; return; }
      const totalQty=rows.reduce((s,r)=>s+(Number(r.qty)||0),0);
      box.innerHTML=`<div class="items-wrap"><table class="items-tbl">
        <thead><tr><th style="width:34px">#</th><th style="width:130px">מק"ט</th><th>תיאור</th><th style="width:70px">כמות</th></tr></thead>
        <tbody>${rows.map((r,i)=>`<tr>
          <td class="rn">${i+1}</td>
          <td dir="ltr" class="sku">${esc(r.partname||'')}</td>
          <td>${esc(r.partdes||'')}${(r._boardDes&&r._boardDes!==r.partdes)?`<span class="mismatch" title="בבורד המק'טים רשום: ${esc(r._boardDes)}">≠ בורד</span>`:''}</td>
          <td class="qty">${r.qty==null?'':fmtQty(r.qty)}</td>
        </tr>`).join('')}</tbody>
      </table></div>
      <div class="count-line">${rows.length} שורות · סה"כ ${fmtQty(totalQty)} יח'</div>`;
    }catch(err){ console.error(err); box.innerHTML='<div class="items-empty">לא ניתן לטעון את פירוט ההזמנה</div>'; }
  })();
  // שליחת פרוטוקול לחתימה: יצירת קישור אישי ← פתיחת וואטסאפ עם ההודעה
  if($('#waProtoBtn')) $('#waProtoBtn').addEventListener('click',async e=>{
    e.preventDefault();
    const bp=$('#waProtoBtn');
    if(bp.classList.contains('off')) return;
    if(S.mode!=='live'){ toast('שליחת פרוטוקול לחתימה זמינה רק בחיבור אמיתי לענן'); return; }
    try{
      bp.style.opacity='.5';
      const token=await api.sendProtocol(o);
      const link=signUrl(token);
      const date=form.querySelector('[name=scheduled_date]').value;
      const slot=form.querySelector('[name=time_slot]').value;
      let msg=fillTpl(S.settings.wa_protocol,{name:o.customer_name,date,slot});
      msg = msg.includes('{קישור}') ? msg.replace(/\{קישור\}/g,link) : msg+'\n'+link;
      window.open(waLink(o.phone,msg),'_blank');
      toast('נוצר קישור חתימה — נפתח וואטסאפ לשליחה ✓');
      renderProtoList();
    }catch(err){ console.error(err); toast('שגיאה ביצירת הפרוטוקול: '+(err.message||err)); }
    finally{ bp.style.opacity=''; }
  });
  const slotOk = bindSlotField();
  // שיבוץ אנשי צוות — הרשימה מתחלפת בכל שינוי של הצוות בהזמנה (הערה 2)
  const teamSel=form.querySelector('select[name=team]');
  const abox=$('#assignBox');
  if(teamSel && abox && !isNew){
    teamSel.addEventListener('change',()=>{ abox.innerHTML=assignBoxHTML(o.id,teamSel.value); });
  }
  form.addEventListener('submit',async e=>{
    e.preventDefault();
    if(!canEdit()) return; // צופה / איש צוות — אין שמירה כלל
    const fd=new FormData(form);
    const vals={};
    for(const [k,v] of fd.entries()){
      if(['items_count','days_count','supply_days'].includes(k)) vals[k]=v===''?null:parseInt(v);
      else vals[k]=v===''?null:v;
    }
    if('days_count' in vals && vals.days_count==null) vals.days_count=1;
    // תיבת סימון לא מופיעה כלל ב-FormData כשהיא לא מסומנת — לכן קוראים אותה ישירות
    const fri=$('#fridayOk');
    if(fri) vals.friday_ok = fri.checked;
    if(!slotOk()) return;
    try{
      if(isNew){ await api.saveOrder({...o,...vals}); }
      else {
        // עדכון חלקי — רק שדות שהמשתמש שינה, כדי לא לדרוס עדכונים מקבילים
        const changed={};
        for(const k in vals){ if(vals[k]!==(o[k]??null)) changed[k]=vals[k]; }
        await api.patchOrder(o.id, changed);
        // השיבוץ נשמר בנפרד, ורק מתוך אנשי הצוות שנבחר בהזמנה
        if(abox && canEdit()){
          const allowed=membersOfTeam(vals.team||'').map(mm=>String(mm.id));
          const picked=[...abox.querySelectorAll('[data-mem]')].filter(c=>c.checked)
            .map(c=>c.dataset.mem).filter(id=>allowed.includes(String(id)));
          try{ await api.saveAssignments(o.id,picked); }
          catch(err){ console.error(err); toast('ההזמנה נשמרה, אך השיבוץ לא נשמר: '+(err.message||err)); }
        }
      }
      closeModal(); toast('ההזמנה נשמרה ✓'); render();
    }
    catch(err){ console.error(err); toast('שגיאה בשמירה: '+(err.message||err)); }
  });
  $('#btnCancel').onclick=closeModal;
  const del=$('#btnDelOrder');
  if(del) del.onclick=async ()=>{
    if(del.dataset.arm){ try{ await api.deleteOrder(o.id); closeModal(); toast('ההזמנה נמחקה'); render(); }catch(err){ toast('שגיאה במחיקה'); } }
    else { del.dataset.arm='1'; del.textContent='❗ לחיצה נוספת לאישור מחיקה'; }
  };
}

/* ================= 🔧 אזור מתקין — משותף להזמנות ולקריאות שירות ================= */
// תבנית האזור בכרטיס (תמונות שטח + דוחות אישור תקינות)
function techAreaHTML(kind){
  return `<div class="form-sep">🔧 אזור מתקין — תיעוד ודוח אישור תקינות</div>
    <div class="span4" id="techPhotos"></div>
    <div class="span4" id="reportList"></div>
    ${canMakeReport(kind)?`<div class="span4"><button type="button" class="btn btn-primary" id="btnMakeReport">📋 פתח דוח אישור תקינות ציוד</button>
    <span class="settings-note" style="margin-inline-start:10px">הטכנאי ממלא את הדוח בשטח — הלקוח והטכנאי חותמים</span></div>`:''}`;
}
// חיבור האזור: parent = הזמנה או קריאה, kind = 'order' | 'call'
function bindTechArea(parent, kind){
  // שמירה חלקית — רק שדה התמונות, כדי לא לדרוס עדכונים מקבילים
  const saveParent = () => kind==='call' ? api.patchCall(parent.id,{photos:parent.photos}) : api.patchOrder(parent.id,{photos:parent.photos});
  // איש צוות אינו רשאי לעדכן את ההזמנה — התמונות שלו נכתבות דרך פונקציה ייעודית
  // בשרת שנוגעת בשדה התמונות בלבד ומוודאת שההזמנה אכן שובצה אליו.
  const savePhotos = async (newUrls) => {
    if(kind!=='call' && isMember()){
      parent.photos = await api.memberAddOrderPhotos(parent.id, newUrls);
      return;
    }
    parent.photos = [...(Array.isArray(parent.photos)?parent.photos:[]), ...newUrls];
    await saveParent();
  };
  function renderTechPhotos(){
    const box=$('#techPhotos'); if(!box) return;
    const ph=Array.isArray(parent.photos)?parent.photos:[];
    box.innerHTML=`<label>📷 תמונות מהשטח${ph.length?` (${ph.length})`:''}</label>
      <div class="photo-grid">${ph.map(u=>`<a href="${esc(u)}" target="_blank"><img src="${esc(u)}" loading="lazy"></a>`).join('')}
      ${canDo('photos')?`<label class="photo-add" title="הוספת תמונות">➕<input type="file" id="photoInput" accept="image/*" multiple style="display:none"></label>`:''}</div>
      <div class="settings-note" id="photoNote" style="margin:4px 0 0"></div>`;
    const inp=$('#photoInput');
    if(inp) inp.addEventListener('change',async e=>{
      const files=[...e.target.files]; if(!files.length) return;
      if(S.mode!=='live'){ toast('העלאת תמונות זמינה רק בחיבור אמיתי לענן'); return; }
      $('#photoNote').textContent=`📤 מעלה ${files.length} תמונות...`;
      try{
        const urls=[];
        for(const f of files){ urls.push(await api.uploadPhoto(parent.id,f)); }
        await savePhotos(urls);
        renderTechPhotos(); toast('התמונות הועלו ותועדו ✓');
      }catch(err){ console.error(err); $('#photoNote').textContent=''; toast('שגיאה בהעלאת תמונה: '+(err.message||err)); }
    });
  }
  function renderReportList(){
    const box=$('#reportList'); if(!box) return;
    const list=(S.protocols||[]).filter(p=>(kind==='call'?p.call_id===parent.id:(p.order_id===parent.id&&!p.call_id)) && (p.doc_type||'').includes('תקינות'));
    if(!list.length){ box.innerHTML=''; return; }
    box.innerHTML=`<div class="others-box" style="background:#f6f5fb;border-color:#d9d5ee;margin:0"><div class="ob-title" style="color:#4a3aa7">📋 דוחות אישור תקינות:</div>
      ${list.map(p=>`<div class="other-row" style="cursor:default">
        ${p.status==='נחתם'?`<span class="pill p-green">✍️ נחתם</span>`:`<span class="pill p-yellow">ממתין לחתימה</span>`}
        <span class="ob-note">נוצר ${fmtDT(p.sent_at)}</span>
        ${p.signed_at?`<span class="ob-note">נחתם ${fmtDT(p.signed_at)}${p.signer_name?` ע"י ${esc(p.signer_name)}`:''}</span>`:''}
        ${p.status==='נחתם'
          ?`<a class="waze-btn" href="${SITE_BASE}/sign.html?view=${p.token}" target="_blank">📄 צפייה בדוח החתום</a>`
          :`<a class="waze-btn" href="${signUrl(p.token)}" target="_blank">✍️ פתיחה למילוי וחתימה</a>
           <a class="waze-btn" href="${waLink(parent.phone,'שלום '+(parent.customer_name||'')+', מצורף דוח אישור התקינות לחתימתך: '+signUrl(p.token))||'#'}" target="_blank">📱 וואטסאפ</a>`}
      </div>`).join('')}
    </div>`;
  }
  renderTechPhotos(); renderReportList();
  const mkBtn=$('#btnMakeReport');
  if(mkBtn) mkBtn.addEventListener('click',async ()=>{
    if(S.mode!=='live'){ toast('דוח אישור תקינות זמין רק בחיבור אמיתי לענן'); return; }
    try{
      mkBtn.disabled=true; mkBtn.textContent='יוצר דוח...';
      const token=await api.sendReport(parent, kind);
      renderReportList();
      window.open(signUrl(token),'_blank');
      toast('הדוח נוצר — נפתח למילוי וחתימה ✓');
    }catch(err){ console.error(err); toast('שגיאה ביצירת הדוח: '+(err.message||err)); }
    finally{ mkBtn.disabled=false; mkBtn.textContent='📋 פתח דוח אישור תקינות ציוד'; }
  });
}

/* אזור גיאוגרפי אוטומטי לפי עיר — פועל בפתיחת הכרטיס וגם תוך כדי הקלדה */
function bindAutoRegion(form){
  const cityIn=form.querySelector('[name=city]'), regSel=form.querySelector('[name=region]');
  if(!cityIn||!regSel) return;
  const sync=()=>{ const r=S.cities[cityIn.value.trim()]; if(r) regSel.value=r; };
  cityIn.addEventListener('change',sync);
  cityIn.addEventListener('input',sync);
  if(!regSel.value) sync(); // עיר כבר מולאה (למשל מפריוריטי) והאזור ריק — משלימים מיד
}

/* ================= טופס קריאת שירות ================= */
function openCallModal(id){
  EDIT_CTX='calls';
  if(id && !canView('service')){ toast('אין לך הרשאה לצפות בקריאות שירות'); return; }
  const c = id ? S.calls.find(x=>x.id===id) : {
    _new:true, id:null, call_number:'', opened_date:todayStr(), customer_name:'', phone:'',
    call_type:'תקלה', warranty:'', product:'', fault_details:'', city:'', region:'',
    address:'', customer_address:'', customer_email:'', customer_number:'',
    urgency:'רגילה', deadline:'', team:'', scheduled_date:'', time_slot:'', status:'חדש', notes:''
  };
  if(!c) return;
  const isNew=!!c._new;
  const wa=waLink(c.phone, fillTpl(S.settings.wa_service,{name:c.customer_name,date:c.scheduled_date,slot:c.time_slot}));
  $('#modalBox').innerHTML=`
  <h2>${isNew?'🛠️ קריאת שירות חדשה':`🛠️ ${esc(c.call_number||'קריאה')} — ${esc(c.customer_name||'')}`}${c.erp_status?` <span class="pill p-violet" title="הסטטוס בפריוריטי">פריוריטי: ${esc(c.erp_status)}</span>`:''}</h2>
  <div class="subline">${isNew?'פתיחת קריאה חדשה':`נפתחה ב-${fmtDate(c.opened_date)||'—'}`}</div>
  <form id="callForm"><div class="form-grid">
    ${(function(){
      const L=!isNew&&!!c.erp_status; // קריאה שסונכרנה מפריוריטי — שדות המקור נעולים לכולם
      const ro=L?'readonly class="ro"':'';
      const tag=L?SRC_TAG:'';
      return `
    <div><label>מס' קריאה${tag}</label><input ${L?'':'name="call_number"'} value="${esc(c.call_number||'')}" ${ro}></div>
    <div><label>תאריך פתיחה${tag}</label>${L?`<input value="${c.opened_date?fmtDate(c.opened_date):''}" readonly class="ro" dir="ltr">`:`<input type="date" name="opened_date" value="${esc(c.opened_date||'')}">`}</div>
    <div><label>מס' לקוח${tag}</label><input ${L?'':'name="customer_number"'} value="${esc(c.customer_number||'')}" ${ro} dir="ltr"></div>
    <div><label>שם לקוח${tag}</label><input ${L?'':'name="customer_name" required'} value="${esc(c.customer_name||'')}" ${ro}></div>
    <div><label>טלפון${tag}</label><input ${L?'':'name="phone"'} value="${esc(c.phone||'')}" ${ro} dir="ltr"></div>
    <div><label>אימייל לקוח${tag}</label><input ${L?'':'name="customer_email"'} value="${esc(c.customer_email||'')}" ${ro} dir="ltr"></div>
    <div><label>מהות הקריאה</label><select name="call_type" class="pilled ${STATUS_PILL[c.call_type]||''}" data-recolor>${CALL_TYPES.map(s=>`<option ${c.call_type===s?'selected':''}>${s}</option>`).join('')}</select></div>
    <div><label>באחריות?</label><select name="warranty"><option value=""></option><option ${c.warranty==='כן'?'selected':''}>כן</option><option ${c.warranty==='לא'?'selected':''}>לא</option></select></div>
    <div class="span2"><label>מוצר / תיאור${tag}</label><input ${L?'':'name="product"'} value="${esc(c.product||'')}" ${ro}></div>
    <div class="span2"><label>🏠 כתובת לקוח${tag} ${wazeBtn(c.customer_address)}</label><input ${L?'':'name="customer_address"'} value="${esc(c.customer_address||'')}" ${ro} placeholder="אין כתובת בכרטיס הלקוח"></div>
    <div class="span4"><label>פרטי התקלה${tag}</label>${L?`<input value="${esc(c.fault_details||'')}" readonly class="ro" title="${esc(c.fault_details||'')}">`:`<textarea name="fault_details" rows="2">${esc(c.fault_details||'')}</textarea>`}</div>`;
    })()}
    <div><label>סטטוס</label><select name="status" class="pilled ${STATUS_PILL[c.status]||''}" data-recolor>${CALL_STATUSES.map(s=>`<option ${c.status===s?'selected':''}>${s}</option>`).join('')}</select></div>
    <div><label>רמת דחיפות</label><select name="urgency" class="pilled ${STATUS_PILL[c.urgency]||''}" data-recolor>${URGENCIES.map(s=>`<option ${c.urgency===s?'selected':''}>${s}</option>`).join('')}</select></div>
    <div><label>עיר</label><input name="city" value="${esc(c.city||'')}" list="cityList2"></div>
    <div><label>אזור גיאוגרפי <span class="src-tag">אוטומטי לפי עיר</span></label><select name="region"><option value=""></option>${REGIONS.map(r=>`<option ${c.region===r?'selected':''}>${r}</option>`).join('')}</select></div>
    <div class="span2"><label>🚚 כתובת הגעה לקריאה ${wazeBtn(c.address?(c.address+' '+(c.city||'')):'')}</label><input name="address" value="${esc(c.address||'')}" placeholder="לאן הצוות מגיע (ניתן לעריכה)"></div>
    <div><label>צוות</label><select name="team"><option value="">— לא משויך —</option>${S.teams.filter(t=>t.active||t.name===c.team).map(t=>`<option ${c.team===t.name?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div>
    <div><label>תאריך מתואם</label><input type="date" name="scheduled_date" value="${esc(c.scheduled_date||'')}"></div>
    ${slotFieldHTML(c.time_slot)}
    <div><label>דדליין טיפול</label><input type="date" name="deadline" value="${esc(c.deadline||'')}"></div>
    <div class="span4"><label>הערות</label><textarea name="notes" rows="2">${esc(c.notes||'')}</textarea></div>
    ${!isNew?techAreaHTML('call'):''}
  </div>
  <datalist id="cityList2">${Object.keys(S.cities).slice(0,1500).map(x=>`<option value="${esc(x)}">`).join('')}</datalist>
  <div class="wa-row">
    <a class="btn-wa off" id="waCallBtn" href="#" target="_blank">📱 שלח וואטסאפ תיאום</a>
    <span class="settings-note" id="waCallHint" style="margin:0;align-self:center"></span>
  </div>
  <div class="modal-actions">
    ${canEdit()?`<button type="submit" class="btn btn-primary">💾 שמירה</button>`:''}
    <button type="button" class="btn btn-ghost" id="btnCancel2">${canEdit()?'ביטול':'סגירה'}</button>
    ${isNew||!isAdmin()?'':`<button type="button" class="del" id="btnDelCall">🗑️ מחיקת קריאה</button>`}
  </div></form>`;
  openModal();
  if(!canEdit()) $('#callForm').querySelectorAll('input,select,textarea').forEach(el=>el.disabled=true);
  const form=$('#callForm');
  bindAutoRegion(form); // אזור גיאוגרפי — תמיד אוטומטי לפי העיר
  // כפתור וואטסאפ חי — מגיב מיד לשינוי תאריך/שעות בכרטיס, עוד לפני שמירה
  function updWaCall(){
    const date=form.querySelector('[name=scheduled_date]').value;
    const slot=form.querySelector('[name=time_slot]').value;
    const link=waLink(c.phone, fillTpl(S.settings.wa_service,{name:c.customer_name,date,slot}));
    const ok=!!(link&&date);
    const b=$('#waCallBtn'), h=$('#waCallHint');
    if(!b) return;
    b.classList.toggle('off',!ok); b.href=ok?link:'#';
    h.textContent=ok?'':(c.phone?'(יש למלא תאריך מתואם)':'(אין טלפון ללקוח)');
  }
  form.addEventListener('input',updWaCall);
  form.addEventListener('change',updWaCall);
  updWaCall();
  bindTechArea(c,'call');
  const slotOkCall = bindSlotField();
  form.addEventListener('submit',async e=>{
    e.preventDefault();
    if(!canEdit()) return; // צופה / איש צוות — אין שמירה כלל
    const fd=new FormData(form);
    const vals={};
    for(const [k,v] of fd.entries()) vals[k]=v===''?null:v;
    if(!slotOkCall()) return;
    try{
      if(isNew){ await api.saveCall({...c,...vals}); }
      else {
        const changed={};
        for(const k in vals){ if(vals[k]!==(c[k]??null)) changed[k]=vals[k]; }
        await api.patchCall(c.id, changed);
      }
      closeModal(); toast('הקריאה נשמרה ✓'); render();
    }
    catch(err){ console.error(err); toast('שגיאה בשמירה: '+(err.message||err)); }
  });
  $('#btnCancel2').onclick=closeModal;
  const del=$('#btnDelCall');
  if(del) del.onclick=async ()=>{
    if(del.dataset.arm){ try{ await api.deleteCall(c.id); closeModal(); toast('הקריאה נמחקה'); render(); }catch(err){ toast('שגיאה במחיקה'); } }
    else { del.dataset.arm='1'; del.textContent='❗ לחיצה נוספת לאישור מחיקה'; }
  };
}

const SPEC_VIEW={x:10,y:8,s:.6};
function bindSpec(m){
  const vp=m.querySelector('#specVp'); if(!vp) return;
  const canvas=m.querySelector('#specCanvas'), svg=m.querySelector('#specEdges');
  const pop=m.querySelector('#specPop');
  const DESCS={};
  SPEC_ZONES.forEach(z=>z.rows.flat().forEach(n=>DESCS[n.id]=n));
  function apply(){ canvas.style.transform=`translate(${SPEC_VIEW.x}px,${SPEC_VIEW.y}px) scale(${SPEC_VIEW.s})`; }
  function drawEdges(){
    svg.innerHTML='<defs><marker id="sparr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6670"/></marker></defs>';
    canvas.querySelectorAll('.selabel').forEach(e=>e.remove());
    const cr=canvas.getBoundingClientRect(), sc=SPEC_VIEW.s;
    for(const e of SPEC_EDGES){
      const a=canvas.querySelector('#'+e.f), b=canvas.querySelector('#'+e.t);
      if(!a||!b) continue;
      const ra=a.getBoundingClientRect(), rb=b.getBoundingClientRect();
      const ax=(ra.left+ra.width/2-cr.left)/sc, ay=(ra.top+ra.height/2-cr.top)/sc;
      const bx=(rb.left+rb.width/2-cr.left)/sc, by=(rb.top+rb.height/2-cr.top)/sc;
      const aw=ra.width/2/sc, ah=ra.height/2/sc, bw=rb.width/2/sc, bh=rb.height/2/sc;
      const dx=bx-ax, dy=by-ay;
      let x1,y1,x2,y2,dpath;
      if(Math.abs(dy)<8){ // אותה שורה — קו אופקי ישר
        x1=ax+Math.sign(dx)*aw; y1=ay; x2=bx-Math.sign(dx)*bw; y2=by;
        dpath=`M ${x1} ${y1} L ${x2} ${y2}`;
      } else { // בין שורות — יציאה למטה/למעלה, עקומה אנכית
        y1=ay+Math.sign(dy)*ah; x1=ax; y2=by-Math.sign(dy)*bh; x2=bx;
        const my=(y1+y2)/2;
        dpath=`M ${x1} ${y1} C ${x1} ${my}, ${x2} ${my}, ${x2} ${y2}`;
      }
      const p=document.createElementNS('http://www.w3.org/2000/svg','path');
      p.setAttribute('d',dpath); p.setAttribute('fill','none');
      p.setAttribute('stroke', e.dash?'#8b98a3':'#5b6670');
      p.setAttribute('stroke-width', e.dash?'1.6':'2.2');
      if(e.dash) p.setAttribute('stroke-dasharray','5 5');
      p.setAttribute('marker-end','url(#sparr)');
      p.setAttribute('opacity', e.dash?'.6':'.85');
      svg.appendChild(p);
      if(e.l){
        const lab=document.createElement('div');
        lab.className='selabel '+(e.c||'');
        lab.textContent=e.l;
        lab.style.left=((x1+x2)/2)+'px'; lab.style.top=((y1+y2)/2)+'px';
        canvas.appendChild(lab);
      }
    }
    svg.style.width=canvas.scrollWidth+'px'; svg.style.height=canvas.scrollHeight+'px';
  }
  function fit(){
    SPEC_VIEW.s=Math.min((vp.clientWidth-20)/canvas.scrollWidth,(vp.clientHeight-20)/canvas.scrollHeight);
    SPEC_VIEW.x=vp.clientWidth-canvas.scrollWidth*SPEC_VIEW.s-10; SPEC_VIEW.y=10;
    apply();
  }
  let drag=null;
  vp.addEventListener('mousedown',e=>{ if(e.target.closest('.snode'))return; drag={x:e.clientX-SPEC_VIEW.x,y:e.clientY-SPEC_VIEW.y}; vp.classList.add('dragging'); });
  vp.addEventListener('mousemove',e=>{ if(!drag)return; SPEC_VIEW.x=e.clientX-drag.x; SPEC_VIEW.y=e.clientY-drag.y; apply(); });
  addEventListener('mouseup',()=>{ drag=null; vp.classList.remove('dragging'); });
  vp.addEventListener('wheel',e=>{
    e.preventDefault();
    const r=vp.getBoundingClientRect(), old=SPEC_VIEW.s;
    SPEC_VIEW.s=Math.min(2.2,Math.max(.25,SPEC_VIEW.s*(e.deltaY<0?1.12:0.89)));
    SPEC_VIEW.x=(e.clientX-r.left)-((e.clientX-r.left)-SPEC_VIEW.x)*(SPEC_VIEW.s/old);
    SPEC_VIEW.y=(e.clientY-r.top)-((e.clientY-r.top)-SPEC_VIEW.y)*(SPEC_VIEW.s/old);
    apply();
  },{passive:false});
  m.querySelector('#spIn').onclick=()=>{ SPEC_VIEW.s=Math.min(2.2,SPEC_VIEW.s*1.2); apply(); };
  m.querySelector('#spOut').onclick=()=>{ SPEC_VIEW.s=Math.max(.25,SPEC_VIEW.s/1.2); apply(); };
  m.querySelector('#spFit').onclick=fit;
  canvas.querySelectorAll('.snode').forEach(el=>el.addEventListener('click',e=>{
    e.stopPropagation();
    const n=DESCS[el.id];
    pop.querySelector('h3').textContent=n.n;
    let html=esc(n.d);
    if(n.fields){
      html+=`<table><tr><th>שם טכני בפריוריטי / במסד</th><th>בעברית</th></tr>${
        n.fields.map(([tech,heb])=>`<tr><td><code>${esc(tech)}</code></td><td>${esc(heb)}</td></tr>`).join('')
      }</table>`;
    }
    pop.querySelector('.pb').innerHTML=html;
    pop.style.display='block';
    pop.style.left=Math.max(10,Math.min(e.clientX,innerWidth-460))+'px';
    pop.style.top=Math.max(60,Math.min(e.clientY+14,innerHeight-Math.min(innerHeight*.7,n.fields?520:220)-20))+'px';
  }));
  pop.querySelector('.close').onclick=()=>pop.style.display='none';
  vp.addEventListener('click',e=>{ if(!e.target.closest('.snode')) pop.style.display='none'; });
  apply();
  requestAnimationFrame(()=>{
    drawEdges();
    // פתיחה ברוחב מלא (קריא), "התאם למסך" מציג הכל
    SPEC_VIEW.s=Math.min(1.15,(vp.clientWidth-24)/canvas.scrollWidth);
    SPEC_VIEW.x=vp.clientWidth-canvas.scrollWidth*SPEC_VIEW.s-12; SPEC_VIEW.y=10;
    apply();
  });
}

function avatarHtml(p,size){
  const s=size||34;
  if(p&&p.avatar_url) return `<img class="avatar" style="width:${s}px;height:${s}px" src="${esc(p.avatar_url)}" alt="">`;
  const initials=esc(((p&&p.full_name)||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join(''));
  return `<span class="avatar avatar-txt" style="width:${s}px;height:${s}px;font-size:${Math.round(s*.42)}px">${initials}</span>`;
}
function resizeImage(file){
  return new Promise((resolve,reject)=>{
    const rd=new FileReader();
    rd.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const c=document.createElement('canvas');
        const side=Math.min(img.width,img.height);
        c.width=160; c.height=160;
        c.getContext('2d').drawImage(img,(img.width-side)/2,(img.height-side)/2,side,side,0,0,160,160);
        resolve(c.toDataURL('image/jpeg',.82));
      };
      img.onerror=reject;
      img.src=rd.result;
    };
    rd.onerror=reject;
    rd.readAsDataURL(file);
  });
}

// הפיכת סעיפי מסך ההגדרות לאקורדיון — לחיצה על הכותרת פותחת את התוכן.
// מצב פתוח/סגור נשמר (S.setAccOpen) כדי שלא ייסגר אחרי כל שמירה.
function makeSettingsAccordion(m){
  S.setAccOpen = S.setAccOpen || new Set();
  m.querySelectorAll('.section').forEach(sec=>{
    const h=sec.querySelector('h3'); if(!h) return;
    const body=document.createElement('div'); body.className='acc-body';
    while(h.nextSibling) body.appendChild(h.nextSibling);
    sec.appendChild(body);
    sec.classList.add('acc');
    const key=h.textContent.trim();
    if(S.setAccOpen.has(key)) sec.classList.add('open');
    h.addEventListener('click',()=>{
      sec.classList.toggle('open');
      if(sec.classList.contains('open')) S.setAccOpen.add(key); else S.setAccOpen.delete(key);
    });
  });
}

function bindLogin(){
  const back=$('#lnkBack'); if(back) back.onclick=()=>{ S.authStage='login'; S.authError=null; render(); };
  const fg=$('#lnkForgot'); if(fg) fg.onclick=()=>{ S.authStage='forgot'; S.authError=null; render(); };
  const lf=$('#loginForm');
  if(lf) lf.addEventListener('submit',async e=>{
    e.preventDefault();
    const btn=lf.querySelector('button[type=submit]'); btn.disabled=true; btn.textContent='מתחבר...';
    const fd=new FormData(lf);
    S.authEmail=fd.get('email');
    try{
      S.authError=null;
      await api.login(fd.get('email'),fd.get('password'));
      try{ localStorage.setItem('iron_last_email',fd.get('email')); }catch(_e){} // זכירת האימייל לכניסה הבאה
      updateHeader(); render();
      if(S.mode==='live') toast(`שלום ${S.profile?.full_name||''} 👋`);
      return;
    }catch(err){
      S.authError = /Invalid login/i.test(err.message||'') ? 'אימייל או סיסמה שגויים' : /not confirmed/i.test(err.message||'') ? 'המשתמש טרם אושר — פנה למנהל' : (err.message||'שגיאת התחברות');
      render();
    }
  });
  const ff=$('#forgotForm');
  if(ff) ff.addEventListener('submit',async e=>{
    e.preventDefault();
    const btn=ff.querySelector('button[type=submit]'); btn.disabled=true; btn.textContent='שולח...';
    S.authEmail=new FormData(ff).get('email');
    try{
      S.authError=null;
      const {error}=await S.sb.auth.resetPasswordForEmail(S.authEmail);
      if(error) throw error;
      S.authStage='otp'; render();
    }catch(err){ S.authError=err.message||'שגיאה בשליחה'; render(); }
  });
  const of=$('#otpForm');
  if(of) of.addEventListener('submit',async e=>{
    e.preventDefault();
    const btn=of.querySelector('button[type=submit]'); btn.disabled=true; btn.textContent='מאפס...';
    const fd=new FormData(of);
    try{
      S.authError=null;
      if(fd.get('pass1')!==fd.get('pass2')) throw new Error('הסיסמאות לא זהות');
      const {error:ve}=await S.sb.auth.verifyOtp({email:S.authEmail, token:String(fd.get('token')).trim(), type:'recovery'});
      if(ve) throw new Error(/invalid|expired/i.test(ve.message)?'קוד שגוי או שפג תוקפו — נסה לשלוח קוד חדש':ve.message);
      const {error:ue}=await S.sb.auth.updateUser({password:fd.get('pass1')});
      if(ue) throw ue;
      toast('הסיסמה אופסה ✓');
      S.authStage='login'; await api.init(); updateHeader(); render();
      return;
    }catch(err){ S.authError=err.message||'שגיאה באיפוס'; render(); }
  });
  const nf=$('#newpassForm');
  if(nf) nf.addEventListener('submit',async e=>{
    e.preventDefault();
    const fd=new FormData(nf);
    try{
      S.authError=null;
      if(fd.get('pass1')!==fd.get('pass2')) throw new Error('הסיסמאות לא זהות');
      const {error}=await S.sb.auth.updateUser({password:fd.get('pass1')});
      if(error) throw error;
      toast('הסיסמה עודכנה ✓');
      S.authStage='login'; await api.init(); updateHeader(); render();
      return;
    }catch(err){ S.authError=err.message||'שגיאה'; render(); }
  });
}
function updateHeader(){
  const badge=$('#connBadge');
  const uc=$('#userChip');
  if(S.mode==='live'){
    badge.classList.add('live'); $('#connText').textContent='מחובר · שמירה בענן';
  } else if(S.mode==='auth'){
    badge.classList.remove('live'); $('#connText').textContent='נדרשת התחברות';
  } else $('#connText').textContent='מצב דמו · ללא שמירה';
  if(uc){
    if(S.user&&S.profile){
      uc.style.display='';
      uc.style.cursor='pointer';
      uc.title='הפרופיל שלי';
      uc.innerHTML=`${avatarHtml(S.profile,26)} ${esc(S.profile.full_name||S.user.email)} <small>(${ROLE_LABELS[role()]||role()})</small> <button id="btnLogout" title="התנתקות">⎋</button>`;
      uc.onclick=e=>{ if(e.target.id!=='btnLogout') openProfileModal(); };
      $('#btnLogout').onclick=async e=>{ e.stopPropagation(); await api.logout(); updateHeader(); render(); };
    } else uc.style.display='none';
  }
  $('#btnSync').style.display = (S.mode==='live'&&canEdit())||S.mode==='demo' ? '' : 'none';
  updateSyncBadge();
}
function bindInlineEdits(scope){
  scope.querySelectorAll('[data-ie]').forEach(el=>el.addEventListener('change',async ()=>{
    const [kind,id,field]=el.dataset.ie.split('|');
    const rec = kind==='o' ? S.orders.find(x=>x.id===id) : S.calls.find(x=>x.id===id);
    if(!rec) return;
    const val = el.value===''?null:el.value;
    try{
      if(kind==='o') await api.patchOrder(id,{[field]:val}); else await api.patchCall(id,{[field]:val});
      toast('נשמר ✓');
    }catch(err){ console.error(err); toast('שגיאה בשמירה: '+(err.message||err)); }
    render();
  }));
}

/* ================= בדיקת גרסה חדשה (באנר עדכון) ================= */
function watchForUpdates(){
  if(location.protocol==='file:') return; // רלוונטי רק לאתר
  let shown=false;
  async function check(){
    if(shown) return;
    try{
      const r=await fetch('/version.json?ts='+Date.now(),{cache:'no-store'});
      if(!r.ok) return;
      const d=await r.json();
      if(d.version && d.version!==APP_VERSION && /^[\d.]+$/.test(d.version)){
        if(shown || document.getElementById('updBar')) return;
        shown=true;
        const bar=document.createElement('div');
        bar.id='updBar';
        bar.style.cssText='position:fixed;top:0;right:0;left:0;z-index:9999;background:#6a9f85;color:#06231a;font-weight:700;font-size:.9rem;padding:9px 14px;display:flex;align-items:center;justify-content:center;gap:12px;box-shadow:0 2px 10px rgba(0,0,0,.25)';
        bar.innerHTML=`✨ גרסה חדשה של המערכת זמינה (v${d.version}) <button id="updNow" style="background:#06231a;color:#fff;border:none;border-radius:8px;padding:5px 16px;font-weight:700;cursor:pointer;font-family:inherit">רענן עכשיו</button>`;
        document.body.appendChild(bar);
        document.getElementById('updNow').addEventListener('click',()=>location.reload());
      }
    }catch(_e){ /* אין רשת — ננסה בפעם הבאה */ }
  }
  setInterval(check, 5*60*1000); // כל 5 דקות
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') check(); });
  setTimeout(check, 30*1000); // בדיקה ראשונה חצי דקה אחרי הטעינה
}

/* ================= אתחול ================= */
(async function(){
  await api.init();
  $('#btnSync').addEventListener('click',syncPriority);
  updateHeader();
  render();
  watchForUpdates();
})();
